# NOVAI Electron 桌面版云端打包流水线
# 触发：手动触发（Actions 页面 Run workflow）或推送 v* 标签（自动发布 GitHub Release）
# 构建链：PyInstaller 打后端二进制（免 Python 分发）→ electron-builder 打 Electron 壳
# 产物：desktop/release/*（artifact；打 v 标签时发 Release，供 electron-updater 自动更新）
name: build-electron

on:
  workflow_dispatch:
    # platforms 留空 = 三平台全量（与 tag push 行为一致）；非空 = 只打指定平台，
    # 元素形如 {"platform":"windows-latest","builder":"--win"}
    inputs:
      platforms:
        description: '只构建指定平台时传入 JSON 数组（例：[{"platform":"windows-latest","builder":"--win"}]）；留空 = 三平台全量'
        required: false
        default: ''
        type: string
      release_tag:
        description: '手动重打单平台时发布到已有 Release 的 tag（例：v2.0.04）；留空 = 只在 v* tag push 时发布'
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        # workflow_dispatch 传了 platforms 时只打该平台；其它情况（tag push / 空参数）走原三平台默认数组。
        # 用 event_name 短路，push 事件不依赖 inputs 上下文是否存在。
        include: ${{ fromJSON((github.event_name == 'workflow_dispatch' && github.event.inputs.platforms) || '[{"platform":"macos-latest","builder":"--mac"},{"platform":"windows-latest","builder":"--win"},{"platform":"ubuntu-latest","builder":"--linux"}]') }}

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Windows 安装包内置 GPL 静态版 ffmpeg/ffprobe：下载 BtbN FFmpeg-Builds → 解压 → 只取
      # bin/ffmpeg.exe、bin/ffprobe.exe、LICENSE.txt 到 desktop/vendor/ffmpeg/win/，由 package.json 的
      # win.extraResources 打进 resources/bin/win（mac/linux 任务不跑这步，包内容不变）。
      # 用 GPL 构建：GPL 版含 libx264 / libx265；LGPL 版不含这两个 GPL-only 编码器，而 main.py 的
      # 云压缩与时间线 / 剪辑导出写死 libx264，只有 GPL 版才能跑通。
      # GPL 分发义务 = 随包提供 FFmpeg 的 LICENSE（GPLv3 原文）与源码获取地址（本步骤生成 SOURCE.txt）。
      - name: Download bundled ffmpeg (windows, GPL static)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = 'desktop/vendor/ffmpeg/win'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg-win64-gpl.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'ffmpeg-win64-gpl'
          # 尝试顺序（每个 URL 最多 2 次，全部失败才 ::error:: 退出）：
          #   1) latest 的 master 静态 GPL 构建（滚动入口）；
          #   2) 带版本的 autobuild 静态 GPL 资产兜底。BtbN 的 latest release 现在只有
          #      master / winarm64 构建，ffmpeg-n7.1-latest-*.zip 这类资产已不存在（实测 404），
          #      所以固定 BtbN 保留策略里"每月最后一个构建"（保留 2 年）的 2026-10 资产；
          #      若它将来也 404，去 https://github.com/BtbN/FFmpeg-Builds/releases 换一个
          #      ffmpeg-N-*-win64-gpl.zip（不要带 -shared 的）。
          $urls = @(
            'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip',
            'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-31-12-59/ffmpeg-N-128227-g4811625b5f-win64-gpl.zip'
          )
          $downloaded = $false
          foreach ($url in $urls) {
            for ($attempt = 1; $attempt -le 2; $attempt++) {
              try {
                Write-Host "下载 $url（第 $attempt/2 次）"
                Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing -TimeoutSec 600
                $downloaded = $true
                break
              } catch {
                Write-Host "::warning::下载失败（$url 第 $attempt 次）：$($_.Exception.Message)"
                if (Test-Path $zip) { Remove-Item $zip -Force }
                Start-Sleep -Seconds 5
              }
            }
            if ($downloaded) { break }
          }
          if (-not $downloaded) {
            Write-Host '::error::ffmpeg 下载失败：两个候选 URL 各重试 2 次仍失败'
            exit 1
          }
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $ffmpeg = Get-ChildItem -Path $extract -Filter 'ffmpeg.exe' -Recurse -File | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path $extract -Filter 'ffprobe.exe' -Recurse -File | Select-Object -First 1
          if (-not $ffmpeg -or $ffmpeg.Length -lt 1MB) {
            Write-Host '::error::压缩包里没有有效的 bin/ffmpeg.exe'
            exit 1
          }
          if (-not $ffprobe -or $ffprobe.Length -lt 1MB) {
            Write-Host '::error::压缩包里没有有效的 bin/ffprobe.exe'
            exit 1
          }
          Copy-Item -LiteralPath $ffmpeg.FullName -Destination (Join-Path $dest 'ffmpeg.exe') -Force
          Copy-Item -LiteralPath $ffprobe.FullName -Destination (Join-Path $dest 'ffprobe.exe') -Force
          $license = Get-ChildItem -Path $extract -Filter 'LICENSE.txt' -Recurse -File | Select-Object -First 1
          if (-not $license) {
            Write-Host '::error::压缩包里没找到 LICENSE.txt：GPL 分发义务要求随包附许可原文'
            exit 1
          }
          Copy-Item -LiteralPath $license.FullName -Destination (Join-Path $dest 'LICENSE.txt') -Force
          foreach ($exe in @('ffmpeg.exe', 'ffprobe.exe')) {
            $path = Join-Path $dest $exe
            $size = (Get-Item -LiteralPath $path).Length
            if ($size -lt 1MB) {
              Write-Host "::error::$path 大小异常（$size 字节）"
              exit 1
            }
            Write-Host "$exe = $size 字节"
          }
          # GPL 源码义务：把实际构建版本（含提交号）与源码获取地址随包落成 SOURCE.txt。
          $versionLine = (& (Join-Path $dest 'ffmpeg.exe') -version | Select-Object -First 1)
          @(
            'FFmpeg / FFprobe — GPL 静态构建（BtbN FFmpeg-Builds，未修改）'
            "版本：$versionLine"
            '许可：GPLv3，原文见同目录 LICENSE.txt'
            '构建来源：https://github.com/BtbN/FFmpeg-Builds/releases'
            '源码获取：https://github.com/FFmpeg/FFmpeg（版本行 N-<号>-g<提交> 即对应 commit）'
            '          构建脚本：https://github.com/BtbN/FFmpeg-Builds'
          ) | Set-Content -LiteralPath (Join-Path $dest 'SOURCE.txt') -Encoding utf8
          Write-Host $versionLine
          & (Join-Path $dest 'ffprobe.exe') -version | Select-Object -First 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build backend binary (PyInstaller)
        shell: bash
        run: |
          mkdir -p desktop/resources/backend
          # server/protocols/*.json 是数据文件，不带 --add-data 的话打不进 PyInstaller 包
          if [ "$RUNNER_OS" = "Windows" ]; then SEP=";"; else SEP=":"; fi
          pyinstaller --onefile --console -y --name NOVAI \
            --hidden-import=uvicorn.logging \
            --hidden-import=uvicorn.loops.auto \
            --hidden-import=uvicorn.protocols.http.auto \
            --hidden-import=fastapi --hidden-import=aiofiles --hidden-import=pydantic \
            --hidden-import=python_multipart --hidden-import=httpx --hidden-import=PIL \
            --hidden-import=requests --hidden-import=uvicorn.protocols.websockets.auto \
            --hidden-import=uvicorn.lifespan.on --hidden-import=websockets \
            --add-data "server${SEP}server" \
            main.py
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/NOVAI.exe desktop/resources/backend/NOVAI.exe
          else
            cp dist/NOVAI desktop/resources/backend/NOVAI
          fi
          # 注意：resources/backend 里只能放后端二进制本身。
          # VERSION/requirements.txt 已由 package.json 的 extraResources 从
          # .version / ../requirements.txt 拷到同一目标路径，再拷一份会因
          # 目标重名（EEXIST hard link 冲突）导致 mac/linux 打包失败。

      # electron 的 postinstall 要下载二进制，云端偶尔 504（Windows 任务尤其明显）。
      # 前两次走默认源，第 3 次换国内镜像兜底；三次都失败才让任务失败。
      - name: Install Electron deps
        working-directory: desktop
        shell: bash
        run: |
          ok=0
          for attempt in 1 2 3; do
            if [ "$attempt" = "3" ]; then
              export ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/
              echo "npm install 第 $attempt/3 次，使用 ELECTRON_MIRROR=$ELECTRON_MIRROR"
            else
              echo "npm install 第 $attempt/3 次（默认源）"
            fi
            if npm install --no-audit --no-fund; then
              ok=1
              break
            fi
            echo "第 $attempt 次失败：清理 node_modules，等待 15 秒后重试"
            rm -rf node_modules
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            echo "::error::npm install 连续 3 次失败（electron 二进制下载）"
            exit 1
          fi
          if [ ! -d node_modules/electron ]; then
            echo "::error::安装后缺少 node_modules/electron"
            exit 1
          fi

      # 把 PyInstaller 后端二进制登记进 electron-builder 的 extraResources，
      # 使安装包内 Resources/backend 包含可执行后端（目标机免 Python）。
      - name: Register backend binary for electron-builder
        working-directory: desktop
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));const ext=p.build.extraResources||[];if(!ext.some(e=>e.to==='backend' && e.from==='resources/backend')){ext.push({from:'resources/backend',to:'backend'});p.build.extraResources=ext;fs.writeFileSync('package.json',JSON.stringify(p,null,2));}console.log('registered');"

      - name: Smoke-test bundled backend (windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          ./desktop/resources/backend/NOVAI.exe --port 3099 > backend_smoke.log 2>&1 &
          BE=$!
          ok=0
          # 用 /api/changelog 做存活探针（static 在 electron-builder 阶段才就位，此步只有 NOVAI.exe）
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 3 http://127.0.0.1:3099/api/changelog || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 3
          done
          if [ "$ok" != "1" ]; then
            echo "::error::bundled backend failed to start (smoke test)"
            cat backend_smoke.log || true
            kill $BE 2>/dev/null || true
            exit 1
          fi
          echo "backend smoke test OK"
          kill $BE 2>/dev/null || true

      # 包装前对齐版本与更新内容：desktop/package.json 的 version 必须是合法 semver
      # （VERSION 是显示串，可能写成 2.0.02），static/update-notes.json 也要跟上根文件，
      # 否则更新完弹窗仍显示旧版本内容。
      - name: Sync desktop version from VERSION
        working-directory: desktop
        run: node scripts/sync-version.js

      - name: Sync update notes to static
        run: python tools/sync_update_notes.py

      - name: Build Electron app
        working-directory: desktop
        run: npx electron-builder ${{ matrix.builder }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # 断言安装包产物（win-unpacked）里真的有 ffmpeg/ffprobe，而不是只下载到了工作区。
      - name: Smoke-test bundled ffmpeg in package (windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          base=desktop/release/win-unpacked/resources/bin/win
          ok=1
          for exe in ffmpeg.exe ffprobe.exe; do
            file="$base/$exe"
            if [ ! -s "$file" ]; then
              echo "::error::桌面产物缺少 $file"
              ok=0
              continue
            fi
            size=$(wc -c < "$file" | tr -d ' ')
            echo "$file = $size 字节"
            if [ "$size" -lt 1048576 ]; then
              echo "::error::$file 体积异常（$size 字节）"
              ok=0
            fi
          done
          if [ "$ok" != "1" ]; then
            ls -R desktop/release/win-unpacked/resources 2>/dev/null | head -100 || true
            exit 1
          fi
          "$base/ffmpeg.exe" -version | head -1
          "$base/ffprobe.exe" -version | head -1

      # 无开发者证书时只能 ad-hoc 签名（desktop/scripts/adhoc-sign.js 在 afterPack 里做）；
      # 这里把结果打出来：没签上会在 Actions 里以 warning 标注，避免又发一个「已损坏」的 dmg。
      - name: Check macOS ad-hoc signature
        if: matrix.platform == 'macos-latest'
        working-directory: desktop
        run: |
          app=$(ls -d release/mac*/*.app 2>/dev/null | head -1)
          if [ -z "$app" ]; then
            echo "::warning::未找到 macOS .app，跳过签名检查"
            exit 0
          fi
          if codesign --verify --deep --strict --verbose=2 "$app"; then
            echo "ad-hoc 签名校验通过：$app"
          else
            echo "::warning::macOS 产物没有有效签名，下载后可能提示「已损坏」：$app"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVAI-electron
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.blockmap
            desktop/release/latest*.yml
          if-no-files-found: warn

      - name: Release (tag or manual release_tag)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          # tag push 时取不到 event.inputs → 落到 github.ref_name（行为不变）；
          # 手动重打单平台时用它指定的已有 Release。用 event_name 短路，push 事件不依赖 inputs 上下文。
          tag_name: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag) || github.ref_name }}
          # 版本号带 "-"（如 v1.0.112-beta.1）的 tag 标记为 prerelease，
          # 正式版客户端（allowPrerelease=false）不会收到测试版更新；
          # 手动重打时也按 event.inputs.release_tag 判断，避免把预发布版误改成正式版
          prerelease: ${{ contains((github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag) || github.ref_name, '-') }}
          files: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.blockmap
            desktop/release/latest*.yml
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 国内用户拉不动 GitHub Releases：把更新产物同步到国内镜像。
      # - ModelScope（bllack/NOVAI-releases 模型仓库）：客户端自动更新的国内源，
      #   Electron 端 GitHub 检查失败时自动切换到这个 generic 更新地址：
      #   https://modelscope.cn/models/bllack/NOVAI-releases/resolve/master/electron-release
      # - Gitee（invaders/novai Release 附件）：人工下载镜像（网页下载有验证码，
      #   不适合做自动更新源，只兜底手动安装）。
      # 需要在仓库 Settings → Secrets 配置：MODELSCOPE_TOKEN、GITEE_TOKEN（可选）。
      # 该步骤失败不影响主构建（continue-on-error），产物仍可从 GitHub Release 获取。
      - name: Sync update artifacts to domestic mirrors (tag or manual release_tag)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
        continue-on-error: true
        timeout-minutes: 60
        shell: bash
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_TAG: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag) || github.ref_name }}
          RUNNER_OS: ${{ runner.os }}
        run: bash .github/scripts/sync-domestic-release.sh

      - name: 同步安装包到 Gitee（自动分卷，tag or manual release_tag）
        if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')) && matrix.platform == 'ubuntu-latest'
        continue-on-error: true
        timeout-minutes: 150
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: bash .github/scripts/sync-gitee-installers.sh "${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag) || github.ref_name }}"
