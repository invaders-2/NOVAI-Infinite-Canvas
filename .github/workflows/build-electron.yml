# NOVAI Electron 桌面版云端打包流水线
# 触发：手动触发（Actions 页面 Run workflow）或推送 v* 标签（自动发布 GitHub Release）
# 构建链：PyInstaller 打后端二进制（免 Python 分发）→ electron-builder 打 Electron 壳
# 产物：desktop/release/*（artifact；打 v 标签时发 Release，供 electron-updater 自动更新）
name: build-electron

on:
  workflow_dispatch:
    # platforms 留空 = 三平台全量（与 tag push 行为一致）；非空 = 只打指定平台，
    # 元素形如 {"platform":"windows-latest","builder":"--win"}
    inputs:
      platforms:
        description: '只构建指定平台时传入 JSON 数组（例：[{"platform":"windows-latest","builder":"--win"}]）；留空 = 三平台全量'
        required: false
        default: ''
        type: string
      release_tag:
        description: '手动重打单平台时发布到已有 Release 的 tag（例：v2.0.04）；留空 = 只在 v* tag push 时发布'
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        # workflow_dispatch 传了 platforms 时只打该平台；其它情况（tag push / 空参数）走原三平台默认数组。
        # 用 event_name 短路，push 事件不依赖 inputs 上下文是否存在。
        include: ${{ fromJSON((github.event_name == 'workflow_dispatch' && github.event.inputs.platforms) || '[{"platform":"macos-latest","builder":"--mac"},{"platform":"windows-latest","builder":"--win"},{"platform":"ubuntu-latest","builder":"--linux"}]') }}

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build backend binary (PyInstaller)
        shell: bash
        run: |
          mkdir -p desktop/resources/backend
          # server/protocols/*.json 是数据文件，不带 --add-data 的话打不进 PyInstaller 包
          if [ "$RUNNER_OS" = "Windows" ]; then SEP=";"; else SEP=":"; fi
          pyinstaller --onefile --console -y --name NOVAI \
            --hidden-import=uvicorn.logging \
            --hidden-import=uvicorn.loops.auto \
            --hidden-import=uvicorn.protocols.http.auto \
            --hidden-import=fastapi --hidden-import=aiofiles --hidden-import=pydantic \
            --hidden-import=python_multipart --hidden-import=httpx --hidden-import=PIL \
            --hidden-import=requests --hidden-import=uvicorn.protocols.websockets.auto \
            --hidden-import=uvicorn.lifespan.on --hidden-import=websockets \
            --add-data "server${SEP}server" \
            main.py
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/NOVAI.exe desktop/resources/backend/NOVAI.exe
          else
            cp dist/NOVAI desktop/resources/backend/NOVAI
          fi
          # 注意：resources/backend 里只能放后端二进制本身。
          # VERSION/requirements.txt 已由 package.json 的 extraResources 从
          # .version / ../requirements.txt 拷到同一目标路径，再拷一份会因
          # 目标重名（EEXIST hard link 冲突）导致 mac/linux 打包失败。

      # electron 的 postinstall 要下载二进制，云端偶尔 504（Windows 任务尤其明显）。
      # 前两次走默认源，第 3 次换国内镜像兜底；三次都失败才让任务失败。
      - name: Install Electron deps
        working-directory: desktop
        shell: bash
        run: |
          ok=0
          for attempt in 1 2 3; do
            if [ "$attempt" = "3" ]; then
              export ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/
              echo "npm install 第 $attempt/3 次，使用 ELECTRON_MIRROR=$ELECTRON_MIRROR"
            else
              echo "npm install 第 $attempt/3 次（默认源）"
            fi
            if npm install --no-audit --no-fund; then
              ok=1
              break
            fi
            echo "第 $attempt 次失败：清理 node_modules，等待 15 秒后重试"
            rm -rf node_modules
            sleep 15
          done
          if [ "$ok" != "1" ]; then
            echo "::error::npm install 连续 3 次失败（electron 二进制下载）"
            exit 1
          fi
          if [ ! -d node_modules/electron ]; then
            echo "::error::安装后缺少 node_modules/electron"
            exit 1
          fi

      # 把 PyInstaller 后端二进制登记进 electron-builder 的 extraResources，
      # 使安装包内 Resources/backend 包含可执行后端（目标机免 Python）。
      - name: Register backend binary for electron-builder
        working-directory: desktop
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));const ext=p.build.extraResources||[];if(!ext.some(e=>e.to==='backend' && e.from==='resources/backend')){ext.push({from:'resources/backend',to:'backend'});p.build.extraResources=ext;fs.writeFileSync('package.json',JSON.stringify(p,null,2));}console.log('registered');"

      - name: Smoke-test bundled backend (windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          ./desktop/resources/backend/NOVAI.exe --port 3099 > backend_smoke.log 2>&1 &
          BE=$!
          ok=0
          # 用 /api/changelog 做存活探针（static 在 electron-builder 阶段才就位，此步只有 NOVAI.exe）
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 3 http://127.0.0.1:3099/api/changelog || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 3
          done
          if [ "$ok" != "1" ]; then
            echo "::error::bundled backend failed to start (smoke test)"
            cat backend_smoke.log || true
            kill $BE 2>/dev/null || true
            exit 1
          fi
          echo "backend smoke test OK"
          kill $BE 2>/dev/null || true

      # 包装前对齐版本与更新内容：desktop/package.json 的 version 必须是合法 semver
      # （VERSION 是显示串，可能写成 2.0.02），static/update-notes.json 也要跟上根文件，
      # 否则更新完弹窗仍显示旧版本内容。
      - name: Sync desktop version from VERSION
        working-directory: desktop
        run: node scripts/sync-version.js

      - name: Sync update notes to static
        run: python tools/sync_update_notes.py

      - name: Build Electron app
        working-directory: desktop
        run: npx electron-builder ${{ matrix.builder }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # 无开发者证书时只能 ad-hoc 签名（desktop/scripts/adhoc-sign.js 在 afterPack 里做）；
      # 这里把结果打出来：没签上会在 Actions 里以 warning 标注，避免又发一个「已损坏」的 dmg。
      - name: Check macOS ad-hoc signature
        if: matrix.platform == 'macos-latest'
        working-directory: desktop
        run: |
          app=$(ls -d release/mac*/*.app 2>/dev/null | head -1)
          if [ -z "$app" ]; then
            echo "::warning::未找到 macOS .app，跳过签名检查"
            exit 0
          fi
          if codesign --verify --deep --strict --verbose=2 "$app"; then
            echo "ad-hoc 签名校验通过：$app"
          else
            echo "::warning::macOS 产物没有有效签名，下载后可能提示「已损坏」：$app"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOVAI-electron
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.blockmap
            desktop/release/latest*.yml
          if-no-files-found: warn

      - name: Release (tag or manual release_tag)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          # tag push 时取不到 event.inputs → 落到 github.ref_name（行为不变）；
          # 手动重打单平台时用它指定的已有 Release。用 event_name 短路，push 事件不依赖 inputs 上下文。
          tag_name: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag) || github.ref_name }}
          # 版本号带 "-"（如 v1.0.112-beta.1）的 tag 标记为 prerelease，
          # 正式版客户端（allowPrerelease=false）不会收到测试版更新；
          # 手动重打时也按 event.inputs.release_tag 判断，避免把预发布版误改成正式版
          prerelease: ${{ contains((github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag) || github.ref_name, '-') }}
          files: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.blockmap
            desktop/release/latest*.yml
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 国内用户拉不动 GitHub Releases：把更新产物同步到国内镜像。
      # - ModelScope（bllack/NOVAI-releases 模型仓库）：客户端自动更新的国内源，
      #   Electron 端 GitHub 检查失败时自动切换到这个 generic 更新地址：
      #   https://modelscope.cn/models/bllack/NOVAI-releases/resolve/master/electron-release
      # - Gitee（invaders/novai Release 附件）：人工下载镜像（网页下载有验证码，
      #   不适合做自动更新源，只兜底手动安装）。
      # 需要在仓库 Settings → Secrets 配置：MODELSCOPE_TOKEN、GITEE_TOKEN（可选）。
      # 该步骤失败不影响主构建（continue-on-error），产物仍可从 GitHub Release 获取。
      - name: Sync update artifacts to domestic mirrors (tag or manual release_tag)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
        continue-on-error: true
        timeout-minutes: 60
        shell: bash
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_TAG: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag) || github.ref_name }}
          RUNNER_OS: ${{ runner.os }}
        run: bash .github/scripts/sync-domestic-release.sh

      - name: 同步安装包到 Gitee（自动分卷，tag or manual release_tag）
        if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')) && matrix.platform == 'ubuntu-latest'
        continue-on-error: true
        timeout-minutes: 150
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: bash .github/scripts/sync-gitee-installers.sh "${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag) || github.ref_name }}"
