# 国内镜像同步（手动触发）：把某个已发布 tag 的产物补齐到 Gitee / ModelScope。
#
# 为什么单独做一条流水线：
#   · build-win / build-mac 的安装包在 dist-desktop/，不在 build-electron 的 desktop/release/；
#   · 三个 workflow 是并行跑的，tag 推上去时谁先谁后不确定，所以「等 Release 资产齐全」
#     这件事放在这里做（--wait-for-assets + wait_minutes），而不是靠人掐时间。
#
# 行为（2026-11 起）：
#   · Gitee：安装包 >95MB 自动分卷（.partNN），脚本可重复执行（已传过的卷跳过）；
#   · ModelScope：electron-release/ 自动更新产物 + 仓库根目录的 VERSION / static/update-notes.json；
#   · 同步失败不再静默：步骤标红、::error::、job summary 列「缺哪些文件 + 影响哪一端用户」；
#   · 最后的 mirror-verify 会再跑一次只读校验，**不完整就让本次运行失败**（workflow_dispatch
#     是补传入口，必须红）。
#
# 用法：Actions → sync-mirrors → Run workflow，填 tag（如 v2.0.06）。
#       build-win / build-mac 还没传完安装包也没关系，wait_minutes 会等它们。
name: sync-mirrors

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（例如 v2.0.06）'
        required: true
        type: string
      wait_minutes:
        description: '等 Release 里出现安装包的最长分钟数（build-win / build-mac 可能还在跑）'
        required: false
        default: '30'
        type: string

permissions:
  contents: read

jobs:
  gitee-installers:
    name: Gitee 安装包分卷同步
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: 下载安装包并分卷上传到 Gitee
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          WAIT_MINUTES: ${{ inputs.wait_minutes }}
        run: bash .github/scripts/sync-gitee-installers.sh "${{ inputs.tag }}" --wait-for-assets $(( ${WAIT_MINUTES:-30} * 60 ))

  electron-mirrors:
    name: Electron 更新产物同步（ModelScope 自动更新源）
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: 下载该 tag 的 Electron 更新产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p desktop/release
          gh release download "${{ inputs.tag }}" --dir desktop/release \
            --pattern 'latest*.yml' --pattern '*.blockmap' \
            --pattern '*.AppImage' --pattern '*.deb' \
            --pattern 'NOVAI-*-arm64.dmg' --pattern 'NOVAI-*-arm64-mac.zip' \
            --pattern 'NOVAI-Electron-Setup.*.exe'
          ls -la desktop/release

      - name: 同步到 ModelScope（Gitee 大文件由 gitee-installers 分卷负责）
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          SYNC_GITEE: '0'
        run: bash .github/scripts/sync-domestic-release.sh

  mirror-verify:
    name: 镜像完整性校验（不完整则本次运行失败）
    needs: [gitee-installers, electron-mirrors]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: 校验 Release 资产与国内镜像
        id: check
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: python3 tools/check_release_completeness.py "$TAG" --write-summary "$GITHUB_STEP_SUMMARY"

      - name: 镜像不完整 → 本次运行判失败
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error::国内镜像仍不完整（缺失文件见 job summary）。GitHub Release 已发布，不需要回滚；按 docs/release-checklist.md 排查后重跑。"
          exit 1
