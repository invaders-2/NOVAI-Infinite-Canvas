@property --beam-angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
.nv-beam {
    position: relative;
    isolation: isolate;
    --beam-core: rgba(180,255,60,.95);
    --beam-mid: rgba(180,255,60,.45);
    --beam-glow: rgba(180,255,60,.55);
}
.nv-beam::before {
    content: '';
    position: absolute; inset: 0; border-radius: inherit; padding: 2px;
    background: conic-gradient(from var(--beam-angle), transparent 0deg, var(--beam-core) 28deg, var(--beam-mid) 70deg, transparent 115deg);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
    pointer-events: none; z-index: 2;
    animation: nv-beam-spin 2.6s linear infinite;
}
.nv-beam::after {
    content: '';
    position: absolute; inset: 0; border-radius: inherit; padding: 5px;
    background: conic-gradient(from var(--beam-angle), transparent 0deg, var(--beam-glow) 45deg, transparent 120deg);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
    filter: blur(8px); opacity: .4; pointer-events: none; z-index: 1;
    animation: nv-beam-spin 2.6s linear infinite;
}
@keyframes nv-beam-spin { to { --beam-angle: 360deg; } }
/* 深色主题通用白光（同 online.html），发送按钮下方覆盖回柠檬绿 */
html.theme-dark .nv-beam, html.studio-theme-dark .nv-beam {
    --beam-core: rgba(255,255,255,.6);
    --beam-mid: rgba(255,255,255,.26);
    --beam-glow: rgba(255,255,255,.4);
}

/* ── 发送按钮：深底白字 + nv-beam 柠檬绿光束（延续 online genBtn 定稿） ── */
#sendBtn.nv-beam,
html.theme-dark #sendBtn.nv-beam,
html.studio-theme-dark #sendBtn.nv-beam {
    --beam-core: rgba(180,255,60,.95);
    --beam-mid: rgba(180,255,60,.45);
    --beam-glow: rgba(180,255,60,.55);
}
#sendBtn.nv-beam {
    background: #1d1d1f !important;
    color: #ffffff !important;
    border-radius: var(--radius-md) !important;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), var(--shadow-md) !important;
}
#sendBtn.nv-beam:hover { transform: scale(1.08); }
#sendBtn.nv-beam:disabled { opacity: .45; cursor: not-allowed; }

/* ── 状态强调：streaming 光标柠檬绿 ── */
.bubble.assistant.streaming::after { background: rgba(180,255,60,.95); }

/* ── 禁蓝：清理原 slate 蓝灰残留，统一玻璃灰 ── */
.model-picker-button, .upload-btn, .image-preview-close {
    background: color-mix(in srgb, var(--elevated) 60%, transparent) !important;
    backdrop-filter: blur(20px) saturate(180%) !important;
    -webkit-backdrop-filter: blur(20px) saturate(180%) !important;
    border: 1px solid color-mix(in srgb, var(--text) 8%, transparent) !important;
    box-shadow: inset 0 1px 0 color-mix(in srgb, var(--text) 10%, transparent), var(--shadow-sm) !important;
}

    .model-picker-submenu {
        position: fixed; z-index: 10000; display: none; flex-direction: column; gap: 2px;
        width: var(--submenu-width, 212px); max-height: var(--submenu-max-height, min(320px, 60vh));
        padding: 5px; overflow-y: auto;
        scrollbar-width: thin; scrollbar-color: rgba(132,132,132,.2) transparent;
    }
    .model-picker-submenu.open { display: flex; animation: submenuIn .14s var(--ease); }
    .model-picker-submenu::-webkit-scrollbar { width: 5px; height: 5px; }
    .model-picker-submenu::-webkit-scrollbar-track { background: transparent; }
    .model-picker-submenu::-webkit-scrollbar-thumb { background: rgba(132,132,132,.18); border-radius: 999px; }
    @keyframes submenuIn { from { opacity: 0; transform: translateX(-3px); } to { opacity: 1; transform: none; } }
    /* 模型条目 */
    .model-picker-model-btn { font-size: 13px !important; font-weight: 500 !important; min-height: 32px !important; padding: 5px 8px !important; border-radius: 8px !important; color: var(--text) !important; }

    .model-picker-model-btn.active { background: var(--nav-hover-bg) !important; color: var(--text) !important; font-weight: 600 !important; }
    .model-picker-model-btn i, .model-picker-model-btn svg { width: 13px !important; height: 13px !important; stroke-width: 1.8 !important; }
    .model-picker-model-btn span { flex: 1 1 auto !important; }

    /* ═══════════ V20.1 · 去框统一（对齐 V17/V20 无框语言） ═══════════ */

    /* —— 1) 点击弹窗统一：去边框、统一圆角 14 与单一投影 —— */
    .chat-rail, .system-prompt-popover, .model-picker-popover,

    .chat-rail, .system-prompt-popover { border-radius: 16px !important; }
    .system-prompt-textarea, .resolution-custom-box {
        border: 0 !important;
        background: color-mix(in srgb, var(--text) 5%, transparent) !important;
        box-shadow: none !important;

    .bubble:not(.image-bubble) {

        padding: 12px 15px !important;
        box-shadow: none !important;
        border: 0 !important;

        border-bottom-right-radius: 14px !important;

        color: var(--bg) !important;
        border: 0 !important;
        border-bottom-left-radius: 14px !important;
        border-bottom-right-radius: 14px !important;
    }
    .empty-state {
        background: transparent !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        border: 0 !important;
        box-shadow: none !important;
        padding: 0 !important;
    }

    .action-btn {
        background: transparent !important;
        border: 0 !important;
        box-shadow: none !important;
    }

    /* —— 1.a 「正在思考」占位：文案呼吸 + 三个圆点跳动 —— */
    .bubble.thinking .bubble-text {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        animation: thinking-pulse 1.6s ease-in-out infinite;
    }
    @keyframes thinking-pulse {
        0%, 100% { opacity: .5; }
        50% { opacity: 1; }
    }
    .thinking-dots {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        margin-left: 2px;
        vertical-align: middle;
        line-height: 1;
    }
    .thinking-dots i {
        width: 6px; height: 6px;
        border-radius: 50%;
        background: currentColor;
        display: inline-block;
        animation: thinking-bounce 1.05s infinite ease-in-out;
        will-change: transform, opacity;
    }
    .thinking-dots i:nth-child(2) { animation-delay: .13s; }
    .thinking-dots i:nth-child(3) { animation-delay: .26s; }
    @keyframes thinking-bounce {
        0%   { transform: translateY(0) scale(.75); opacity: .3; }
        35%  { transform: translateY(-7px) scale(1.15); opacity: 1; }
        70%  { transform: translateY(0) scale(.75); opacity: .3; }
        100% { transform: translateY(0) scale(.75); opacity: .3; }
    }

    /* —— 7) 去掉右侧边栏 —— */
    .v10-rail { display: none !important; }

    .chat-shell { background: var(--bg) !important; }

    .topbar { box-shadow: none !important; }

                square: [['1024x1024','1k']],
                portrait: [['832x1216','1k']],
                landscape: [['1216x832','1k']]
            }
        };

        function getSizeOptionsForModel(model) {
            const m = String(model || '').toLowerCase();
            // Gemini 图模型的官方模型名（gemini-3-pro-image-preview / gemini-3.1-flash-image-preview）
            // 不含 "nano-banana" 字样，直接匹配会回落通用 SIZE_OPTIONS（square 4K 仅 2048x2048），
            // 导致 4K 被缩水。这里先按别名映射到对应的 Nano Banana 尺寸表。
            if (m.includes('gemini-3-pro-image')) return MODEL_SIZE_PRESETS['nano-banana-pro'];
            if (m.includes('gemini-3.1-flash-image')) return MODEL_SIZE_PRESETS['nano-banana-2'];
            for (const [key, sizes] of Object.entries(MODEL_SIZE_PRESETS)) {
                if (m.includes(key)) return sizes;
            }
            return SIZE_OPTIONS; // 默认：通用尺寸
        }

        function currentSizeOptions() {
            return getSizeOptionsForModel(activeImageModel);
        }

        const headers = () => ({'Content-Type':'application/json', 'X-User-ID':userId});

        function rememberConversation(id){

                if(id) localStorage.setItem(CHAT_LAST_CONVERSATION_KEY, id);
                else localStorage.removeItem(CHAT_LAST_CONVERSATION_KEY);

        function rememberedConversation(){

        function currentSystemPrompt(){
            const pop = document.getElementById('systemPromptPopover');

        /* ══════════════════════════════════════════════════════════
           系统角色库（persona）
           定位：纯快捷填充。选中角色 = 把该角色的 content 写进
                 #systemPromptInput 并同步写入 systemPrompt / localStorage。
                 systemPrompt 始终是唯一生效值，角色库不参与请求构造，
                 因此不影响 currentSystemPrompt() 与既有生图 / chat / agent 注入。
           ══════════════════════════════════════════════════════════ */

        function personaById(id){
            const target = String(id || '');
            if(!target) return null;
            return personaLibrary.filter(item => item && item.id === target)[0] || null;
        }

        /** 反查：给定文本是否正好等于某个角色的 content，是则返回其 id，否则 ''。 */
        function personaIdForContent(text){
            const value = String(text || '').trim();
            if(!value) return '';
            const hit = personaLibrary.filter(item => item && String(item.content || '').trim() === value)[0];
            return hit ? hit.id : '';
        }

        /** 当前弹窗里正在编辑的文本（弹窗开着读 textarea，否则读已保存的 systemPrompt）。 */
        function personaCurrentText(){
            const pop = document.getElementById('systemPromptPopover');
            const input = document.getElementById('systemPromptInput');
            if(pop?.classList.contains('open') && input) return String(input.value || '');
            return String(systemPrompt || '');
        }

        function setPersonaStatus(text){
            const status = document.getElementById('personaStatus');
            if(status) status.textContent = String(text || '');
        }

        /** 状态文案唯一来源：命中角色 → 角色名；有文本未命中 → 自定义；空 → 未选择。 */
        function personaStatusText(){
            const active = personaById(activePersonaId);
            if(active) return '当前角色：' + String(active.name || '');
            return personaCurrentText().trim() ? '自定义提示词' : '未选择角色';
        }

        /** 临时提示（如"请填写角色名称"），2s 后自动恢复到正常状态文案。 */
        function flashPersonaStatus(text){
            setPersonaStatus(text);
            setTimeout(() => { renderPersonaChips(); }, 2000);
        }

        function renderPersonaChips(){
            const row = document.getElementById('personaChips');
            if(!row) return;
            row.textContent = '';
            const active = personaById(activePersonaId);
            if(!personaLibrary.length){
                const tip = document.createElement('span');
                tip.className = 'persona-hint';
                tip.textContent = '角色库加载中…';
                row.appendChild(tip);
            } else {
                personaLibrary.forEach(item => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'persona-chip' + (item.id === activePersonaId ? ' active' : '') + (item.builtin ? ' builtin' : '');
                    btn.dataset.personaId = String(item.id || '');
                    btn.textContent = String(item.name || '未命名角色');
                    btn.title = String(item.description || item.name || '');
                    btn.addEventListener('click', (event) => {
                        event.stopPropagation();
                        applyPersona(item.id);
                    });
                    row.appendChild(btn);
                });
            }
            setPersonaStatus(personaStatusText());

            const delBtn = document.getElementById('personaDeleteBtn');
            if(delBtn) delBtn.classList.toggle('show', !!(active && !active.builtin));
            if(window.lucide && lucide.createIcons) { try { lucide.createIcons(); } catch(e) {} }
            /* chips 是新建的 DOM 节点，运行时主题注入的「框」还没被兜底过，这里补一次 */
            if(window.__novaiForcePersonas) { try { window.__novaiForcePersonas(); } catch(e) {} }
        }

        /** 文本变化后重新推导选中态（编辑过 → 自定义）。不触碰 systemPrompt，安全可重复调用。 */
        function syncPersonaState(){
            activePersonaId = personaIdForContent(personaCurrentText());
            renderPersonaChips();
        }

        /** #systemPromptInput 的 oninput：同步角色高亮态与状态文案。
            只在「命中角色 id 变化」或「状态文案变化」时才落盘 + 重绘，避免每敲一个字都重排。 */
        function handleSystemPromptInput(){
            const prevId = activePersonaId;
            const prevStatus = String(document.getElementById('personaStatus')?.textContent || '');
            activePersonaId = personaIdForContent(personaCurrentText());
            if(activePersonaId !== prevId || personaStatusText() !== prevStatus){
                saveChatSettings();
                renderPersonaChips();
            }
        }

        /** 选中角色：把 content 填进 textarea，并立即写入 systemPrompt + localStorage。 */
        function applyPersona(id){
            const persona = personaById(id);
            if(!persona) return;
            const content = String(persona.content || '');
            const input = document.getElementById('systemPromptInput');
            if(input) input.value = content;
            activePersonaId = persona.id;
            systemPrompt = content.trim();
            saveChatSettings();
            renderPersonaChips();
        }

        async function loadPersonaLibrary(){
            try {
                const data = await fetch('/api/personas').then(r => r.json());
                personaLibrary = Array.isArray(data?.personas) ? data.personas : [];
            } catch(e) {
                personaLibrary = [];
            }
            syncPersonaState();
            return personaLibrary;
        }

        function togglePersonaSaveBox(force){
            const box = document.getElementById('personaSaveBox');
            if(!box) return;
            const shouldOpen = typeof force === 'boolean' ? force : !box.classList.contains('open');
            box.classList.toggle('open', shouldOpen);

        async function submitPersonaSave(){
            const content = personaCurrentText().trim();
            if(!content){ flashPersonaStatus('请先填写提示词内容'); return; }
            const nameInput = document.getElementById('personaNameInput');
            const name = String(nameInput?.value || '').trim();
            if(!name){ flashPersonaStatus('请填写角色名称'); if(nameInput) nameInput.focus(); return; }
            const btn = document.getElementById('personaSaveConfirmBtn');
            if(btn) btn.disabled = true;
            try {
                const res = await fetch('/api/personas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, description: '', content })
                });
                const data = await res.json().catch(() => ({}));
                if(!res.ok) throw new Error(data?.detail || '保存失败');
                personaLibrary = Array.isArray(data?.personas) ? data.personas : personaLibrary;
                activePersonaId = String(data?.persona?.id || '');
                /* 必须同步把文本提交给 systemPrompt：否则下一次 syncSystemPromptUI()
                   （打开弹窗时 input.value = systemPrompt）会把这段刚存成角色的文本冲掉，
                   角色高亮也随之丢失。存角色 ≡ 认可这段文本，副作用可接受。 */
                systemPrompt = content;
                saveChatSettings();
                togglePersonaSaveBox(false);
                renderPersonaChips();
            } catch(e) {
                flashPersonaStatus(String(e?.message || '保存失败'));
            } finally {
                if(btn) btn.disabled = false;
            }
        }

        async function deleteActivePersona(){
            const persona = personaById(activePersonaId);
            if(!persona || persona.builtin) return;
            try {
                const res = await fetch('/api/personas/' + encodeURIComponent(persona.id), { method: 'DELETE' });
                const data = await res.json().catch(() => ({}));
                if(!res.ok) throw new Error(data?.detail || '删除失败');
                personaLibrary = Array.isArray(data?.personas) ? data.personas : personaLibrary;
                activePersonaId = personaIdForContent(personaCurrentText());
                saveChatSettings();
                renderPersonaChips();
            } catch(e) {
                flashPersonaStatus(String(e?.message || '删除失败'));
            }
        }

        /* ════════════════════════════════════════════════════════════════════════
           长期记忆库（memory）
           定位：服务端自动注入。每条记忆带 enabled 开关（默认开），
                请求构造时由后端 memory_block() 把已启用记忆合并进 system prompt，
                前端 textarea（currentSystemPrompt）不感知，因此 chat / 生图 / agent 三处行为一致。
                本模块只负责「管理」UI：列表渲染、开关、添加、删除。
           ══════════════════════════════════════════════════════════════════════ */

        function memoryById(id){
            const target = String(id || '');
            if(!target) return null;
            return memoryLibrary.filter(item => item && item.id === target)[0] || null;
        }

        function memoryEnabledCount(){
            return memoryLibrary.filter(item => item && item.enabled !== false).length;
        }

        function setMemoryStatus(text){
            const status = document.getElementById('memoryStatus');
            if(status) status.textContent = String(text || '');
        }

        function setMemoryScope(scope){
            memoryScope = (scope === 'conversation') ? 'conversation' : 'global';
            document.querySelectorAll('#memoryScope .scope-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-scope') === memoryScope);
            });
        }

        function renderMemoryList(){
            const list = document.getElementById('memoryList');
            if(!list) return;
            list.textContent = '';
            if(!memoryLibrary.length){
                const tip = document.createElement('span');
                tip.className = 'memory-hint';
                tip.textContent = '暂无记忆，在下方添加一条长期使用偏好';
                list.appendChild(tip);
            } else {
                memoryLibrary.forEach(item => {
                    const row = document.createElement('div');
                    row.className = 'memory-row' + (item.enabled === false ? ' disabled' : '');
                    const toggle = document.createElement('button');
                    toggle.type = 'button';
                    toggle.className = 'memory-toggle' + (item.enabled === false ? '' : ' on');
                    toggle.title = item.enabled === false ? '已停用（点击启用）' : '已启用（点击停用）';
                    toggle.addEventListener('click', (event) => {
                        event.stopPropagation();
                        toggleMemory(item.id, item.enabled === false);
                    });
                    const text = document.createElement('span');
                    text.className = 'memory-text';
                    text.textContent = String(item.content || '');
                    text.title = String(item.content || '');
                    const del = document.createElement('button');
                    del.type = 'button';
                    del.className = 'memory-del';
                    del.title = '删除';
                    del.innerHTML = '<i data-icon="trash"></i>';
                    del.addEventListener('click', (event) => {
                        event.stopPropagation();
                        deleteMemory(item.id);
                    });
                    row.appendChild(toggle);
                    row.appendChild(text);
                    const tag = document.createElement('button');
                    tag.type = 'button';
                    tag.className = 'memory-tag' + (item.scope === 'conversation' ? '' : ' global');
                    tag.textContent = item.scope === 'conversation' ? '本对话' : '全局';
                    tag.title = item.scope === 'conversation' ? '仅当前对话生效 · 点击切为全局' : '全局生效 · 点击切为本对话';
                    tag.addEventListener('click', (event) => {
                        event.stopPropagation();
                        switchMemoryScope(item);
                    });
                    row.appendChild(tag);
                    row.appendChild(del);
                    list.appendChild(row);
                });
            }
            setMemoryStatus(memoryEnabledCount() + ' 条已启用');
            if(window.lucide && lucide.createIcons) { try { lucide.createIcons(); } catch(e) {} }
            /* 记忆行是新建 DOM 节点，运行时主题注入的「框」还没被兜底过，这里补一次 */
            if(window.__novaiForceMemories) { try { window.__novaiForceMemories(); } catch(e) {} }
        }

        async function loadMemoryLibrary(){
            try {
                const data = await fetch('/api/memories').then(r => r.json());
                memoryLibrary = Array.isArray(data?.memories) ? data.memories : [];
            } catch(e) {
                memoryLibrary = [];
            }
            renderMemoryList();
            return memoryLibrary;
        }

        async function submitMemoryAdd(){
            const input = document.getElementById('memoryInput');
            const content = String(input?.value || '').trim();
            if(!content){ if(input) input.focus(); return; }
            const btn = document.getElementById('memoryAddBtn');
            if(btn) btn.disabled = true;
            try {
                let scope = memoryScope;
                let conversationId = '';
                let fellBack = false;
                if(scope === 'conversation'){
                    conversationId = currentConversation?.id || '';
                    if(!conversationId){
                        scope = 'global';
                        conversationId = '';
                        fellBack = true;
                        setMemoryScope('global');
                    }
                }
                const res = await fetch('/api/memories', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content, scope, conversation_id: conversationId })
                });
                const data = await res.json().catch(() => ({}));
                if(!res.ok) throw new Error(data?.detail || '添加失败');
                memoryLibrary = Array.isArray(data?.memories) ? data.memories : memoryLibrary;
                if(input) input.value = '';
                renderMemoryList();
                if(fellBack) setMemoryStatus(memoryEnabledCount() + ' 条已启用 · 当前对话尚未创建，已存为全局');
            } catch(e) {
                setMemoryStatus(String(e?.message || '添加失败'));
            } finally {
                if(btn) btn.disabled = false;
            }
        }

        async function toggleMemory(id, enabled){
            try {
                const res = await fetch('/api/memories/' + encodeURIComponent(id), {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enabled })
                });
                const data = await res.json().catch(() => ({}));
                if(!res.ok) throw new Error(data?.detail || '更新失败');
                memoryLibrary = Array.isArray(data?.memories) ? data.memories : memoryLibrary;
                renderMemoryList();
            } catch(e) {
                setMemoryStatus(String(e?.message || '更新失败'));
            }
        }

        async function switchMemoryScope(item){
            const nextScope = item.scope === 'conversation' ? 'global' : 'conversation';
            let conversationId = '';
            if(nextScope === 'conversation'){
                conversationId = currentConversation?.id || '';
                if(!conversationId){
                    setMemoryStatus('当前对话尚未创建，无法切到「本对话」');
                    return;
                }
            }
            try {
                const res = await fetch('/api/memories/' + encodeURIComponent(item.id), {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ scope: nextScope, conversation_id: conversationId })
                });
                const data = await res.json().catch(() => ({}));
                if(!res.ok) throw new Error(data?.detail || '切换失败');
                memoryLibrary = Array.isArray(data?.memories) ? data.memories : memoryLibrary;
                renderMemoryList();
            } catch(e) {
                setMemoryStatus(String(e?.message || '切换失败'));
            }
        }

        async function deleteMemory(id){
            try {
                const res = await fetch('/api/memories/' + encodeURIComponent(id), { method: 'DELETE' });
                const data = await res.json().catch(() => ({}));
                if(!res.ok) throw new Error(data?.detail || '删除失败');
                memoryLibrary = Array.isArray(data?.memories) ? data.memories : memoryLibrary;
                renderMemoryList();
            } catch(e) {
                setMemoryStatus(String(e?.message || '删除失败'));
            }
        }

        function uniqueModels(list){
            const seen = new Set();
            return (list || []).map(item => String(item || '').trim()).filter(item => item && !seen.has(item) && seen.add(item));
        }
        function chatProviders(){
            const list = (apiProviders || []).filter(p => p.enabled !== false && (p.chat_models || []).length);
            if(config.ms_chat_models?.length && !list.some(p => p.id === 'modelscope')) list.push({id:'modelscope', name:'ModelScope', chat_models:config.ms_chat_models, image_models:[]});
            return list.length ? list : [{id:'comfly', name:'API', chat_models:[config.chat_model || 'gpt-4o-mini'], image_models:[config.image_model || 'gpt-image-2']}];
        }
        function imageProviders(){
            const list = (apiProviders || []).filter(p => p.enabled !== false && (p.image_models || []).length);
            return list.length ? list : [{id:'comfly', name:'API', image_models:[config.image_model || 'gpt-image-2'], chat_models:[config.chat_model || 'gpt-4o-mini']}];
        }
        function providerById(id, kind='chat'){
            const list = kind === 'image' ? imageProviders() : chatProviders();
            return list.find(p => p.id === id) || list[0];
        }
        function activePickerKind(){
            return mode === 'image' ? 'image' : (mode === 'agent' ? modelPickerScope : 'chat');
        }
        function currentProviderId(kind=activePickerKind()){
            return kind === 'image' ? activeImageProvider : provider;
        }
        function modelListForCurrent(kind=activePickerKind()){
            const item = providerById(currentProviderId(kind), kind);
            return uniqueModels(kind === 'image' ? item.image_models : item.chat_models);
        }
        function currentModel(kind=activePickerKind()){
            return kind === 'image' ? activeImageModel : (provider === 'modelscope' ? (msModel || activeChatModel) : activeChatModel);
        }
        function providerNameById(id, kind=activePickerKind()){
            const item = providerById(id, kind);
            return item?.name || item?.id || 'API';
        }
        function shortModelName(value){
            return String(value || '').split('/').pop().split(':')[0] || 'Model';
        }
        function renderProviderControls(){
            const kind = activePickerKind();
            const providers = kind === 'image' ? imageProviders() : chatProviders();
            const pid = currentProviderId(kind);
            if(!providers.some(p => p.id === pid)) {
                if(kind === 'image') activeImageProvider = providers[0]?.id || 'comfly';
                else provider = providers[0]?.id || 'comfly';
            }
            const models = modelListForCurrent(kind);
            if(kind === 'image' && !models.includes(activeImageModel)) activeImageModel = models[0] || config.image_model;
            if(kind !== 'image' && !models.includes(activeChatModel)) activeChatModel = chatProviderModels[provider] && models.includes(chatProviderModels[provider]) ? chatProviderModels[provider] : (models[0] || config.chat_model);
            if(kind !== 'image' && provider === 'modelscope') msModel = activeChatModel;
            renderModelPicker();
        }

        function validateSavedProviderState(){
            const chatProviderList = chatProviders();
            provider = chatProviderList.some(p => p.id === provider) ? provider : (chatProviderList[0]?.id || 'comfly');
            const chatModels = uniqueModels(providerById(provider, 'chat')?.chat_models || []);
            const rememberedChatModel = chatProviderModels[provider];
            activeChatModel = chatModels.includes(activeChatModel)
                ? activeChatModel
                : (chatModels.includes(rememberedChatModel) ? rememberedChatModel : (chatModels[0] || config.chat_model));
            chatProviderModels[provider] = activeChatModel;
            if(provider === 'modelscope') msModel = activeChatModel;
            if(config.ms_chat_models?.length && msModel && !config.ms_chat_models.includes(msModel)) msModel = config.ms_chat_models[0];
            if(config.ms_chat_models?.length && provider === 'modelscope') activeChatModel = msModel || config.ms_chat_models[0];

            const imageProviderList = imageProviders();
            activeImageProvider = imageProviderList.some(p => p.id === activeImageProvider) ? activeImageProvider : (imageProviderList[0]?.id || 'comfly');
            const imageModels = uniqueModels(providerById(activeImageProvider, 'image')?.image_models || []);
            activeImageModel = imageModels.includes(activeImageModel) ? activeImageModel : (imageModels[0] || config.image_model);
            if(mode !== 'agent' && mode !== 'chat' && mode !== 'image') mode = 'chat';
            if(mode === 'chat') modelPickerScope = 'chat';
            if(mode === 'image') modelPickerScope = 'image';
        }

        async function loadConfig(){
            try {
                const data = await fetch('/api/config').then(r=>r.json());
                config = { ...config, ...data };
                apiProviders = Array.isArray(config.api_providers) ? config.api_providers : [];
                config.chat_model = (config.chat_models || []).find(m => m === 'gpt-5.5') || config.chat_model || 'gpt-5.5';
                config.image_model = config.image_model || ((config.image_models || [])[0]) || 'gpt-image-2';
                validateSavedProviderState();
                setMode(mode, false);
                updateModelLabel();
                saveChatSettings();
            } catch(e) {}
        }
        try {
            const apiChannel = new BroadcastChannel('studio-api');
            apiChannel.onmessage = async (e) => {
                if(e.data?.type === 'providers-changed'){
                    await loadConfig();
                    renderProviderControls();
                    updateModelLabel();
                }
            };
        } catch(e) {}

        function setProvider(p, kind=activePickerKind()) {
            if(kind === 'image') activeImageProvider = p;
            else provider = p;
            const models = modelListForCurrent(kind);
            if(kind === 'image') activeImageModel = models[0] || activeImageModel;
            else {

        function positionModelPicker(){
            const btn = document.getElementById('modelPickerBtn');
            const pop = document.getElementById('modelPickerPopover');
            if(!btn || !pop) return;
            const rect = btn.getBoundingClientRect();
            const viewportW = (window.visualViewport?.width || window.innerWidth);
            const viewportH = (window.visualViewport?.height || window.innerHeight);
            const width = viewportW < 720
                ? Math.min(300, Math.max(220, viewportW - 24))
                : Math.min(200, Math.max(168, viewportW - 24));
            const safe = 12;
            const gap = 6;
            const absoluteMaxH = viewportW < 720
                ? Math.min(260, Math.round(viewportH * 0.55))
                : Math.min(340, Math.round(viewportH * 0.62)); // overall cap
            // render popover visible for measurement
            pop.style.visibility = 'hidden';
            pop.style.display = 'grid';
            pop.style.removeProperty('--model-picker-max-height');
            const box = pop.getBoundingClientRect();
            const naturalH = box.height;
            pop.style.display = '';
            pop.style.visibility = '';
            // decide direction: prefer above button, fallback to below
            let placeAbove = true;
            // available height when placed above the button
            const aboveMaxH = Math.max(120, rect.top - safe - gap);
            const aboveActualH = Math.min(naturalH, absoluteMaxH, aboveMaxH);
            let top = rect.top - aboveActualH - gap;
            let chosenMaxH = aboveActualH;
            if(top < safe) {
                placeAbove = false;
                // available height when placed below the button
                const belowMaxH = Math.max(120, viewportH - rect.bottom - safe - gap);
                chosenMaxH = Math.min(naturalH, absoluteMaxH, belowMaxH);
                top = rect.bottom + gap;
            }
            pop.style.setProperty('--model-picker-max-height', `${Math.round(chosenMaxH)}px`);
            const preferredLeft = rect.left;
            let left = Math.min(Math.max(safe, preferredLeft), Math.max(safe, viewportW - width - safe));
            // ensure right edge fits
            if(left + width > viewportW - safe) left = Math.max(safe, viewportW - width - safe);
            pop.style.width = `${Math.round(width)}px`;
            pop.style.left = `${Math.round(left)}px`;
            pop.style.top = `${Math.round(Math.max(safe, top))}px`;
            pop.style.bottom = 'auto';
            pop.classList.toggle('above', placeAbove);
            pop.classList.toggle('below', !placeAbove);
        }

        function positionResolutionPicker(){
            const btn = document.getElementById('resolutionPickerBtn');
            const pop = document.getElementById('resolutionPickerPopover');
            if(!btn || !pop) return;
            const rect = btn.getBoundingClientRect();
            const viewportW = (window.visualViewport?.width || window.innerWidth);
            const viewportH = (window.visualViewport?.height || window.innerHeight);
            const desiredWidth = chatResolution === 'auto' ? 264 : (chatResolution === 'custom' ? 264 : 312);
            const width = Math.min(desiredWidth, Math.max(232, viewportW - 24));
            const safeX = 12;
            const safeTop = 12;
            const safeBottom = 18;
            const gap = 6;
            const left = Math.min(Math.max(safeX, rect.left + rect.width / 2 - width / 2), Math.max(safeX, viewportW - width - safeX));
            const availableAbove = Math.max(96, rect.top - safeTop - gap);
            const initialHeight = Math.min(chatResolution === 'auto' ? 180 : 300, availableAbove, viewportH - safeTop - safeBottom);
            const initialTop = Math.max(safeTop, rect.top - initialHeight - gap);
            pop.style.setProperty('--resolution-picker-left', `${Math.round(left)}px`);
            pop.style.setProperty('--resolution-picker-top', `${Math.round(initialTop)}px`);
            pop.style.setProperty('--resolution-picker-width', `${Math.round(width)}px`);
            pop.style.setProperty('--resolution-picker-max-height', `${Math.round(initialHeight)}px`);
            pop.style.setProperty('--resolution-picker-list-height', '320px');
            requestAnimationFrame(() => {
                const naturalHeight = Math.ceil(pop.scrollHeight || pop.getBoundingClientRect().height || 160);
                const maxHeight = Math.max(96, Math.min(naturalHeight, availableAbove, viewportH - safeTop - safeBottom));
                const headHeight = Math.ceil(pop.querySelector('.resolution-picker-head')?.getBoundingClientRect().height || 50);
                const listHeight = Math.max(58, maxHeight - headHeight - 20);
                const top = Math.max(safeTop, rect.top - maxHeight - gap);
                pop.style.setProperty('--resolution-picker-max-height', `${Math.round(maxHeight)}px`);
                pop.style.setProperty('--resolution-picker-list-height', `${Math.round(listHeight)}px`);
                pop.style.setProperty('--resolution-picker-top', `${Math.round(top)}px`);
                const box = pop.getBoundingClientRect();
                const nextLeft = box.right > viewportW - 12 ? (left - (box.right - viewportW + 12)) : left;
                const overlap = box.bottom - (rect.top - 8);
                const nextTop = overlap > 0 ? (top - overlap - 2) : top;
                pop.style.setProperty('--resolution-picker-left', `${Math.round(Math.max(12, nextLeft))}px`);
                pop.style.setProperty('--resolution-picker-top', `${Math.round(Math.max(12, nextTop))}px`);
            });
        }

        /* ── 模型子菜单：悬停供应商飞出，位置跟随该供应商条目 ── */
        let modelSubmenuTimer = null;
        function cancelSubmenuClose(){
            if(modelSubmenuTimer){ clearTimeout(modelSubmenuTimer); modelSubmenuTimer = null; }
        }
        function scheduleSubmenuClose(){
            cancelSubmenuClose();

        function closeModelSubmenu(){
            cancelSubmenuClose();
            const submenu = document.getElementById('modelSubmenu');

        function positionModelSubmenu(rowEl){
            const submenu = document.getElementById('modelSubmenu');
            const pop = document.getElementById('modelPickerPopover');
            if(!submenu || !pop || !rowEl) return;
            const viewportW = (window.visualViewport?.width || window.innerWidth);
            const viewportH = (window.visualViewport?.height || window.innerHeight);
            const safe = 8, gap = 4;
            const narrow = viewportW < 720;
            const width = narrow
                ? Math.min(360, Math.max(220, Math.round(pop.getBoundingClientRect().width || 240)))
                : Math.min(212, Math.max(160, viewportW - 24));
            // 先渲染可见以量高
            submenu.style.setProperty('--submenu-width', `${Math.round(width)}px`);
            submenu.style.removeProperty('--submenu-max-height');
            submenu.style.visibility = 'hidden';
            submenu.style.display = 'flex';
            const naturalH = submenu.getBoundingClientRect().height;
            submenu.style.display = '';
            submenu.style.visibility = '';
            const maxH = Math.min(naturalH, viewportH - safe * 2);
            submenu.style.setProperty('--submenu-max-height', `${Math.round(maxH)}px`);
            const popRect = pop.getBoundingClientRect();
            const rowRect = rowEl.getBoundingClientRect();
            let left, top;
            if(narrow){
                // 弹窗下方铺满弹窗宽度（取代原右侧飞出）
                left = Math.max(safe, Math.min(popRect.left, viewportW - width - safe));
                let candidate = popRect.bottom + gap;
                if(candidate + maxH > viewportH - safe){ candidate = Math.max(safe, popRect.top - maxH - gap); }
                top = candidate;
            } else {
                // 优先放右侧，空间不足翻左侧
                left = popRect.right + gap;
                if(left + width > viewportW - safe) left = popRect.left - width - gap;
                if(left < safe) left = Math.max(safe, Math.min(popRect.right + gap, viewportW - width - safe));
                top = rowRect.top - 5;
                if(top + maxH > viewportH - safe) top = viewportH - maxH - safe;
                if(top < safe) top = safe;
            }
            submenu.style.left = `${Math.round(left)}px`;
            submenu.style.top = `${Math.round(top)}px`;
        }

        async function loadConversations(){
            let data;
            try {
                data = await fetch('/api/conversations', {headers:{'X-User-ID':userId}}).then(r=>r.json());
            } catch(e) { data = {conversations: []}; }
            conversations = data.conversations || [];
            /* 会话列表刷新后通知空态欢迎台的「最近会话」重新填充
               （conversations 是 let 声明，不会挂到 window 上，无法被外部直接读取） */
            try { window.dispatchEvent(new CustomEvent('novai:conversations-loaded', { detail: conversations })); } catch(_){}
            renderThreads();
            if(!currentConversation) {
                const rememberedId = rememberedConversation();
                const target = (rememberedId && conversations.find(item => item.id === rememberedId)) || conversations[0];
                if(target) await openConversation(target.id);
            }
            if(!currentConversation) renderMessages([]);
        }

        function renderThreads(){
            const list = document.getElementById('threadList');
            list.innerHTML = '';
            if(!conversations.length){
                list.innerHTML = `<div class="px-3 py-8 text-center text-[11px] font-bold text-gray-300 uppercase tracking-widest">${tr('chat.noHistory')}</div>`;
                return;
            }
            conversations.forEach(item => {
                const row = document.createElement('div');
                row.className = 'thread-row';
                const btn = document.createElement('button');
                btn.className = `thread-item ${currentConversation?.id === item.id ? 'active' : ''}`;
                btn.onclick = () => openConversation(item.id, true);
                btn.innerHTML = `<div class="text-sm font-bold truncate">${escapeHtml(item.title || defaultTitle())}</div><div class="text-[11px] opacity-50 truncate mt-1">${escapeHtml(item.last_message || '')}</div>`;
                const del = document.createElement('button');
                del.className = 'thread-delete';
                del.title = tr('chat.deleteTitle');
                del.onclick = (event) => deleteConversation(item.id, event);
                del.innerHTML = '<i data-icon="close" class="w-3.5 h-3.5"></i>';
                row.appendChild(btn);
                row.appendChild(del);
                list.appendChild(row);
            });
            lucide.createIcons();
        }

        async function newConversation(){
            const data = await fetch('/api/conversations', {method:'POST', headers:headers(), body:JSON.stringify({title:'新对话'})}).then(r=>r.json());
            currentConversation = data.conversation;
            rememberConversation(currentConversation.id);

        async function openConversation(id, closePanel=false){
            const data = await fetch(`/api/conversations/${id}`, {headers:{'X-User-ID':userId}}).then(r=>r.json());
            currentConversation = data.conversation;
            rememberConversation(currentConversation.id);
            setChatTitle(currentConversation.title);
            renderThreads();
            renderMessages(currentConversation.messages || []);
            if(closePanel) toggleHistory(false);

        async function deleteConversation(id, event){
            event.stopPropagation();
            if(!confirm(tr('chat.deleteConfirm'))) return;
            await fetch(`/api/conversations/${id}`, {method:'DELETE', headers:{'X-User-ID':userId}});
            const deletedCurrent = currentConversation?.id === id;
            if(deletedCurrent){ currentConversation = null; rememberConversation(''); setChatTitle(''); renderMessages([]); }
            await loadConversations();
            if(deletedCurrent && conversations[0]) await openConversation(conversations[0].id);
        }

        function updateModelLabel(){
            let label = '';
            if (mode === 'image') {
                label = activeImageModel || config.image_model || 'Image';
            } else if (mode === 'agent') {
                const chatLabel = provider === 'modelscope'
                    ? (msModel || (config.ms_chat_models?.[0]) || 'ModelScope').split('/').pop().split(':')[0]
                    : (activeChatModel || config.chat_model || 'Chat');
                const imageLabel = (activeImageModel || config.image_model || 'Image').split('/').pop().split(':')[0];
                label = `Agent · ${chatLabel} + ${imageLabel}`;
            } else if (provider === 'modelscope') {
                label = msModel || (config.ms_chat_models?.[0]) || 'ModelScope';

                label = label.split('/').pop().split(':')[0];

        /* ── 思考强度（think-level）：仅对支持推理的模型显示，按模型能力裁剪档位 ── */
        const THINK_LEVELS = [
            { key:'low',   label:'低' },
            { key:'mid',   label:'中' },
            { key:'high',  label:'高' },
            { key:'xhigh', label:'极高' },
            { key:'max',   label:'Max' }
        ];
        let thinkLevel = (function(){ try { return localStorage.getItem('gpt_chat_think_level') || 'mid'; } catch(e){ return 'mid'; } })();
        let thinkPickerHome = null;
        function thinkLevelLabel(k){ for(let i=0;i<THINK_LEVELS.length;i++){ if(THINK_LEVELS[i].key===k) return THINK_LEVELS[i].label; } return '中'; }
        /* 基于模型名/ID 的推理能力启发式（兜底，后端 model_caps 优先；与 main.py:THINK_MODEL_PATTERN 同步） */
        function getThinkLevels(modelName){
            if(!modelName) return null;
            // 1. 后端下发的 model_caps 优先
            try {
                const providers = chatProviders();
                for(let i=0;i<providers.length;i++){
                    const caps = providers[i]?.model_caps;
                    if(caps && caps[modelName] && Array.isArray(caps[modelName].think)) return caps[modelName].think;
                }
            } catch(_){}
            // 2. 兜底正则（未在 THINK_MODEL_PATTERN 注册的模型）
            return legacyThinkLevels(modelName);
        }
        function legacyThinkLevels(modelName){
            const n = String(modelName).toLowerCase();
            const patterns = [
                /thinking/,
                /qwq/, /qwen3[-_]?(thought|thinking)?/, /qwen3[-_](32b|235b|30b|14b|8b|4b|0\.6b|a22b)[-_]?(thinking)?/,
                /deepseek[-_]?r1\b/, /deepseek[-_]?reasoner/, /\br1\b/, /reasoner/,
                /glm[-_]?z1/, /glm[-_]?zero/,
                /kimi[-_]?(thinking|k2)/, /k2/,
                /(^|[^a-z0-9])o1([^a-z0-9]|$)/, /(^|[^a-z0-9])o3([^a-z0-9]|$)/, /(^|[^a-z0-9])o4([^a-z0-9]|$)/,
                /claude[-_]?3[-_]?(7|5)[-_]?sonnet/, /claude[-_]?3[-_]?opus/,
                /gemini[-_]?2[.-]?(0|5)[-_]?(pro|flash)/, /gemini[-_]?2[.-]?5/
            ];
            for(let i=0;i<patterns.length;i++){ if(patterns[i].test(n)) return ['low','mid','high','xhigh','max']; }
            return null;
        }
        function renderThinkChip(){
            const el = document.getElementById('thinkChipLabel');
            if(el) el.textContent = thinkLevelLabel(thinkLevel);

        function positionThinkPicker(){
            const btn = document.getElementById('thinkChipBtn');
            const pop = document.getElementById('thinkPopover');
            if(!btn || !pop) return;
            const rect = btn.getBoundingClientRect();
            const viewportW = (window.visualViewport?.width || window.innerWidth);
            const viewportH = (window.visualViewport?.height || window.innerHeight);
            const width = Math.min(168, Math.max(150, viewportW - 24));
            const safe = 12, gap = 6;
            const absoluteMaxH = Math.min(300, Math.round(viewportH * 0.6));
            pop.style.visibility = 'hidden'; pop.style.display = 'grid'; pop.style.removeProperty('--model-picker-max-height');
            const box = pop.getBoundingClientRect(); const naturalH = box.height;
            pop.style.display = ''; pop.style.visibility = '';
            let placeAbove = true;
            const aboveMaxH = Math.max(120, rect.top - safe - gap);
            const aboveActualH = Math.min(naturalH, absoluteMaxH, aboveMaxH);
            let top = rect.top - aboveActualH - gap;
            let chosenMaxH = aboveActualH;
            if(top < safe){ placeAbove = false; const belowMaxH = Math.max(120, viewportH - rect.bottom - safe - gap); chosenMaxH = Math.min(naturalH, absoluteMaxH, belowMaxH); top = rect.bottom + gap; }
            pop.style.setProperty('--model-picker-max-height', Math.round(chosenMaxH) + 'px');
            let left = Math.min(Math.max(safe, rect.left), Math.max(safe, viewportW - width - safe));
            if(left + width > viewportW - safe) left = Math.max(safe, viewportW - width - safe);
            pop.style.width = Math.round(width) + 'px';
            pop.style.left = Math.round(left) + 'px';
            pop.style.top = Math.round(Math.max(safe, top)) + 'px';
            pop.style.bottom = 'auto';
            pop.classList.toggle('above', placeAbove);
            pop.classList.toggle('below', !placeAbove);
        }

            const match = String(value || '').trim().match(/^([1-9]\d{2,3})\s*[xX×*]\s*([1-9]\d{2,3})$/);
            if(!match) return '';
            const w = Math.round(Number(match[1]));
            const h = Math.round(Number(match[2]));
            if(w < 256 || h < 256 || w > 8192 || h > 8192) return '';
            return `${w}x${h}`;
        }

            const ratioLabels = { square:'1:1', portrait:'2:3', portrait43:'3:4', landscape43:'4:3', landscape:'3:2', story:'9:16', wide:'16:9' };
            const ratioLabel = ratioLabels[chatRatio] || '1:1';

            const opts = currentSizeOptions();

        function chatSizeFromPrompt(message, fallbackSize = currentChatSize()){
            const text = String(message || '');
            // 显式 1k/2k/4k 模式下，提示词里的 4K/高清/超清/16:9 等关键词不再动态改尺寸，
            // 只保留显式写「1024x1536」这种直接尺寸覆盖。避免用户选了固定分辨率却“有时 4k 有时不是”。
            const explicitResolution = ['1k','2k','4k'].includes(chatResolution);
            const direct = text.match(/(^|[^\d])([1-9]\d{2,4})\s*[xX×*]\s*([1-9]\d{2,4})(?!\d)/);
            if(direct) {
                const w = Number(direct[2]);
                const h = Number(direct[3]);
                if(w >= 256 && h >= 256) return `${w}x${h}`;
            }
            if(explicitResolution) return fallbackSize;
            const normalized = text.replace(/[：﹕∶]/g, ':').replace(/比/g, ':').replace(/[／/]/g, ':');
            const match = normalized.match(/(^|[^\d])(1|2|3|4|9|16)\s*:\s*(1|2|3|4|9|16)(?!\d)/);
            if(!match) return fallbackSize;
            const ratio = `${Number(match[2])}:${Number(match[3])}`;
            const ratioMap = { '1:1':'square', '2:3':'portrait', '3:2':'landscape', '3:4':'portrait43', '4:3':'landscape43', '9:16':'story', '16:9':'wide' };
            const key = ratioMap[ratio];
            if(!key) return fallbackSize;
            const wants4k = /4\s*k|4K|超清|超高分辨率/i.test(text);
            const wants2k = /2\s*k|2K|高清|高分辨率/i.test(text);
            if(chatResolution === 'custom' && !wants4k && !wants2k) return fallbackSize;
            const fallbackEdge = Math.max(...String(fallbackSize || '').split(/[xX×*]/).map(n => Number(n) || 0));
            const targetLabel = wants4k ? '4k' : (wants2k ? '2k' : (chatResolution === 'auto' ? '1k' : (fallbackEdge >= 2400 ? '4k' : (fallbackEdge >= 1500 ? '2k' : '1k'))));
            const opts = currentSizeOptions();
            return (opts[key] || opts.square).find(([, label]) => label === targetLabel)?.[0] || fallbackSize;
        }

        async function uploadFiles(files){
            if(!files?.length) return;
            const available = Math.max(0, CHAT_ATTACHMENT_MAX - refs.length);

            const form = new FormData();
            [...files].slice(0, available).forEach(file => form.append('files', file));

                refs.push(...(data.files || []));

                    await loadConversations();
                }
            } catch(err) {
                renderMessages([...(currentConversation.messages || []), {role:'assistant', content:err.message || tr('chat.requestFailed')}]);
            } finally {
                btn.disabled = false;
                scrollBottom();
            }
        }

        async function streamChatMessage(message, pendingRefs, assistantBubble){
            const currentProvider = provider;
            const currentMsModel = provider === 'modelscope' ? (msModel || activeChatModel || (config.ms_chat_models?.[0] || '')) : '';
            const currentChatModel = activeChatModel || config.chat_model;

            const res = await fetch('/api/chat/stream', {
                method:'POST',
                headers:headers(),
                body:JSON.stringify({
                    conversation_id: currentConversation.id || '',
                    message,
                    system_prompt: currentSystemPrompt(),
                    mode:'chat',
                    model: currentProvider === 'modelscope' ? currentMsModel : currentChatModel,
                    ms_model: currentProvider === 'modelscope' ? currentMsModel : '',
                    provider: currentProvider,
                    reference_images: pendingRefs,
                    think_level: thinkLevel
                })
            });
            if(!res.ok) throw new Error((await res.json()).detail || tr('chat.requestFailed'));
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let fullText = '';
            while(true){
                const {value, done} = await reader.read();
                if(done) break;
                buffer += decoder.decode(value, {stream:true});
                const events = buffer.split('\n\n');
                buffer = events.pop() || '';
                for(const eventText of events){
                    const line = eventText.split('\n').find(item => item.startsWith('data:'));
                    if(!line) continue;
                    const event = JSON.parse(line.slice(5).trim());
                    if(event.type === 'meta'){
                        currentConversation = event.conversation;
                        rememberConversation(currentConversation.id);
                        setChatTitle(currentConversation.title);
                    }
                    if(event.type === 'delta'){
                        fullText += event.delta || '';
                        /* 首个字到达 → 思考占位结束：摘掉 thinking 让 dots 与呼吸动画停止
                           （非流式分支走 renderMessages 整体重建，无需处理） */
                        assistantBubble.bubble.classList.remove('thinking');
                        assistantBubble.text.textContent = fullText;
                        scrollBottom();
                    }
                    if(event.type === 'error') throw new Error(event.detail || tr('chat.requestFailed'));
                    if(event.type === 'done'){
                        assistantBubble.bubble.classList.remove('streaming');
                        currentConversation = event.conversation;
                        rememberConversation(currentConversation.id);
                        setChatTitle(currentConversation.title);
                        renderMessages(currentConversation.messages || []);
                        await loadConversations();
                    }
                }
            }
            assistantBubble.bubble.classList.remove('streaming');
        }

        function scrollBottom(){ requestAnimationFrame(() => { const box = document.getElementById('messages'); box.scrollTop = box.scrollHeight; }); }
        function escapeHtml(str){ return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])); }

        window.onload = async () => {
            applyLanguage();
            syncSystemPromptUI();
            /* 角色库：拉取失败也不影响既有系统提示词功能（personaLibrary 退化为空数组） */
            await loadPersonaLibrary().catch(() => {});
            /* 记忆库：拉取失败也不影响记忆功能（memoryLibrary 退化为空数组，仅 UI 不可用） */
            await loadMemoryLibrary().catch(() => {});
            setChatRatio(chatRatio);
            setChatResolution(chatResolution);
            await loadConfig();
            await loadConversations();
            updateComposerOverflow();
        };
    </script>
<script>
/* ═══ V11 · Online 设计语言装饰层（非破坏性） ═══
   仅追加渲染增强：日期分组头 / 时间戳 / Markdown 元素样式 / 发送按钮光束。
   不修改原有任何函数、事件与后端接口。 */
(function(){
    'use strict';
    function pad(n){ return (n<10?'0':'')+n; }
    function fmtTime(ts){ var d=new Date(ts); return pad(d.getHours())+':'+pad(d.getMinutes()); }
    function fmtDay(ts){ var d=new Date(ts); var n=new Date();
        var y = d.getFullYear()===n.getFullYear() ? '' : d.getFullYear()+'年 ';
        return y+(d.getMonth()+1)+'月 '+d.getDate()+'日'; }
    function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
    function md(src){
        var h = esc(src || '');
        h = h.replace(/```([\s\S]*?)```/g, function(_, c){ return '<pre><code>'+c.replace(/^\n/,'')+'</code></pre>'; });
        h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
        h = h.replace(/^### (.*)$/gm, '<h3>$1</h3>');
        h = h.replace(/^## (.*)$/gm, '<h2>$1</h2>');
        h = h.replace(/^# (.*)$/gm, '<h1>$1</h1>');
        h = h.replace(/^---+$/gm, '<hr>');
        h = h.replace(/^&gt; (.*)$/gm, '<blockquote>$1</blockquote>');
        h = h.replace(/^[-*] (.*)$/gm, '<li>$1</li>');
        h = h.replace(/(<li>[\s\S]*?<\/li>)+/g, function(m){ return '<ul>'+m+'</ul>'; });
        h = h.replace(/^\d+\. (.*)$/gm, '<li>$1</li>');
        h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        h = h.replace(/\*([^*]+)\*/g, '<em>$1</em>');
        h = h.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
        h = h.split(/\n{2,}/).map(function(p){ p=p.trim(); return p ? '<p>'+p.replace(/\n/g,'<br>')+'</p>' : ''; }).join('');
        return h;
    }
    function decorate(){
        var box = document.getElementById('messages');
        if(!box) return;
        var rows = box.querySelectorAll('.bubble-row');
        var lastDay = '';
        rows.forEach(function(row){
            var ts = Number(row.dataset.ts) || Date.now();
            var day = fmtDay(ts);
            var time = row.querySelector('.bubble-time');
            if(!time){ time = document.createElement('div'); time.className='bubble-time'; row.appendChild(time); }
            time.textContent = fmtTime(ts);
            if(day !== lastDay){
                var prev = row.previousElementSibling;
                if(!prev || !prev.classList.contains('date-divider') || prev.dataset.day !== day){
                    var d = document.createElement('div');
                    d.className='date-divider'; d.dataset.day = day; d.textContent = day;
                    box.insertBefore(d, row);
                }
                lastDay = day;
            }
        });
        box.querySelectorAll('.bubble-text').forEach(function(el){
            /* 「正在思考」占位气泡里挂着三个跳动的圆点（真实 DOM 节点），
               下面的 md() 会整体重写 innerHTML 把圆点抹掉 —— 思考态下直接跳过渲染。
               圆点消失（流式写入 textContent）后 thinking class 也会被摘掉，届时正常渲染。 */
            if(el.closest('.bubble.thinking')) return;
            var raw = el.textContent;
            if(el.dataset.mdRaw === raw) return;
            el.dataset.mdRaw = raw;
            el.innerHTML = md(raw);
        });
    }
    var box = document.getElementById('messages');
    if(box){
        /* 节流：decorate 会写回 DOM（innerHTML/insertBefore），直接同步 observe 会递归死循环 */
        var decorating = false;
        function decorateScheduled(){
            if(decorating) return;
            decorating = true;
            requestAnimationFrame(function(){ decorating = false; decorate(); });
        }
        new MutationObserver(decorateScheduled).observe(box, {childList:true, subtree:true, characterData:true});
        decorate();
    }
    /* 发送按钮追加 nv-beam 光束 class（非破坏性，不改原按钮行为） */
    var sb = document.getElementById('sendBtn');
    if(sb) sb.classList.add('nv-beam');
})();
</script>
<script>
/* ═══ V13 · 空态欢迎工作台（非破坏性装饰层） ═══
   仅当消息区处于空态（.empty-state 存在）时渲染欢迎卡片；
   点击卡片仅填充输入框、最近会话点击走原 openConversation，
   不发送请求、不改任何原函数与后端逻辑。 */
(function(){
    'use strict';
    var PROMPTS = [
        { ic:'deckImage',     title:'生成图片', desc:'一句话描述画面，AI 帮你画' },
        { ic:'deckWrite',    title:'写文案',   desc:'产品介绍、标题、广告语' },
        { ic:'deckCode',  title:'写代码',   desc:'修 bug、补注释、转语言' },
        { ic:'deckDoc', title:'读文档',   desc:'总结、问答、提取要点' },
        { ic:'deckSearch',    title:'查资料',   desc:'联网检索与整理' },
        { ic:'deckIdea',  title:'头脑风暴', desc:'开脑洞、列方案、做规划' }
    ];
    function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

    /* 读取会话列表：conversations 是主脚本里的 let 声明，存在于全局词法环境
       但不会挂到 window 上，所以必须按裸标识符读，window.conversations 恒为 undefined */
    function recentRows(){
        var rows = null;
        try { if(typeof conversations !== 'undefined' && conversations && conversations.length) rows = conversations; } catch(e){}
        if(!rows){ try { if(window.conversations && window.conversations.length) rows = window.conversations; } catch(e){} }
        if(!rows) return [];
        return rows.slice(0, 3);
    }

    function fillRecent(listEl){
        if(!listEl) return;
        var rows = recentRows();
        if(!rows.length){
            listEl.innerHTML = '<div class="welcome-empty-hint">还没有历史会话，聊点什么吧</div>';
            return;
        }
        listEl.innerHTML = rows.map(function(c){
            var t = c.last_message ? esc(String(c.last_message).slice(0,40)) : '';
            return '<button type="button" class="welcome-recent-item" data-id="' + esc(c.id) + '">' +
                '<span class="welcome-recent-title">' + esc(c.title || '新对话') + '</span>' +
                '<span class="welcome-recent-time">' + t + '</span>' +
            '</button>';
        }).join('');
    }

    /* 会话列表是异步加载的，空态可能先于数据渲染 —— 监听刷新事件补填一次 */
    window.addEventListener('novai:conversations-loaded', function(){
        var list = document.querySelector('.welcome-deck .welcome-recent-list');
        if(list) fillRecent(list);
    });

    function renderDeck(){
        var box = document.getElementById('messages');
        if(!box) return;
        if(!box.querySelector('.empty-state')) return;   /* 非空态不渲染 */
        if(box.querySelector('.welcome-deck')) return;   /* 已渲染 */
        if(box.querySelector('.bubble-row')) return;     /* 已有任何气泡也不再渲染（防御 sendMessage 没清掉的情况） */
        var empty = box.querySelector('.empty-state');
        if(empty) empty.style.display = 'none';          /* 隐藏原空态图标，避免重叠 */
        var d = document.createElement('div');
        d.className = 'welcome-deck';
        d.innerHTML =
            '<div class="welcome-head">' +
                '<h2 class="welcome-title">开始新的对话</h2>' +
                '<p class="welcome-sub">从一句提示词开始，或点下面的快捷入口</p>' +
            '</div>' +
            '<div class="welcome-grid">' + PROMPTS.map(function(p){
                return '<button type="button" class="welcome-card" data-prompt="' + esc(p.title + '：') + '">' +
                    '<span class="welcome-card-ic"><i data-icon="' + p.ic + '"></i></span>' +
                    '<span class="welcome-body">' +
                        '<span class="welcome-card-title">' + esc(p.title) + '</span>' +
                        '<span class="welcome-card-desc">' + esc(p.desc) + '</span>' +
                    '</span>' +
                '</button>';
            }).join('') + '</div>' +
            '<div class="welcome-recent">' +
                '<div class="welcome-recent-head">最近会话</div>' +
                '<div class="welcome-recent-box"><div class="welcome-recent-list"></div></div>' +
            '</div>';
        box.appendChild(d);
        if(window.lucide && lucide.createIcons) lucide.createIcons();
        fillRecent(d.querySelector('.welcome-recent-list'));
        d.addEventListener('click', function(e){
            var item = e.target.closest('.welcome-recent-item');
            if(item){ if(window.openConversation) openConversation(item.dataset.id, false); return; }
            var card = e.target.closest('.welcome-card');
            if(!card) return;
            var input = document.getElementById('messageInput');
            if(input){ input.value = card.dataset.prompt || ''; input.focus(); if(window.autoGrow) autoGrow(input); }
        });
    }

    var box = document.getElementById('messages');
    if(box){
        var rendering = false;
        function scheduled(){
            if(rendering) return;
            rendering = true;
            /* 同步渲染：renderDeck 有判等守卫（已渲染则直接 return），不会递归写回；
               不用 rAF，避免后台标签页暂停 rAF 导致 welcome-deck 永不渲染 */
            try { renderDeck(); } finally { rendering = false; }
        }
        new MutationObserver(scheduled).observe(box, {childList:true, subtree:true});
        scheduled();
    }
})();
</script>
<script>
/* V17 顶栏 + 发送按钮：强制覆盖运行时注入的主题样式。
   生产 app 会在运行时往 <head> 注入主题 <style>，位于本文件静态 V17 块之后，
   因此其 .topbar{background:glass} / .send-btn{border-radius:12px} 会覆盖静态规则。
   此处用内联 !important + 监听 <head> 变化反复重设，确保 V17 视觉始终生效。
   顶栏与发送按钮均不依赖主题色（透明 / 由 --text、--bg 决定），强制安全。 */
(function(){
  function forceTopbar(){
    var tb = document.querySelector('.topbar');
    if(!tb) return;
    tb.style.setProperty('background', 'transparent', 'important');
    tb.style.setProperty('backdrop-filter', 'none', 'important');
    tb.style.setProperty('-webkit-backdrop-filter', 'none', 'important');
    tb.style.setProperty('border-bottom', '0', 'important');
    /* V11 的 inset 0 1px 0 box-shadow 在浅色下会渲染成顶栏底部那条线，一并去掉 */
    tb.style.setProperty('box-shadow', 'none', 'important');
  }
  function forceSend(){
    var s = document.getElementById('sendBtn');
    if(!s) return;
    s.style.setProperty('border-radius', '50%', 'important');
    s.style.setProperty('width', '36px', 'important');
    s.style.setProperty('height', '36px', 'important');
    s.style.setProperty('background', 'var(--text)', 'important');
    s.style.setProperty('color', 'var(--bg)', 'important');
  }
  function forceComposer(){
    var c = document.querySelector('.composer');
    if(!c) return;
    c.style.setProperty('border', '0', 'important');
    c.style.setProperty('border-top', '0', 'important');
    c.style.setProperty('border-left', '0', 'important');
    c.style.setProperty('border-right', '0', 'important');
    c.style.setProperty('border-bottom', '0', 'important');
  }
/* V20.1 · 去框统一：弹窗 / 气泡不依赖主题色，强制安全 */
function forceNoBorder(selector, props){
    var list = document.querySelectorAll(selector);
    for(var i=0;i<list.length;i++){
        var el = list[i];
        for(var p in props){ if(Object.prototype.hasOwnProperty.call(props,p)) el.style.setProperty(p, props[p], 'important'); }
    }
}
function forcePopovers(){
    forceNoBorder('.chat-rail, .system-prompt-popover, .model-picker-popover, .model-picker-submenu, .resolution-picker-popover', {
        'border': '0',
        'box-shadow': '0 1px 3px rgba(0,0,0,.05), 0 18px 44px -14px rgba(0,0,0,.22)'
    });
}
function forceBubbles(){
    /* 背景也要强制：V14 有一条 html:not(.theme-dark) body:not(.theme-dark) .bubble.assistant
       的浅色特化规则，特异性高于静态 V20.1 块，只能靠内联 !important 压过去 */
    forceNoBorder('.bubble.assistant:not(.image-bubble)', {
        'border': '0',
        'backdrop-filter': 'none',
        '-webkit-backdrop-filter': 'none',
        'box-shadow': 'none',
        'background': 'color-mix(in srgb, var(--text) 7%, transparent)'
    });
    forceNoBorder('.bubble.user:not(.image-bubble)', { 'border': '0', 'box-shadow': 'none' });
}
function forceShell(){
    var sh = document.querySelector('.chat-shell');
    if(sh) sh.style.setProperty('background', 'var(--bg)', 'important');
    var rail = document.getElementById('v10Rail');
    if(rail) rail.style.setProperty('display', 'none', 'important');
}
function forceActionBtns(){
    var btns = document.querySelectorAll('.top-actions .action-btn');
    for(var i=0;i<btns.length;i++){
        btns[i].style.setProperty('background', 'transparent', 'important');
        btns[i].style.setProperty('border', '0', 'important');
        btns[i].style.setProperty('box-shadow', 'none', 'important');
    }
}
function forceAttachBtn(){
    /* 附件 "+" 按钮：V10C 玻璃浮层（backdrop-filter + box-shadow + width:36px）会被主题注入再写一遍，
       静态 V20.1 !important 选择器 (0,2,0) 在浅色下能赢，但运行时主题注入若设更复杂选择器或更高特异，
       会让按钮看起来又带浅灰圆角方框。靠内联 !important 兜底。 */
    var btns = document.querySelectorAll('.upload-btn.attach-btn');
    for(var i=0;i<btns.length;i++){
        var el = btns[i];
        el.style.setProperty('background', 'transparent', 'important');
        el.style.setProperty('border', '0', 'important');
        el.style.setProperty('backdrop-filter', 'none', 'important');
        el.style.setProperty('-webkit-backdrop-filter', 'none', 'important');
        el.style.setProperty('box-shadow', 'none', 'important');
        el.style.setProperty('width', 'auto', 'important');
        el.style.setProperty('min-width', '30px', 'important');
    }
}

/* V20.1 · 系统角色库 chips：与 attach-btn 同样的去框兜底。
   只强制「框」相关的四个属性（border / backdrop-filter / box-shadow），
   不碰 background 与 color —— 否则内联 !important 会盖掉 .persona-chip.active 的选中态配色。
   角色 chips 是动态渲染的，挂到 window 上供 renderPersonaChips() 渲染后回补。 */
function forcePersonas(){
    forceNoBorder('.persona-chip, .persona-mini-btn, .persona-name-input', {
        'border': '0',
        'backdrop-filter': 'none',
        '-webkit-backdrop-filter': 'none',
        'box-shadow': 'none'
    });
}
window.__novaiForcePersonas = forcePersonas;

/* V20.1 · 长期记忆库 rows：与 persona chips 同样的去框兜底，只清「框」相关属性。
   记忆行是动态渲染的，挂到 window 上供 renderMemoryList() 渲染后回补。 */
function forceMemories(){
    forceNoBorder('.memory-row, .memory-toggle, .memory-del, .memory-input, .memory-add-btn, .memory-scope, .scope-btn, .memory-tag', {
        'border': '0',
        'backdrop-filter': 'none',
        '-webkit-backdrop-filter': 'none',
        'box-shadow': 'none'
    });
}
window.__novaiForceMemories = forceMemories;

  function applyAll(){ forceTopbar(); forceSend(); forceComposer(); forcePopovers(); forceBubbles(); forceShell(); forceActionBtns(); forceAttachBtn(); forcePersonas(); forceMemories(); }
  applyAll();
  if(window.MutationObserver){
    new MutationObserver(applyAll).observe(document.head, {childList:true, subtree:true});
  }
  /* 气泡是动态插入的，单独监听消息区 */
  var msgBox = document.getElementById('messages');
  if(msgBox && window.MutationObserver) new MutationObserver(forceBubbles).observe(msgBox, {childList:true, subtree:true});
  document.addEventListener('DOMContentLoaded', applyAll);
  window.addEventListener('load', applyAll);
})();
</script>
