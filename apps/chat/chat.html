<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chat</title>
<!--
  NOVAI OS · Thin Migration Entry（apps/chat/chat.html）

  用途：仅作为 Registry manifest（novai-app/v1，entry:"chat.html"）要求的**真实 entry 文件**存在。
        它必须真实可达（adapter.prepare 的 Entry Validation 会 HEAD 探测它）。

  ⛔ 不复制 Legacy 业务源码：真实 UI 仍只有唯一一份 /static/gpt-chat.html。
  ⛔ 不嵌套 iframe：这里是**同一个 iframe 内**直接导航，因此
     - 不产生 iframe-in-iframe
     - 不额外增加一条 history 记录（用 location.replace，而非 assign / href）
     - osWindowFrame 的 focus bridge 绑在 iframe **元素**上，同 iframe 导航不使其失效
     - singleton / session keepAlive 复用语义完全不变

  链路：manifest → /apps/chat/chat.html（thin） ──同 iframe 导航──▶ /static/gpt-chat.html
-->
<script>
  location.replace("/static/gpt-chat.html");
</script>
</head>
<body>
  <noscript>
    <p>正在打开 Chat…<a href="/static/gpt-chat.html">点击继续</a></p>
  </noscript>
</body>
</html>
