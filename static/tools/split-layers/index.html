<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拆分图层 · 原型 · BEAT</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>
/* Google Fonts 以非阻塞方式注入：不拖慢 load 事件；被墙/离线时静默回退系统字体 */
(function(){
  var FONT_CSS='https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Sora:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&family=Bebas+Neue&family=Roboto+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;700&family=Ma+Shan+Zheng&display=swap';
  window.__fontCssReady=new Promise(function(resolve){
    var done=false, loaded=false;
    function fin(){ if(done) return; done=true; resolve(); }
    function add(){
      try{
        var l=document.createElement('link');
        l.rel='stylesheet';
        l.href=FONT_CSS;
        l.crossOrigin='anonymous';
        l.onload=function(){ loaded=true; fin(); };
        l.onerror=fin;
        document.head.appendChild(l);
        setTimeout(function(){ if(!loaded){ try{ l.parentNode&&l.parentNode.removeChild(l); }catch(e){} fin(); } },5000);
      }catch(e){ fin(); }
    }
    /* 在 load 之后再拉字体 CSS：任何字体/CDN 卡顿都不会拖慢页面 load 事件 */
    if(document.readyState==='complete') add();
    else window.addEventListener('load',add);
  });
})();
</script>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#0A0A0B;color:#F2F2F2;font-family:"Archivo",system-ui,-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;font-size:13px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;background:none;border:0;outline:none}
:focus-visible{outline:2px solid #0A84FF;outline-offset:2px}
.off{display:none!important}
.ic{width:18px;height:18px;display:block;flex:0 0 auto}
.ic-sm{width:14px;height:14px}
:root{
  --bg:#0A0A0B; --panel:rgba(28,28,30,.95); --panel-hi:rgba(38,38,41,.97);
  --txt:#F2F2F2; --muted:#9A9A9E; --faint:#6E6E73;
  --hover:rgba(255,255,255,.07); --sel:rgba(255,255,255,.10);
  --accent:#0A84FF;
  --shadow:0 24px 64px rgba(0,0,0,.35),0 8px 20px rgba(0,0,0,.18);
  --glass-blur:blur(28px) saturate(1.3);
}

/* ---------- app shell ---------- */
#app{height:100vh;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:56px;flex:0 0 56px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:12px;position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;letter-spacing:.01em;white-space:nowrap}
.brand b{color:var(--txt);font-weight:600;letter-spacing:.04em}
.brand .sep{opacity:.45}
.topbar-right{display:flex;align-items:center;gap:10px}
.status{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:10px;background:rgba(255,255,255,.06);font-size:12px;color:#C4C4C9;white-space:nowrap}
.status:hover{background:rgba(255,255,255,.10)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:0 0 auto}
.dot.online{background:#30D158;box-shadow:0 0 0 4px rgba(48,209,88,.14)}
.dot.offline{background:#FF453A;box-shadow:0 0 0 4px rgba(255,69,58,.12)}
.dot.checking{background:#FFD60A;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ghost-btn{height:34px;display:flex;align-items:center;gap:7px;padding:0 13px;border-radius:10px;background:rgba(255,255,255,.06);font-size:12.5px;color:#E6E6EA;white-space:nowrap}
.ghost-btn:hover{background:rgba(255,255,255,.11)}

.main{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
.canvas{position:absolute;inset:0;background-color:#0A0A0B;background-image:radial-gradient(rgba(255,255,255,.075) 1px,transparent 1px);background-size:24px 24px;background-position:center center}
.canvas::after{content:"";position:absolute;inset:0;background:radial-gradient(58% 48% at 50% 42%,rgba(10,132,255,.10),transparent 72%);pointer-events:none}

.view{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px 24px;min-width:0}
.view-result{flex-direction:row;gap:24px;align-items:center}
.view-result.off,.view-node.off{display:none}

/* ---------- frosted glass ---------- */
.glass{background:var(--panel);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:var(--shadow)}

/* ---------- node tools ---------- */
.node-tools{display:flex;align-items:center;gap:2px;height:48px;padding:5px 6px;border-radius:16px;position:relative;z-index:45;max-width:calc(100vw - 48px)}
.tool{height:36px;border-radius:10px;display:flex;align-items:center;gap:6px;padding:0 9px;color:#C6C6CC;flex:0 0 auto}
.tool:hover{background:var(--hover);color:var(--txt)}
.tool .lbl{max-width:0;opacity:0;overflow:hidden;white-space:nowrap;font-size:12px;transition:max-width .16s ease,opacity .16s ease,margin .16s ease}
.tool:hover .lbl{max-width:90px;opacity:1;margin-left:2px}
.split-wrap{position:relative;margin-left:6px;flex:0 0 auto}
.btn-split{height:36px;border-radius:10px;padding:0 13px;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;background:rgba(255,255,255,.10);color:var(--txt)}
.btn-split:hover{background:rgba(255,255,255,.17)}
.btn-split:active{transform:scale(.985)}
.split-menu{position:absolute;top:calc(100% + 10px);right:0;width:300px;border-radius:14px;padding:7px;z-index:70;background:var(--panel-hi);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:var(--shadow);animation:menuIn .13s ease-out}
@keyframes menuIn{from{opacity:0;transform:translateY(-4px) scale(.99)}to{opacity:1;transform:none}}
.menu-item{width:100%;height:52px;border-radius:10px;display:flex;align-items:center;gap:12px;padding:0 12px;text-align:left}
.menu-item:hover{background:var(--hover)}
.menu-item .mi-ic{color:#D8D8DD;display:grid;place-items:center;width:20px;height:20px}
.menu-item .mi-label{flex:1;font-size:14px}
.menu-item .mi-credit{font-size:13px;color:var(--faint);letter-spacing:.02em}
.menu-item .mi-sub{font-size:11px;color:var(--faint);margin-top:2px}

/* ---------- node card ---------- */
.node-card{position:relative;border-radius:18px;padding:9px;background:rgba(28,28,30,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:var(--shadow);flex:0 0 auto}
.node-media{position:relative;border-radius:12px;overflow:hidden;background:#131315;line-height:0}
.node-media>img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.node-media>img:not([src]){visibility:hidden}
.node-hint{color:var(--faint);font-size:11.5px;letter-spacing:.02em}

/* ---------- splitting overlay ---------- */
.split-ov{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;border-radius:18px;background:rgba(12,12,14,.72);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);animation:fadeIn .18s ease-out}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.layers-anim{position:absolute;inset:0;z-index:2;overflow:hidden;pointer-events:none}
.layers-anim i{position:absolute;top:0;bottom:0;left:-65%;width:55%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);animation:slSweep 1.6s cubic-bezier(.16,1,.3,1) infinite}
@keyframes slSweep{to{transform:translate(300%)}}
@media (prefers-reduced-motion:reduce){.layers-anim i{animation:none;transform:translate(150%)}}
.split-ov .ov-title{font-size:14px;font-weight:500}
.split-ov .ov-stage{font-size:11.5px;color:var(--muted);height:16px;letter-spacing:.02em}
.split-ov .ov-credit{font-size:12px;color:#FFD60A;margin-top:-4px}
.progress{width:220px;height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.progress i{display:block;height:100%;width:0;border-radius:2px;background:var(--accent);transition:width .45s ease}

/* ---------- selection overlay ---------- */
.sel-layer{position:absolute;inset:0;z-index:25;cursor:crosshair;background:rgba(10,10,12,.30)}
.sel-rect{position:absolute;background:rgba(10,132,255,.18);box-shadow:0 0 0 1.5px #0A84FF,0 0 0 9999px rgba(0,0,0,.18);border-radius:2px;pointer-events:none}
.sel-label{position:absolute;left:50%;top:-8px;transform:translate(-50%,-100%);height:21px;padding:0 8px;border-radius:6px;background:#0A84FF;color:#fff;font-size:11px;display:flex;align-items:center;white-space:nowrap;font-variant-numeric:tabular-nums}
.sel-hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);height:28px;padding:0 12px;border-radius:8px;background:rgba(20,20,22,.92);color:#C9C9CE;font-size:11.5px;display:flex;align-items:center;gap:6px;white-space:nowrap}

/* ---------- stage ---------- */
.stage-col{position:relative;display:flex;flex-direction:column;align-items:center;gap:11px;min-width:0}
.bar{height:52px;border-radius:16px;display:flex;align-items:center;padding:0 10px;flex:0 0 auto;max-width:100%;position:relative;z-index:40}
.result-bar{gap:14px;padding-left:16px}
.rb-info{display:flex;align-items:baseline;gap:7px;white-space:nowrap}
.rb-title{font-size:13px;font-weight:500}
.rb-sub{font-size:12px;color:var(--muted)}
.rb-actions{display:flex;align-items:center;gap:2px}
.bar-btn{height:36px;border-radius:9px;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:12.5px;color:#DDDDE1}
.bar-btn:hover{background:var(--hover);color:#fff}
.bar-btn .ic{width:15px;height:15px}
.text-bar{gap:1px;padding:6px 7px;height:52px}
.tbtn{height:38px;border-radius:10px;display:flex;align-items:center;gap:7px;padding:0 9px;font-size:14px;color:var(--txt);flex:0 0 auto}
.tbtn:hover{background:var(--hover)}
.tbtn.on{background:var(--sel)}
.tbtn .chev{color:var(--muted);width:14px;height:14px}
.tbtn.tbtn-icon{padding:0 10px}
.tbtn .tlabel{max-width:112px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swatch{width:26px;height:26px;border-radius:50%;display:block;box-shadow:0 0 0 1.5px rgba(255,255,255,.6) inset,0 0 0 1px rgba(0,0,0,.35)}
.swatch.stroke{background:#000;box-shadow:0 0 0 2px rgba(255,255,255,.75)}

.stage{position:relative;border-radius:10px;overflow:hidden;overflow:clip;flex:0 0 auto;cursor:grab}
.stage.panning{cursor:grabbing}
.stage-pan{position:absolute;left:0;top:0;transform-origin:0 0}
.artboard{position:relative;background:transparent}
.artboard .orig-bg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:0}
.lyr{position:absolute;transform-origin:0 0}
.lyr-img{overflow:visible}
.lyr-img img{display:block;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none;object-fit:fill}
.lyr-img.sel{cursor:move}
.lyr-text{width:auto;height:auto;cursor:pointer;user-select:none;-webkit-user-select:none}
.lyr-text.editing .txt{user-select:text;-webkit-user-select:text}
body{user-select:none;-webkit-user-select:none}
input,textarea,select,[contenteditable="true"]{user-select:text;-webkit-user-select:text}
.lyr-text .txt{width:max-content;max-width:none;min-width:6px;min-height:1em;height:auto;outline:none;overflow:visible;white-space:pre;cursor:inherit;caret-color:#0A84FF}
.lyr-text.editing .txt{cursor:text;-webkit-user-modify:read-write-plaintext-only}
.lyr-text.sel{cursor:move}
.text-frame{position:absolute;left:0;top:0;width:0;height:0;border:1px solid #0A84FF;border-radius:2px;z-index:9;pointer-events:none;display:none;box-sizing:border-box}
.text-frame.on{display:block}
.text-frame.imgsel{pointer-events:auto;cursor:move}
.text-frame .tf-h{position:absolute;width:14px;height:14px;pointer-events:auto;background:transparent}
.text-frame .tf-h::after{content:"";position:absolute;left:3px;top:3px;width:8px;height:8px;background:#fff;border-radius:1.5px;box-shadow:0 0 0 1.5px #0A84FF}
.text-frame .tf-h.tl{left:-7px;top:-7px;cursor:nwse-resize}
.text-frame .tf-h.tr{right:-7px;top:-7px;cursor:nesw-resize}
.text-frame .tf-h.bl{left:-7px;bottom:-7px;cursor:nesw-resize}
.text-frame .tf-h.br{right:-7px;bottom:-7px;cursor:nwse-resize}
.lyr-text.editing.sel{outline-color:#0A84FF}
.lyr-text .handle{display:none;position:absolute;width:26px;height:26px;background:transparent;z-index:6}
.lyr-text .handle::after{content:"";position:absolute;left:8.5px;top:8.5px;width:9px;height:9px;background:#fff;border-radius:1.5px;box-shadow:0 0 0 1.5px #0A84FF}
.lyr-text.sel .handle{display:none}
.lyr-text.tiny.sel .handle{display:none}
.lyr-text .handle.tl{left:-13px;top:-13px;cursor:nwse-resize}
.lyr-text .handle.tr{right:-13px;top:-13px;cursor:nesw-resize}
.lyr-text .handle.bl{left:-13px;bottom:-13px;cursor:nesw-resize}
.lyr-text .handle.br{right:-13px;bottom:-13px;cursor:nwse-resize}
.align-guides{position:absolute;inset:0;z-index:8;pointer-events:none;display:none}
.align-guides.on{display:block}
.align-guides .guide{position:absolute;background:none}
.align-guides .guide.v{top:0;bottom:0;width:0;border-left:1px dashed #0A84FF}
.align-guides .guide.h{left:0;right:0;height:0;border-top:1px dashed #0A84FF}

/* ---------- layers panel ---------- */
.layers{width:280px;flex:0 0 280px;border-radius:18px;background:var(--panel);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.layers-head{height:52px;flex:0 0 52px;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 16px}
.layers-title{font-size:14px;font-weight:600;display:flex;align-items:baseline;gap:7px}
.layers-title span{color:var(--muted);font-weight:400;font-size:12px;font-variant-numeric:tabular-nums}
.layers-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:0 8px 8px}
.layers-foot{flex:0 0 auto;padding:8px 14px 12px;display:flex;align-items:center;justify-content:space-between}
.switch{display:flex;align-items:center;gap:8px;font-size:12px;color:#C9C9CE;cursor:pointer;user-select:none}
.switch input{appearance:none;width:30px;height:17px;border-radius:9px;background:rgba(255,255,255,.16);position:relative;transition:background .15s ease;cursor:pointer;margin:0}
.switch input::after{content:"";position:absolute;left:2px;top:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:transform .15s ease}
.switch input:checked{background:#30D158}
.switch input:checked::after{transform:translateX(13px)}
.layer-row{display:flex;align-items:center;gap:9px;height:52px;padding:0 6px 0 8px;border-radius:10px;cursor:pointer;position:relative}
.layer-row:hover{background:var(--hover)}
.layer-row.sel{background:var(--sel)}
.thumb{width:34px;height:34px;flex:0 0 34px;border-radius:8px;overflow:hidden;display:grid;place-items:center;font-size:14px;font-weight:600;color:#F2F2F2;background-color:#26262a;background-image:linear-gradient(45deg,#34343a 25%,transparent 25%,transparent 75%,#34343a 75%),linear-gradient(45deg,#34343a 25%,transparent 25%,transparent 75%,#34343a 75%);background-size:8px 8px;background-position:0 0,4px 4px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.layer-meta{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.layer-name{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#EDEDF0}
.badge{align-self:flex-start;display:inline-flex;height:17px;align-items:center;padding:0 5px;border-radius:4px;background:rgba(255,255,255,.09);color:#A8A8AE;font-size:10px;letter-spacing:.02em}
.icon-btn{width:26px;height:26px;flex:0 0 26px;border-radius:7px;display:grid;place-items:center;color:#8B8B91}
.icon-btn:hover{background:rgba(255,255,255,.12);color:#fff}
.layer-row .row-dl{opacity:0;transition:opacity .12s ease}
.layer-row:hover .row-dl,.layer-row.sel .row-dl{opacity:1}
.scroll{scrollbar-width:thin;scrollbar-color:#46464a transparent}
.scroll::-webkit-scrollbar{width:8px;height:8px}
.scroll::-webkit-scrollbar-track{background:transparent}
.scroll::-webkit-scrollbar-thumb{background:#46464a;border-radius:4px;border:2px solid transparent;background-clip:content-box}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;z-index:90;background:rgba(6,6,8,.52);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center;animation:fadeIn .16s ease-out;padding:20px}
.modal{width:596px;max-width:calc(100vw - 40px);border-radius:20px;padding:22px;background:rgba(28,28,30,.97);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:var(--shadow);animation:popIn .16s cubic-bezier(.2,.8,.3,1)}
@keyframes popIn{from{opacity:0;transform:scale(.975) translateY(6px)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.modal-title{font-size:18px;font-weight:600;letter-spacing:.01em}
.modal-desc{width:100%;height:120px;resize:none;font-size:14px;line-height:1.65;color:#F2F2F2;padding:4px 0;display:block}
.modal-desc::placeholder{color:#6A6A70}
.modal-desc:focus{outline:none}
.chip-wrap{display:flex;align-items:center;gap:8px;min-height:8px;margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 11px;border-radius:8px;background:rgba(10,132,255,.16);color:#8FC5FF;font-size:12px;font-variant-numeric:tabular-nums}
.chip button{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;color:#8FC5FF}
.chip button:hover{background:rgba(10,132,255,.25)}
.modal-foot{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:14px}
.btn{height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;letter-spacing:.01em;padding:0 22px}
.btn-ghost{background:rgba(255,255,255,.08);color:#EDEDF0;min-width:118px}
.btn-ghost:hover{background:rgba(255,255,255,.14)}
.btn-primary{background:#F2F2F2;color:#0A0A0B;font-weight:600;min-width:160px}
.btn-primary:hover{background:#fff}
.btn-primary:disabled{opacity:.38;cursor:not-allowed;background:#8C8C90;color:#1A1A1C}

/* ---------- panels ---------- */
.panel{position:fixed;z-index:80;border-radius:18px;padding:15px;background:rgba(28,28,30,.96);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:var(--shadow);display:none;flex-direction:column;gap:12px}
.panel.open{display:flex;animation:panelIn .12s ease-out}
@keyframes panelIn{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel-title{font-size:14px;font-weight:600}
.panel-x{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.panel-x:hover{background:var(--hover);color:#fff}
.panel-sub{font-size:11.5px;color:var(--faint);margin-top:-6px}

.picker{display:flex;flex-direction:column;gap:12px}
.sv{position:relative;width:100%;height:220px;border-radius:10px;overflow:hidden;cursor:crosshair;touch-action:none;background:#f00}
.sv-white{position:absolute;inset:0;background:linear-gradient(to right,#fff,rgba(255,255,255,0))}
.sv-black{position:absolute;inset:0;background:linear-gradient(to top,#000,rgba(0,0,0,0))}
.sv-dot{position:absolute;width:18px;height:18px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.4),0 2px 6px rgba(0,0,0,.45);transform:translate(-50%,-50%);pointer-events:none;left:0;top:0}
.slider{position:relative;height:12px;border-radius:6px;touch-action:none;cursor:pointer}
.slider .thumb{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid #fff;transform:translate(-50%,-50%);box-shadow:0 1px 4px rgba(0,0,0,.5),0 0 0 1px rgba(0,0,0,.25);pointer-events:none;left:0}
.hue{background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.alpha{overflow:visible;border-radius:6px;background-color:#1f1f22;background-image:linear-gradient(45deg,#3a3a3e 25%,transparent 25%,transparent 75%,#3a3a3e 75%),linear-gradient(45deg,#3a3a3e 25%,transparent 25%,transparent 75%,#3a3a3e 75%);background-size:10px 10px;background-position:0 0,5px 5px}
.alpha .alpha-fill{position:absolute;inset:0;border-radius:6px}
.swatches{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;position:relative;flex:0 0 auto;box-shadow:0 0 0 1px rgba(255,255,255,.18) inset}
.sw.on{box-shadow:0 0 0 2px #0A84FF,0 0 0 3px rgba(10,132,255,.25)}
.sw.transparent{background-color:#1f1f22;background-image:linear-gradient(45deg,#4a4a4e 25%,transparent 25%,transparent 75%,#4a4a4e 75%),linear-gradient(45deg,#4a4a4e 25%,transparent 25%,transparent 75%,#4a4a4e 75%);background-size:8px 8px;background-position:0 0,4px 4px}
.fields{display:flex;gap:8px}
.field{display:flex;align-items:center;gap:6px;height:38px;border-radius:10px;background:rgba(255,255,255,.07);padding:0 12px;flex:1 1 auto;min-width:0}
.field .pfx{color:var(--faint);font-size:13px}
.field input{flex:1 1 auto;min-width:0;font-size:13px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.field .suffix{color:var(--faint);font-size:12px}
.field.small{flex:0 0 96px}
.stroke-row{display:flex;gap:8px;align-items:center}
.mini{height:38px;border-radius:10px;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 11px;font-size:13px;flex:1 1 auto;min-width:0;white-space:nowrap}
.mini:hover{background:rgba(255,255,255,.11)}
.mini .mv{overflow:hidden;text-overflow:ellipsis}
.mini .chev{width:13px;height:13px;color:var(--muted);flex:0 0 auto}
.mini-wrap{position:relative;flex:1 1 auto;min-width:0}
.mini-menu{position:absolute;left:0;top:calc(100% + 6px);min-width:100%;border-radius:11px;padding:5px;background:rgba(40,40,43,.99);box-shadow:var(--shadow);z-index:90;animation:menuIn .12s ease-out}
.mini-menu button{width:100%;height:34px;border-radius:8px;display:flex;align-items:center;padding:0 10px;font-size:13px;white-space:nowrap;gap:8px}
.mini-menu button:hover{background:var(--hover)}
.mini-menu button.on{background:var(--sel)}
.width-field{display:flex;align-items:center;gap:8px;height:38px;border-radius:10px;background:rgba(255,255,255,.07);padding:0 11px;flex:0 0 112px}
.width-field input{width:100%;min-width:0;font-size:13px;font-variant-numeric:tabular-nums}
.width-field .unit{color:var(--faint);font-size:12px}

/* font panel */
.search{height:38px;border-radius:10px;background:rgba(255,255,255,.07);display:flex;align-items:center;gap:8px;padding:0 11px}
.search input{flex:1;min-width:0;font-size:13px}
.search input::placeholder{color:var(--faint)}
.search .ic{color:var(--muted);width:15px;height:15px}
.font-tools{display:flex;align-items:center;gap:8px}
.font-tools .mini{flex:1 1 auto}
.tplus{width:38px;height:38px;flex:0 0 38px;border-radius:10px;background:rgba(255,255,255,.07);display:grid;place-items:center;color:#DDDDE1;font-size:12.5px;font-weight:500;letter-spacing:.02em}
.tplus:hover{background:rgba(255,255,255,.13)}
.font-list{max-height:392px;overflow-y:auto;display:flex;flex-direction:column;gap:1px;padding-right:2px}
.font-group{font-size:10.5px;letter-spacing:.06em;color:var(--faint);padding:8px 10px 4px;text-transform:uppercase}
.font-item{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:42px;padding:6px 10px;border-radius:8px;font-size:18px;text-align:left;color:#F2F2F2;line-height:1.25}
.font-item:hover{background:var(--hover)}
.font-item.on{background:var(--sel)}
.font-item .fi-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.font-item .ic{color:#fff;width:15px;height:15px;flex:0 0 auto}
.empty-tip{padding:14px 10px;color:var(--faint);font-size:12px}

/* list panels */
.opt-list{display:flex;flex-direction:column;gap:1px;overflow-y:auto}
.opt{display:flex;align-items:center;justify-content:space-between;gap:8px;height:40px;padding:0 9px;border-radius:8px;font-size:18px;color:#F2F2F2;text-align:left;line-height:1.2;flex:0 0 auto}
.opt:hover{background:var(--hover)}
.opt.on{background:var(--sel)}
.opt .ic{width:15px;height:15px;color:#fff;flex:0 0 auto}
.align-row{display:flex;gap:2px}
.align-row .opt{width:44px;height:44px;justify-content:center;padding:0;font-size:0}
.align-row .opt .ic{width:19px;height:19px;color:#E6E6EA}

/* adjust panel */
.adj-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.adj{height:56px;border-radius:12px;background:rgba(255,255,255,.07);display:flex;align-items:center;gap:6px;padding:0 8px;min-width:0}
.adj .aj-ic{width:22px;height:22px;display:grid;place-items:center;color:#B9B9BF;flex:0 0 22px}
.adj .aj-ic .ic{width:16px;height:16px}
.adj .aj-body{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:2px}
.adj .step{width:20px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--muted);flex:0 0 20px;font-size:15px;line-height:1}
.adj .step:hover{background:rgba(255,255,255,.12);color:#fff}
.adj input{width:100%;min-width:0;text-align:center;font-size:13px;font-variant-numeric:tabular-nums;background:transparent}
.adj .unit{color:var(--faint);font-size:11px;flex:0 0 auto}
.adj.wide{grid-column:span 2}
.tog{height:56px;border-radius:12px;background:rgba(255,255,255,.07);display:flex;align-items:center;gap:2px;padding:0 8px}
.tog button{flex:1 1 0;height:36px;border-radius:8px;display:grid;place-items:center;color:#C9C9CE;font-size:13px}
.tog button:hover{background:rgba(255,255,255,.09);color:#fff}
.tog button.on{background:rgba(255,255,255,.14);color:#fff}
.tog button .ic{width:16px;height:16px}
.adj-reset{width:100%;height:38px;border-radius:10px;background:rgba(255,255,255,.07);font-size:12.5px;color:#C9C9CE}
.adj-reset:hover{background:rgba(255,255,255,.12);color:#fff}
.case-tog{height:56px;border-radius:12px;background:rgba(255,255,255,.07);display:flex;align-items:center;gap:2px;padding:0 6px}

/* api popover */
.popover{position:fixed;right:16px;top:52px;width:326px;border-radius:16px;padding:16px;background:rgba(30,30,33,.98);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:var(--shadow);z-index:85;display:none;flex-direction:column;gap:11px;animation:menuIn .13s ease-out}
.popover.open{display:flex}
.pop-title{font-size:14px;font-weight:600}
.pop-desc{font-size:11.5px;color:var(--muted);line-height:1.55}
.pop-row{display:flex;gap:8px}
.pop-row .field{flex:1 1 auto}
.pop-btn{height:38px;padding:0 14px;border-radius:10px;background:rgba(255,255,255,.12);font-size:12.5px;white-space:nowrap}
.pop-btn:hover{background:rgba(255,255,255,.18)}
.pop-btn.primary{background:#F2F2F2;color:#0A0A0B;font-weight:600}
.pop-hint{font-size:11.5px;color:var(--faint)}

/* toast */
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:120;pointer-events:none}
.toast{min-height:38px;padding:8px 16px;border-radius:11px;background:rgba(38,38,41,.97);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:0 12px 32px rgba(0,0,0,.4);font-size:12.5px;color:#EDEDF0;display:flex;align-items:center;gap:8px;animation:toastIn .18s ease-out;max-width:min(560px,86vw)}
.toast.out{opacity:0;transform:translateY(6px);transition:opacity .2s ease,transform .2s ease}
.toast .tdot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:0 0 6px}
.toast.warn .tdot{background:#FFD60A}
.toast.err .tdot{background:#FF453A}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.panel{max-height:calc(100vh - 24px)}
.case-tog button{flex:1 1 0;height:36px;border-radius:8px;display:grid;place-items:center;color:#C9C9CE;font-size:13px;letter-spacing:.02em}
.case-tog button:hover{background:rgba(255,255,255,.09);color:#fff}
.case-tog button.on{background:rgba(255,255,255,.14);color:#fff}
.tog button.on{background:rgba(255,255,255,.14);color:#fff}


/* ============================================================
   v2：双节点工作区 / 结果节点 / 贴边自定义面板
   ============================================================ */
.main{display:flex;align-items:center;justify-content:center}
.workspace{display:flex;align-items:flex-start;justify-content:center;gap:36px;position:relative;max-width:calc(100vw - 24px);transition:transform .18s cubic-bezier(.2,.8,.3,1)}
.node-shell{position:relative;padding-top:62px;flex:0 0 auto}
.node-shell.appear{animation:nodeIn .17s cubic-bezier(.2,.8,.3,1) both}
@keyframes nodeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.node-shell.closing{opacity:0;transform:translateY(8px);transition:opacity .14s ease,transform .14s ease}
.result-node.hidden{display:none!important}
.source-node .node-tools{position:absolute;top:0;left:50%;transform:translateX(-50%);margin:0;z-index:45}
.source-node .node-hint{margin-top:10px;text-align:center;display:block}


/* 结果节点 */
.result-node{padding-top:62px}
.result-node>.bar{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:40;max-width:calc(100vw - 28px);white-space:nowrap}
.result-card{display:flex;flex-direction:column;gap:10px}
.result-head{display:flex;align-items:center;justify-content:space-between;height:30px;padding-left:4px;flex:0 0 auto}
.result-title{font-size:13px;font-weight:600;display:flex;align-items:baseline;gap:7px;white-space:nowrap}
.result-title span{font-weight:400;color:var(--muted);font-size:12px}
.result-x{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:0 0 auto}
.result-x:hover{background:var(--hover);color:#fff}
.result-body{display:flex;gap:12px;align-items:stretch;min-height:0}
.result-node .layers{width:196px;flex:0 0 196px;background:rgba(255,255,255,.035);border-radius:12px;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.result-node .layers-head{height:44px;flex-basis:44px;padding:0 4px 0 12px}
.result-node .layers-title{font-size:12.5px;gap:5px}
.result-node .layers-title span{font-size:11.5px}
.result-node .layers-body{padding:0 5px 6px}
.result-node .layers-foot{padding:6px 10px 8px}
.result-node .switch{font-size:11px;gap:6px}
.result-node .switch input{width:26px;height:15px}
.result-node .switch input::after{width:11px;height:11px}
.result-node .switch input:checked::after{transform:translateX(11px)}
.result-node .layer-row{height:44px;gap:7px;padding:0 4px 0 6px}
.result-node .thumb{width:30px;height:30px;flex:0 0 30px;font-size:12px}
.result-node .layer-name{font-size:12px}
.result-node .badge{font-size:9.5px;height:15px;padding:0 4px}
.result-node .icon-btn{width:22px;height:22px;flex:0 0 22px}
.result-node .icon-btn .ic{width:15px;height:15px}
.result-node .layers-head .bar-btn{font-size:11.5px;padding:0 6px;gap:4px}
.result-node .layers-head .bar-btn .ic{width:13px;height:13px}
.result-node .rb-title{font-size:12.5px}
.result-node .rb-sub{font-size:12px}
.result-node .bar-btn{font-size:12px;padding:0 8px;gap:5px}
.result-node .result-bar{gap:10px;padding-left:14px;padding-right:6px}
.result-node .bar{height:50px}
#result-bar .rb-zoom{display:flex;align-items:center;gap:1px;height:34px;padding:2px;border-radius:10px;background:rgba(255,255,255,.06);pointer-events:auto}
#result-bar .rb-zoom button{height:30px;min-width:26px;padding:0 5px;border-radius:7px;display:grid;place-items:center;font-size:13px;line-height:1;color:#C9C9CE;font-variant-numeric:tabular-nums;white-space:nowrap}
#result-bar .rb-zoom button:hover{background:rgba(255,255,255,.12);color:#fff}
#result-bar .rb-zoom #zoom-pct{min-width:46px;font-size:11.5px;color:#E6E6EA}
#result-bar .rb-zoom #zoom-fit{font-size:11.5px;padding:0 8px}
html.theme-light #result-bar .rb-zoom{background:rgba(0,0,0,.05)}
html.theme-light #result-bar .rb-zoom button{color:#3a3a3c}
html.theme-light #result-bar .rb-zoom button:hover{background:rgba(0,0,0,.08);color:#000}

/* loading：原图铺底（JS 注入背景图 + 压暗），扫光叠在最上层 */
.result-loading{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;border-radius:12px;background:#0A0A0B;overflow:hidden;flex:1 1 auto;min-height:280px}

/* 自定义拆分面板（贴源图右侧） */
.cpanel{position:absolute;top:62px;left:calc(100% + 20px);width:430px;border-radius:16px;background:rgba(28,28,30,.96);-webkit-backdrop-filter:blur(28px);backdrop-filter:blur(28px);box-shadow:var(--shadow);z-index:60;animation:cpanelIn .14s cubic-bezier(.2,.8,.3,1)}
@keyframes cpanelIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.cpanel-inner{padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px}
.cpanel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:2px}
.cpanel-title{font-size:18px;font-weight:600;letter-spacing:.01em}
.cpanel-desc{width:100%;min-height:76px;max-height:200px;resize:none;font-size:14px;line-height:1.62;color:#F2F2F2;padding:2px 0;overflow:hidden;display:block}
.cpanel-desc::placeholder{color:#6A6A70}
.cpanel-desc:focus{outline:none}
.cpanel-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
.cpanel-foot .btn{height:42px;min-width:106px;padding:0 18px}
.chip-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 6px 0 4px;border-radius:9px;background:rgba(255,255,255,.09);font-size:12.5px;color:#EDEDF0}
.chip-thumb{width:44px;height:28px;border-radius:6px;object-fit:cover;box-shadow:0 0 0 1.5px #0A84FF;display:block;background:#111}
.chip .x{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;color:#B9B9BF}
.chip .x:hover{background:rgba(255,255,255,.14);color:#fff}
.sel-hint{position:absolute;left:50%;top:50%;bottom:auto;transform:translate(-50%,-50%);height:36px;padding:0 16px;border-radius:10px;background:rgba(24,24,26,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#EDEDF0;font-size:12.5px;letter-spacing:.01em;display:flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:0 8px 22px rgba(0,0,0,.35)}
.menu-item{height:58px}
.mi-main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
.mi-label{font-size:14px;line-height:1.2}
.mi-sub{font-size:11.5px;color:var(--faint);line-height:1.2}


/* ============================================================
   v3：结果无外框 / 内联 chip 输入 / 工具条贴文字
   ============================================================ */
.result-node{padding-top:62px;display:flex;align-items:flex-start;gap:12px;position:relative;animation:nodeIn .17s cubic-bezier(.2,.8,.3,1) both}
.result-node>.result-bar{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:40}
.result-stage-wrap{position:relative;flex:0 0 auto;border-radius:10px}
.result-node .layers{position:relative;flex:0 0 196px;width:196px;background:rgba(28,28,30,.95);-webkit-backdrop-filter:blur(28px);backdrop-filter:blur(28px);box-shadow:var(--shadow);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.result-loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;border-radius:10px;background:#0A0A0B;overflow:hidden;min-height:0;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.result-loading.panning{cursor:grabbing}
.result-loading .ld-canvas{position:absolute;left:0;top:0;transform-origin:0 0;background-repeat:no-repeat;background-size:100% 100%;pointer-events:none;will-change:transform}
#text-bar{position:fixed;left:0;top:0;z-index:72;transform:none;max-width:none}
.result-head{display:none}

/* 内联 chip 输入（@ 提及样式） */
.cpanel-input-wrap{position:relative;min-height:76px;cursor:text}
.cpanel-input{width:100%;min-height:76px;max-height:200px;overflow:auto;font-size:14px;line-height:1.7;color:#F2F2F2;padding:0;outline:none;white-space:pre-wrap;word-break:break-word;word-break:break-word}
.cpanel-input:focus{outline:none}
.cpanel-input .chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 2px 0 3px;margin:2px 7px 2px 0;border-radius:9px;background:rgba(255,255,255,.10);vertical-align:middle;user-select:none;-webkit-user-modify:read-only}
.cpanel-input .chip .chip-thumb{width:44px;height:28px;flex:0 0 44px;border-radius:5px;object-fit:cover;box-shadow:0 0 0 1.5px #0A84FF;display:block;background:#111}
.cpanel-input .chip .chip-label{font-size:13px;color:#EDEDF0;white-space:nowrap;line-height:1}
.cpanel-input .chip .x{width:22px;height:22px;display:grid;place-items:center;border-radius:6px;color:#B9B9BF;flex:0 0 22px}
.cpanel-input .chip .x:hover{background:rgba(255,255,255,.14);color:#fff}
.cpanel-ph{position:absolute;left:0;top:0;color:#6A6A70;font-size:14px;line-height:1.7;pointer-events:none}
.chip-preview{position:fixed;z-index:130;width:200px;border-radius:12px;background:rgba(24,24,26,.98);box-shadow:var(--shadow);padding:8px;display:none;flex-direction:column;gap:6px}
.chip-preview.open{display:flex}
.chip-preview img{width:184px;height:112px;object-fit:contain;border-radius:8px;display:block;background:#101012;box-shadow:0 0 0 1.5px #0A84FF}
.chip-preview .cp-meta{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.chip-preview::after{content:"";position:absolute;top:0;right:-12px;width:12px;height:100%}


/* ============================================================
   v4：居中结果工具条 / 保存后的图片节点 / 图片查看器
   ============================================================ */
#source-node.result-open > #node-tools{display:none}
#result-bar{position:fixed;left:0;top:0;z-index:71;transform:none;max-width:none;pointer-events:none}
#result-bar .bar-btn{pointer-events:auto}
#result-bar .rb-info{pointer-events:none}
@media (max-width:1340px){
  #result-bar .bar-btn .ic{display:none}
  #result-bar .bar-btn{padding:0 10px}
}
.saved-node{padding-top:62px;animation:nodeIn .17s cubic-bezier(.2,.8,.3,1) both}
.saved-node .node-card{width:100%;height:100%}
.saved-node .node-card img{display:block;width:100%;height:100%;border-radius:12px;cursor:zoom-in;object-fit:contain;background:#131315}
.saved-node .node-hint{margin-top:10px;text-align:center;display:block;color:var(--faint);font-size:11.5px}
.img-viewer{position:fixed;inset:0;z-index:140;background:rgba(4,4,6,.76);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:28px}
.img-viewer.open{display:flex}
.img-viewer img{max-width:min(90vw,900px);max-height:76vh;border-radius:10px;box-shadow:var(--shadow);background:#111;display:block}
.img-viewer .iv-bar{display:flex;gap:10px}

@media (max-width:1340px){
  .layers{width:258px;flex-basis:258px}
  .view-result{gap:16px}
}

html.embed #upload-btn, html.embed #status-btn, html.embed #node-tools, html.embed #split-menu, html.embed #api-pop{display:none!important}
html.embed #main{padding-top:0}
html.embed .topbar{background:transparent;border-bottom:0}
html.inline .topbar{display:none!important}
html.inline .main{padding:0!important;min-height:0}
html.inline .workspace{max-width:100vw}
html.inline #source-node.inline-hidden{display:none!important}
html.inline #app{height:100vh}
/* inline（嵌在宿主节点里）：宿主画布是唯一底色 —— iframe 文档整棵链路真透明，
   不再复刻 canvasBg / 点阵，也不留任何窗口底矩形（2026-11 用户要求彻底去背景） */
html.inline, html.inline body{background:transparent!important;background-image:none!important}
html.inline #app, html.inline .main, html.inline .view, html.inline .workspace,
html.inline #result-body, html.inline #stage, html.inline #artboard{background-color:transparent!important;background-image:none!important;box-shadow:none!important}
html.inline .canvas{background-color:transparent!important;background-image:none!important}
html.inline .canvas::after{display:none!important}

/* 拆分中：loading 不再是整块铺底，只留一颗浮在画布上的玻璃卡片（空舞台完全透出宿主画布）；
   ld-canvas 只铺画板本身（压暗），overscan 在 inline 下 = 1，画板外不露边 */
.ld-card{display:none}
html.inline .result-loading{background-color:transparent!important;background-image:none!important;box-shadow:none!important;border-radius:0}
html.inline .ld-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;display:flex;align-items:center;gap:12px;padding:13px 17px;border-radius:16px;background:rgba(26,26,28,.86);-webkit-backdrop-filter:blur(28px) saturate(1.3);backdrop-filter:blur(28px) saturate(1.3);box-shadow:0 18px 48px rgba(0,0,0,.32),0 4px 14px rgba(0,0,0,.2);color:#EDEDF0;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
html.theme-light.inline .ld-card{background:rgba(255,255,255,.92);color:#1d1d1f;box-shadow:0 18px 48px rgba(0,0,0,.16),0 4px 14px rgba(0,0,0,.08)}
html.inline .ld-card .ld-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:0 0 34px;background:rgba(255,255,255,.09);color:#EDEDF0}
html.theme-light.inline .ld-card .ld-ic{background:rgba(0,0,0,.06);color:#1d1d1f}
html.inline .ld-card .ld-meta{display:flex;flex-direction:column;gap:7px;min-width:136px}
html.inline .ld-card .ld-title{font-size:13px;letter-spacing:.01em}
html.inline .ld-card .ld-sub{font-size:11.5px;color:#9A9A9E}
html.theme-light.inline .ld-card .ld-sub{color:#6e6e73}
html.inline .ld-card .ld-progress{position:relative;width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,.13);overflow:hidden}
html.theme-light.inline .ld-card .ld-progress{background:rgba(0,0,0,.08)}
html.inline .ld-card .ld-progress i{position:absolute;top:0;bottom:0;left:0;width:44%;border-radius:2px;background:var(--accent);animation:ldIndet 1.45s cubic-bezier(.2,.8,.3,1) infinite}
@keyframes ldIndet{0%{transform:translateX(-110%)}100%{transform:translateX(330%)}}
@media (prefers-reduced-motion:reduce){html.inline .ld-card .ld-progress i{animation:none;transform:translateX(60%)}}

/* 结果工具条：inline 下整条非按钮背景都是窗口拖动把手 */
#result-bar .rb-grip{width:10px;height:16px;flex:0 0 10px;opacity:.5;background-image:radial-gradient(currentColor 1px,transparent 1.2px);background-size:5px 5px;background-position:1px 1px;pointer-events:none}
html.inline #result-bar{pointer-events:auto;cursor:grab;flex-wrap:wrap;height:auto;min-height:50px;max-width:calc(100vw - 20px);row-gap:4px}
html.inline .layers-head{cursor:grab}
html.win-dragging,html.win-dragging *{cursor:grabbing!important;user-select:none!important;-webkit-user-select:none!important}
@media (max-width:820px){
  html.inline #result-bar{gap:6px;padding:5px 8px}
  html.inline #result-bar .rb-info{display:none}
  html.inline #result-bar .bar-btn{font-size:11.5px;padding:0 7px}
  html.inline #result-bar .rb-zoom{height:30px}
  html.inline #result-bar .rb-zoom button{height:26px}
}

<body>

<div id="app">
  <header class="topbar">
    <div class="brand"><b>BEAT</b><span class="sep">·</span><span>智能画布</span></div>
    <div class="topbar-right">
      <button class="status" id="status-btn" data-testid="sl-status" title="后端连接设置">
        <span class="dot checking" id="status-dot"></span><span id="status-text">检测中</span>
      </button>
      <button class="ghost-btn" id="upload-btn" data-testid="sl-upload"><span data-icon="upload"></span><span>上传图片</span></button>
      <input type="file" id="file-input" accept="image/*" style="display:none">
    </div>
  </header>


  <main class="main" id="main">
    <div class="canvas"></div>

    <div class="workspace" id="workspace">
      <!-- ============ 源图片节点 ============ -->
      <section class="node-shell source-node" id="source-node" data-testid="sl-source-node">
        <div class="node-tools glass" id="node-tools">
          <button class="tool" data-tool="crop"><span data-icon="crop"></span><span class="lbl">裁剪</span></button>
          <button class="tool" data-tool="doodle"><span data-icon="brush"></span><span class="lbl">涂鸦</span></button>
          <button class="tool" data-tool="angle"><span data-icon="rotate"></span><span class="lbl">多角度</span></button>
          <button class="tool" data-tool="inpaint"><span data-icon="mask"></span><span class="lbl">局部重绘</span></button>
          <button class="tool" data-tool="relight"><span data-icon="sun"></span><span class="lbl">重打光</span></button>
          <button class="tool" data-tool="color"><span data-icon="palette"></span><span class="lbl">调色</span></button>
          <button class="tool" data-tool="lossless"><span data-icon="wand2"></span><span class="lbl">无损改图</span></button>
          <button class="tool" data-tool="more"><span data-icon="more"></span><span class="lbl">更多</span></button>
          <div class="split-wrap">
            <button class="btn-split" id="split-btn" data-testid="sl-split-btn" aria-haspopup="menu" aria-expanded="false">
              <span data-icon="layers"></span><span>拆分图层</span>
            </button>
            <div class="split-menu off" id="split-menu" data-testid="sl-split-menu" role="menu">
              <button class="menu-item" id="auto-btn" data-testid="sl-auto" role="menuitem">
                <span class="mi-ic" data-icon="wand"></span>
                <span class="mi-main"><span class="mi-label">自动拆分</span><span class="mi-sub">一步识别所有图层</span></span>
              </button>
              <button class="menu-item" id="custom-btn" data-testid="sl-custom" role="menuitem">
                <span class="mi-ic" data-icon="pencil"></span>
                <span class="mi-main"><span class="mi-label">自定义拆分</span><span class="mi-sub">框选范围，描述要拆的内容</span></span>
              </button>
            </div>
          </div>
        </div>

        <div class="node-card" id="node-card">
          <div class="node-media" id="node-media">
            <img id="node-img" alt="">
            <div class="sel-layer off" id="sel-layer">
              <div class="sel-rect off" id="sel-rect"><span class="sel-label" id="sel-label">0 × 0</span></div>
              <div class="sel-hint" id="sel-hint-text">框选你想拆分的区域 · Esc 取消</div>
            </div>
          </div>
        </div>
        <div class="node-hint" id="node-hint">请从画布中的图片节点打开</div>

        <!-- 自定义拆分面板（贴着源图右侧） -->
        <div class="cpanel off" id="custom-panel" data-testid="sl-custom-panel">
          <div class="cpanel-inner" data-testid="sl-modal">
            <div class="cpanel-head">
              <div class="cpanel-title">拆分图层</div>
              <button class="ghost-btn" id="modal-frame" data-testid="sl-modal-frame"><span data-icon="frame"></span><span>框选内容</span></button>
            </div>
            <div class="cpanel-input-wrap" id="cpanel-input-wrap">
              <div class="cpanel-input" id="modal-desc" data-testid="sl-modal-desc" contenteditable="true" role="textbox" aria-multiline="true" spellcheck="false"></div>
              <div class="cpanel-ph" id="cpanel-ph">描述想要拆分的内容</div>
            </div>
            <div class="cpanel-foot">
              <button class="btn btn-ghost" id="modal-cancel" data-testid="sl-modal-cancel">取消</button>
              <button class="btn btn-primary" id="modal-submit" data-testid="sl-modal-submit" disabled>拆分</button>
            </div>
          </div>
        </div>
      </section>

      <!-- ============ 结果节点由 JS 在拆分时创建 ============ -->
    </div>
  </main>
</div>

<!-- ================= api settings ================= -->
<div class="popover" id="api-pop" data-testid="sl-api-popover">
  <div class="pop-title">后端连接</div>
  <div class="pop-desc">拆分由本地后端提供。默认 <b>http://127.0.0.1:8788</b>；未连接时无法拆分。</div>
  <div class="pop-row">
    <label class="field"><input id="api-base" data-testid="sl-api-base" spellcheck="false" placeholder="http://127.0.0.1:8788"></label>
  </div>
  <div class="pop-row">
    <button class="pop-btn primary" id="api-test" data-testid="sl-api-test">测试连接</button>
    <button class="pop-btn" id="api-save">保存</button>
  </div>
  <div class="pop-hint" id="api-state">尚未检测</div>
</div>

<div class="chip-preview" id="chip-preview" data-testid="sl-chip-preview"></div>
<div class="img-viewer" id="img-viewer">
  <img id="iv-img" alt="拆分图">
  <div class="iv-bar"><button class="btn btn-primary" id="iv-download">下载 PNG</button><button class="btn btn-ghost" id="iv-close">关闭</button></div>
</div>
<div id="overlay-root"></div>
<div class="toasts" id="toasts"></div>

/* ============================================================
   3. 画布绘制（后端 draw 图层 / 缩略图）
   ============================================================ */
var DESIGN = { w:1080, h:1350 };

function rrect(ctx,x,y,w,h,r){
  var rr = Math.min(r||0, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+rr,y);
  ctx.arcTo(x+w,y,x+w,y+h,rr);
  ctx.arcTo(x+w,y+h,x,y+h,rr);
  ctx.arcTo(x,y+h,x,y,rr);
  ctx.arcTo(x,y,x+w,y,rr);
  ctx.closePath();
}
function drawShape(ctx,l,scale){
  var s = scale||1, d = l.draw;
  if(!d) return;
  ctx.save();
  if(d.kind==='rect'){
    ctx.fillStyle = d.fill || '#000';
    if(d.r){ rrect(ctx,d.x*s,d.y*s,d.w*s,d.h*s,d.r*s); ctx.fill(); }
    else ctx.fillRect(d.x*s,d.y*s,d.w*s,d.h*s);
  } else if(d.kind==='pill'){
    rrect(ctx,d.x*s,d.y*s,d.w*s,d.h*s,(d.r==null?d.h/2:d.r)*s);
    if(d.fill){ ctx.fillStyle=d.fill; ctx.fill(); }
    if(d.stroke){ ctx.strokeStyle=d.stroke; ctx.lineWidth=(d.sw||1.5)*s; ctx.stroke(); }
  }
  ctx.restore();
}
function drawText(ctx,l,scale){
  var s = scale||1, st = l.style||{}, b = l.bbox;
  var fs = (st.fontSize||48)*s;
  var raw = String(l.text==null?'':l.text);
  if(st.transformCase==='upper') raw = raw.toUpperCase();
  else if(st.transformCase==='lower') raw = raw.toLowerCase();
  ctx.save();
  ctx.font = (st.italic?'italic ':'')+normWeight(st.fontWeight)+' '+fs+'px '+fontStackCanvas(st.fontFamily);
  ctx.textBaseline='top';
  ctx.textAlign = st.align==='center'?'center':st.align==='right'?'right':'left';
  if('letterSpacing' in ctx) ctx.letterSpacing = ((st.letterSpacing||0)*s)+'px';
  var lh = (st.lineHeight||1.15)*fs;
  var x = (st.align==='center'? b.x+b.w/2 : st.align==='right'? b.x+b.w : b.x)*s;
  var sw = (+st.strokeWidth||0)*s;
  if(sw>0 && st.strokeColor){ ctx.strokeStyle = rgba(st.strokeColor, st.strokeAlpha==null?1:st.strokeAlpha); ctx.lineWidth = sw*2; ctx.lineJoin='round'; }
  ctx.fillStyle = rgba(st.color||'#FFFFFF', st.colorAlpha==null?1:st.colorAlpha);
  raw.split('\n').forEach(function(line,i){
    var y = b.y*s + i*lh;
    if(sw>0 && st.strokeColor) ctx.strokeText(line,x,y);
    ctx.fillText(line,x,y);
  });
  ctx.restore();
}
function ensureImagePng(l){
  if(l.png) return l.png;
  if(!l.draw) return null;
  var c = document.createElement('canvas'); c.width = DESIGN.w; c.height = DESIGN.h;
  drawShape(c.getContext('2d'), l, 1);
  l.png = c.toDataURL('image/png');
  return l.png;
}
function layerThumbSrc(l){
  if(l.type==='text') return null;
  if(l.draw && typeof drawShape==='function') return drawThumb(l);
  if(l.thumb && /^(https?:|data:)/.test(l.thumb)) return l.thumb;
  if(l.png && /^(https?:|data:)/.test(l.png)) return l.png;
  return null;
}
function drawThumb(l){
  if(l._thumb) return l._thumb;
  var pad = 6;
  var c = document.createElement('canvas'); c.width = 160; c.height = 200;
  var ctx = c.getContext('2d');
  var b = l.bbox || {x:0,y:0,w:DESIGN.w,h:DESIGN.h};
  var s = Math.min((160-pad*2)/b.w, (200-pad*2)/b.h);
  ctx.translate(80-(b.x+b.w/2)*s, 100-(b.y+b.h/2)*s);
  drawShape(ctx, l, s);
  l._thumb = c.toDataURL('image/png');
  return l._thumb;
}

/* 窗口拖动：编辑器只把 pointerdown 的屏幕坐标交给宿主，宿主铺全屏 overlay 接管后续指针；
   这里只负责光标状态，宿主收尾时回 win-drag-end（收不到时 20s 兜底复位） */
var winDrag=null;
function beginWinDrag(e){
  if(!INLINE || !EMBED || e.button!==0 || winDrag) return;
  winDrag={ sx:e.clientX, sy:e.clientY };
  document.documentElement.classList.add('win-dragging');
  embedPost('win-drag-start',{ x:e.clientX, y:e.clientY });
  clearTimeout(beginWinDrag._t);
  beginWinDrag._t=setTimeout(endWinDrag,20000);
}
function endWinDrag(){
  if(!winDrag) return;
  winDrag=null;
  clearTimeout(beginWinDrag._t);
  document.documentElement.classList.remove('win-dragging');
}
/* 工具条 / loading 卡片 / 图层栏标题：非按钮的背景都能拖窗口 */
function bindWinDrag(el){
  if(!el || !INLINE) return;
  el.addEventListener('pointerdown',function(e){
    if(e.button!==0 || winDrag) return;
    if(e.target.closest('button,input,textarea,select,[contenteditable="true"]')) return;
    e.preventDefault();
    e.stopPropagation();
    beginWinDrag(e);
  });
}
state.inlineHideSource=false;
function inlineSetSourceHidden(hide){
  state.inlineHideSource=!!hide;
  var sn=$('#source-node');
  if(sn) sn.classList.toggle('inline-hidden',state.inlineHideSource);
  layoutWorkspace();

function embedAbsUrl(u){
  if(!u) return u;
  if(/^(data:|blob:|https?:)/.test(u)) return u;
  var base=String(state.backend.base||'').replace(/\/+$/,'');
  return base+(u.charAt(0)==='/'?'':'/')+u;
}
function apiURL(path){ return String(state.backend.base||'').replace(/\/+$/,'')+path; }
function apiFetch(path,opts,timeout){
  var ctrl=new AbortController();
  var timer=setTimeout(function(){ ctrl.abort(); }, timeout||3000);
  var o=Object.assign({}, opts||{}, {signal:ctrl.signal});
  return fetch(apiURL(path),o).then(function(r){ clearTimeout(timer); return r; }, function(e){ clearTimeout(timer); throw e; });
}
function setStatus(s,text){
  $('#status-dot').className='dot '+s;
  $('#status-text').textContent=text||(s==='online'?'已连接':s==='offline'?'未连接':'检测中');
}
function checkHealth(){
  setStatus('checking','检测中');
  var t0=Date.now();
  return apiFetch('/health',{headers:{'Accept':'application/json'},cache:'no-store'},2000).then(function(res){
    if(!res.ok) throw new Error('HTTP '+res.status);
    return res.json();
  }).then(function(j){
    state.backend.state='online';
    state.backend.engine=j.engine||'engine';
    state.backend.version=j.version||'';
    state.backend.checkedAt=Date.now();
    setStatus('online','已连接（'+state.backend.engine+'）');
    var eb=$('#engine-badge'); if(eb) eb.textContent=state.backend.engine;
    var ap=$('#api-state');
    if(ap) ap.textContent='已连接 · '+state.backend.engine+' · v'+(state.backend.version||'-')+' · '+(Date.now()-t0)+'ms · tesseract:'+(j.tesseract?'是':'否');
    return true;
  }).catch(function(){
    state.backend.state='offline';
    state.backend.checkedAt=Date.now();
    setStatus('offline','未连接');
    $('#api-state').textContent='未连接 · 自动拆分需要先启动本地拆分后端';
    return false;
  });
}
function loadImage(src){ return new Promise(function(res,rej){ var im=new Image(); im.onload=function(){ res(im); }; im.onerror=function(){ rej(new Error('图片解码失败')); }; im.src=src; }); }
function compressDataURL(url,maxEdge){
  return loadImage(url).then(function(img){
    var w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
    if(Math.max(w,h)<=maxEdge) return {dataURL:url,w:w,h:h};
    var s=maxEdge/Math.max(w,h);
    var c=document.createElement('canvas');
    c.width=Math.round(w*s); c.height=Math.round(h*s);
    var ctx=c.getContext('2d'); ctx.drawImage(img,0,0,c.width,c.height);
    return {dataURL:c.toDataURL('image/png'),w:c.width,h:c.height};
  });
}
function postSplit(mode,prompt,selection){
  return compressDataURL(state.image.dataURL,2000).then(function(packed){
    var body={ image:packed.dataURL, mode:mode, maxLayers: mode==='custom'?24:16 };
    if(prompt) body.prompt=prompt;
    if(selection) body.selection={x:Math.round(selection.x),y:Math.round(selection.y),w:Math.round(selection.w),h:Math.round(selection.h)};
    return apiFetch(state.backend.splitPath||'/api/split',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(body)},120000);
  }).then(function(res){
    return res.json().catch(function(){
      var e=new Error('后端响应不是 JSON'); e.apiError=true; throw e;
    }).then(function(j){
      if(!res.ok || j.ok===false){
        var m=(j&&j.error&&j.error.message)||('HTTP '+res.status);
        var e=new Error(m); e.apiError=true; throw e;
      }
      if(!Array.isArray(j.layers)||!j.layers.length){
        var e2=new Error('后端未返回图层'); e2.apiError=true; throw e2;
      }
      return j;
    });
  });
}

/* ============================================================
   7. 工作区布局（源节点 + 结果节点）
   ============================================================ */
function imageRatio(){ return (state.image.w||1080)/(state.image.h||1350); }

function layoutWorkspace(){
  var main=$('#main');
  if(!main) return;
  var W=main.clientWidth, H=main.clientHeight;
  var hasRes=!!state.resultNode && !state.hideResult;
  var hasSecond=hasRes || (!!state.savedNode && !state.hideResult);
  var ratio=imageRatio()||0.8;
  var maxMediaH=Math.max(180, H-62-30-26);
  var desired=hasSecond? Math.min(360, Math.max(280, W*0.24)) : Math.min(560, Math.max(360, W*0.42));
  var sourceW=Math.round(Math.min(desired, maxMediaH*ratio));
  sourceW=Math.max(240, sourceW);
  if(INLINE && state.inlineHideSource) sourceW=0;
  var media=$('#node-media');
  if(media){
    media.style.width=sourceW+'px';
    media.style.height=Math.round(sourceW/ratio)+'px';
  }
  if(hasRes) layoutResultCard(W,H,sourceW);
  else if(state.savedNode && !state.hideResult) layoutSavedCard(W,H,sourceW);
  if(state.customOpen) positionCustomPanel();
}
var RESULT_MIN_ZOOM=0.1, RESULT_MAX_ZOOM=4;
function layoutResultCard(W,H,sourceW){
  var b=state.board||{w:1080,h:1350};
  var railW=196, innerGap=12, railVisible=!state.viewLayersHidden;
  var availW=Math.max(360, W-48-sourceW-36);
  var stageMaxW=Math.max(180, availW-(railVisible? railW+innerGap : 0));
  /* inline 的 .view 上下还有 18px 内边距（H 是 main 高度）：扣掉再减节点顶部 62，最小窗口下画板才不会顶出底边 */
  var stageMaxH=Math.max(160, H-62-(INLINE?40:16));
  /* 视口默认按画板高度做「适应」；宽度只留一点余量，避免画板两侧出现大片空白 */
  var fit=Math.min(stageMaxW/b.w, stageMaxH/b.h);
  fit=Math.max(0.04, fit);
  var vw=Math.min(stageMaxW, Math.max(240, Math.round(b.w*fit*1.12)));
  var vh=stageMaxH;
  var stage=$('#stage'), ab=$('#artboard');
  if(stage){ stage.style.width=vw+'px'; stage.style.height=vh+'px'; }
  if(ab){ ab.style.width=b.w+'px'; ab.style.height=b.h+'px'; }
  var wrap=$('#result-body');
  if(wrap){ wrap.style.width=vw+'px'; wrap.style.height=vh+'px'; }
  var lp=$('#layer-panel');
  if(lp){ lp.style.height=vh+'px'; lp.classList.toggle('off', !railVisible); }
  var v=state.view;
  if(v){
    v.vw=vw; v.vh=vh;
    if(v.fitPending){ v.fitPending=false; fitResultView(); }
    else { clampResultPan(v); applyResultView(); }
  }
  positionResultBar();
}
function fitResultView(){
  var v=state.view, b=state.board||{w:1080,h:1350};
  if(!v || !v.vw || !v.vh) return;
  var fit=Math.min(v.vw/b.w, v.vh/b.h);
  v.fit=clamp(fit, RESULT_MIN_ZOOM, RESULT_MAX_ZOOM);
  v.scale=v.fit;
  v.tx=(v.vw-b.w*v.scale)/2;
  v.ty=(v.vh-b.h*v.scale)/2;
  state.ldOverscan=loadingOverscan();
  applyResultView();
}
function clampResultPan(v){
  var b=state.board||{w:1080,h:1350};
  var bw=b.w*v.scale, bh=b.h*v.scale;
  var padX=Math.min(160, v.vw*0.25), padY=Math.min(160, v.vh*0.25);
  v.tx=clamp(v.tx, Math.min(0, v.vw-bw)-padX, Math.max(0, v.vw-bw)+padX);
  v.ty=clamp(v.ty, Math.min(0, v.vh-bh)-padY, Math.max(0, v.vh-bh)+padY);
}
function applyResultView(){
  var v=state.view;
  if(!v) return;
  var ab=$('#artboard'), pan=$('#stage-pan');
  if(ab) ab.style.zoom=String(v.scale);
  if(pan) pan.style.transform='translate('+round(v.tx,2)+'px,'+round(v.ty,2)+'px)';
  syncLoadingView();
  updateZoomLabel();
  if(state.selectedId){
    updateTextFrame();
    positionTextBar();
    if(state.panel) positionTextPanel(PANELS[state.panel]);
  }
}
function loadingOverscan(){
  /* inline 页整块真透明：loading 只铺画板本身，铺一圈 overscan 会在画板外露出图片边 */
  if(INLINE) return 1;
  var v=state.view, b=state.board||{w:1080,h:1350};
  if(!v || !v.scale || !v.vw || !v.vh) return 1.3;
  /* 画面比视口大一圈：拖动/缩放时加载层边缘不露出生硬空白 */
  var cover=Math.max(v.vw/(b.w*v.scale), v.vh/(b.h*v.scale));
  return clamp(cover*1.3, 1.15, 1.6);
}
function syncLoadingView(){
  var ld=$('#result-loading'), cv=$('#ld-canvas'), v=state.view, b=state.board;
  if(!ld || !cv || !v || !b || ld.classList.contains('off')) return;
  var os=state.ldOverscan||1;
  if(cv._os!==os){
    cv._os=os;
    cv.style.width=round(b.w*os,2)+'px';
    cv.style.height=round(b.h*os,2)+'px';
  }
  /* 超大画面居中于画板：偏移必须乘 scale，随缩放一起走 */
  var ox=b.w*v.scale*(os-1)/2, oy=b.h*v.scale*(os-1)/2;
  cv.style.transform='translate('+round(v.tx-ox,2)+'px,'+round(v.ty-oy,2)+'px) scale('+v.scale+')';
}
function updateZoomLabel(){
  var el=$('#zoom-pct');
  if(!el || !state.view) return;
  var pct=Math.round(state.view.scale*100);
  el.textContent=pct+'%';
  el.title='当前缩放 '+pct+'% · 点击适应窗口';
}
function zoomResultBy(factor, cx, cy){
  var v=state.view, st=$('#stage');
  if(!v || !st || !v.vw) return;
  var ns=clamp(v.scale*factor, RESULT_MIN_ZOOM, RESULT_MAX_ZOOM);
  if(Math.abs(ns-v.scale)<0.0001) return;
  var r=st.getBoundingClientRect();
  var px=(cx==null? r.width/2 : cx-r.left);
  var py=(cy==null? r.height/2 : cy-r.top);
  var ux=(px-v.tx)/v.scale, uy=(py-v.ty)/v.scale;
  v.scale=ns;
  v.tx=px-ux*ns; v.ty=py-uy*ns;
  v.fitPending=false;
  clampResultPan(v);
  applyResultView();
}
function startResultPan(e){
  var v=state.view, st=$('#stage');
  if(!v || !st) return;
  var ld=$('#result-loading');
  var d={ sx:e.clientX, sy:e.clientY, tx0:v.tx, ty0:v.ty, moved:false };
  state.panDrag=d;
  st.classList.add('panning');
  if(ld) ld.classList.add('panning');
  function mv(ev){
    var dx=ev.clientX-d.sx, dy=ev.clientY-d.sy;
    if(!d.moved && Math.abs(dx)<2 && Math.abs(dy)<2) return;
    d.moved=true;
    v.tx=d.tx0+dx; v.ty=d.ty0+dy;
    v.fitPending=false;
    clampResultPan(v);
    applyResultView();
  }
  function end(){
    st.classList.remove('panning');
    if(ld) ld.classList.remove('panning');
    state.panDrag=null;
    window.removeEventListener('pointermove',mv);
    window.removeEventListener('pointerup',end);
    window.removeEventListener('pointercancel',end);
  }
  window.addEventListener('pointermove',mv);
  window.addEventListener('pointerup',end);
  window.addEventListener('pointercancel',end);
}
function onResultWheel(e){
  if(state.editingId) return;
  var v=state.view;
  if(!v || !v.vw) return;
  e.preventDefault();
  var dy=e.deltaY;
  if(e.deltaMode===1) dy*=16;
  else if(e.deltaMode===2) dy*=100;
  var k=Math.exp(-dy*(e.ctrlKey?0.01:0.0018));
  zoomResultBy(k, e.clientX, e.clientY);
}
var resultBarRaf=0;
function queueResultBarPosition(){
  if(!state.resultNode) return;
  if(resultBarRaf) cancelAnimationFrame(resultBarRaf);
  resultBarRaf=requestAnimationFrame(function(){ resultBarRaf=0; positionResultBar(); });
}
function positionResultBar(){
  var bar=$('#result-bar');
  if(!bar || bar.classList.contains('off')) return;
  var st=$('#stage');
  if(!st) return;
  var r=st.getBoundingClientRect();
  var bw=bar.offsetWidth||600, bh=bar.offsetHeight||50;
  var left=clamp(r.left+r.width/2-bw/2, 10, Math.max(10,innerWidth-bw-10));
  var top=r.top-8-bh;
  var place='above';
  if(top<10){
    top=Math.max(10, r.bottom+8); place='below';
    /* 窗口最小高度时下方也放不下：贴到窗口顶部，宁可压住画板一点也不能被 iframe 裁掉 */
    if(INLINE && top+bh>innerHeight-8){ top=8; place='top'; }
  }
  bar.style.left=Math.round(left)+'px';
  bar.style.top=Math.round(top)+'px';
  bar.dataset.place=place;
}
function layoutSavedCard(W,H,sourceW){
  var s=state.savedNode;
  if(!s) return;
  var availW=Math.max(300, W-48-sourceW-36);
  var maxH=Math.max(240, H-62-34);
  var k=Math.min(availW/s.w, maxH/s.h);
  var w=Math.round(s.w*k), h=Math.round(s.h*k);
  var card=$('#saved-node .node-card');
  if(card){ card.style.width=w+'px'; card.style.height=h+'px'; }
}
function layoutAll(){
  layoutWorkspace();
  if(state.customOpen) positionCustomPanel();
  if(state.resultNode){ positionResultBar(); queueResultBarPosition(); }
  if(state.selectedId){ positionTextBar(); if(state.panel) positionTextPanel(PANELS[state.panel]); }
}

function ensureResultNode(){
  var old=$('#result-node');
  if(old && state.resultNode) return old;
  if(old && old.parentNode) old.parentNode.removeChild(old);
  var n=document.createElement('section');
  n.className='node-shell result-node appear';
  n.id='result-node';
  n.setAttribute('data-testid','sl-result-node');
  n.innerHTML=RESULT_NODE_HTML;
  $('#workspace').appendChild(n);
  state.resultNode=true;
  var srcEl=$('#source-node');
  if(srcEl) srcEl.classList.add('result-open');
  /* 结果工具条 / 文字工具栏都放到 body 层（fixed），避免被节点的动画/transform 捕获 */
  var tb=n.querySelector('#text-bar');
  var rb=n.querySelector('#result-bar');
  if(rb) $('#overlay-root').appendChild(rb);
  if(tb) $('#overlay-root').appendChild(tb);
  if(tb){
    tb.querySelectorAll('[data-panel-btn]').forEach(function(btn){
      btn.addEventListener('click',function(e){ e.stopPropagation(); openPanel(btn.dataset.panelBtn,btn); });
    });
    var tbd=tb.querySelector('#tb-download');
    if(tbd) tbd.addEventListener('click',function(){ var l=currentTextLayer(); if(l) downloadLayer(l); });
  }
  var frameEl=$('#text-frame',n);
  if(frameEl){
    /* 图片层：选中框本身是拖动把手（框内拖拽不会被画板平移吞掉） */
    frameEl.addEventListener('pointerdown',function(e){
      if(e.button!==0) return;
      var sel=getLayer(state.selectedId);
      if(!sel || sel.type==='text') return;
      e.stopPropagation(); e.preventDefault();
      startImageDrag(sel.id,e);
    });
    frameEl.querySelectorAll('.tf-h').forEach(function(h){
      h.addEventListener('pointerdown',function(e){
        e.stopPropagation(); e.preventDefault();
        if(!state.selectedId) return;
        var selLayer=getLayer(state.selectedId);
        if(selLayer && selLayer.type!=='text') startImageResize(selLayer.id,h.dataset.corner,e);
        else startTextResize(state.selectedId,h.dataset.corner,e);
      });
    });
  }
  hydrateIcons(n);
  hydrateIcons(tb);
  hydrateIcons(rb);
  bindResultNode(n);
  layoutWorkspace();
  return n;
}
function bindResultNode(n){
  $('#panel-download-all',n).addEventListener('click',downloadAll);
  var sb=$('#save-btn'); if(sb) sb.addEventListener('click',saveAsImageNode);
  var eb=$('#export-psd'); if(eb) eb.addEventListener('click',exportPsd);
  var ab=$('#add-text'); if(ab) ab.addEventListener('click',addTextLayer);
  var sa=$('#split-again'); if(sa) sa.addEventListener('click',function(){
    var ls=state.lastSplit||{ mode:'auto', prompt:'', selection:null };
    startSplit(ls.mode,ls.prompt,ls.selection);
  });
  var bb=$('#back-btn'); if(bb) bb.addEventListener('click',function(){ embedPost('close'); closeResult(); });
  var zo=$('#zoom-out'); if(zo) zo.addEventListener('click',function(){ zoomResultBy(1/1.25); });
  var zi=$('#zoom-in'); if(zi) zi.addEventListener('click',function(){ zoomResultBy(1.25); });
  var zp=$('#zoom-pct'); if(zp) zp.addEventListener('click',function(){ fitResultView(); });
  var zf=$('#zoom-fit'); if(zf) zf.addEventListener('click',function(){ fitResultView(); });
  $('#show-orig',n).addEventListener('change',function(){
    state.showOrig=this.checked;
    var bg=$('#artboard .orig-bg');
    if(bg) bg.style.display=state.showOrig?'block':'none';
  });
  /* 窗口拖动把手：结果工具条（非按钮背景）、loading 玻璃卡片、图层栏标题 */
  bindWinDrag($('#result-bar'));
  bindWinDrag($('#ld-card'));
  bindWinDrag($('.layers-head',n));
  var stageEl=$('#stage',n);
  stageEl.addEventListener('wheel',onResultWheel,{passive:false});
  stageEl.addEventListener('dblclick',function(e){
    if(e.target.closest('.lyr-text') || e.target.closest('.lyr-img')) return;
    fitResultView();
  });
  stageEl.addEventListener('pointerdown',function(e){
    if(e.target.closest('.lyr-text') || e.target.closest('.lyr-img')) return;
    if(e.button!==0 || state.splitting) return;
    /* 先看点没点到某个图层：点中就选中并直接拖，不再要求先去右侧列表选 */
    var hit=hitLayerAt(e.clientX,e.clientY);
    if(hit){
      e.preventDefault();
      selectPlainLayer(hit.id);
      startImageDrag(hit.id,e);
      return;
    }
    exitTextEdit();
    deselectText();
    startResultPan(e);
  });
  /* 拆分加载层覆盖 stage：把拖动/滚轮转发给同一套平移缩放，避免等待期间不能移动视图 */
  var loadingEl=$('#result-loading',n);
  if(loadingEl){
    loadingEl.setAttribute('draggable','false');
    loadingEl.addEventListener('wheel',onResultWheel,{passive:false});
    loadingEl.addEventListener('pointerdown',function(e){
      if(e.button!==0) return;
      e.preventDefault();
      startResultPan(e);
    });
  }
}
function closeResult(silent){
  if(!state.resultNode && !$('#result-node')) return;
  deselectText(true);
  closePanel();
  var n=$('#result-node');
  state.resultNode=false;
  state.view.fitPending=true; state.viewLayersHidden=false;
  state.layers=[]; state.selectedId=null; state.lastSplit=null; state.showOrig=false;
  var tbEl=$('#text-bar');
  if(tbEl && tbEl.parentNode) tbEl.parentNode.removeChild(tbEl);
  var rbEl=$('#result-bar');
  if(rbEl && rbEl.parentNode) rbEl.parentNode.removeChild(rbEl);
  var srcEl=$('#source-node');
  if(srcEl) srcEl.classList.remove('result-open');
  if(n){
    n.classList.add('closing');
    setTimeout(function(){ if(n.parentNode) n.parentNode.removeChild(n); },170);
  }
  layoutWorkspace();
  if(!silent) toast('已关闭拆分结果','',1500);
}

function hideResultLoading(keepLayers){
  var ld=$('#result-loading'); if(ld) ld.classList.add('off');

function startSplit(mode,prompt,selection){
  if(state.splitting) return;
  if(!state.image.dataURL){ toast('请先从画布中的图片节点打开','err'); return; }
  state.splitting=true;
  removeSavedNode();
  closeMenu(); closeCustomPanel(true);
  deselectText(true);
  state.pendingMode=mode;
  state.lastSplit={ mode:mode, prompt:prompt||'', selection:selection||null };
  showResultLoading();
  var t0=Date.now();
  var p = state.backend.state==='online' ? postSplit(mode,prompt,selection).catch(function(e){ return {__err:e}; }) : Promise.resolve({__err:null});
  p.then(function(res){
    var err=null, payload=null;
    if(res && res.__err){ err=res.__err; }
    else if(res && Array.isArray(res.layers)){ payload=res; }
    var minDelay=1500 + Math.random()*500;
    var wait=Math.max(0, minDelay-(Date.now()-t0));
    return sleep(wait).then(function(){
      if(payload){
        enterResult(mode,payload,true);
        toast('拆分完成 · '+payload.layers.length+' 图层');
      } else {
        var msg = (err && err.apiError) ? err.message : '后端不可用，无法拆分';
        if(err && !err.apiError){ state.backend.state='offline'; setStatus('offline','未连接'); }
        hideResultLoading(true);
        var rc=$('#result-count'); if(rc) rc.textContent='· 0 图层';
        toast(err && err.apiError ? ('拆分失败：'+err.message) : '后端不可用，无法拆分','err',4200);
        embedPost('error',{message:msg});
        if(!state.layers.length) setTimeout(function(){ closeResult(true); },1600);
      }
      state.splitting=false;
    });
  });
}
