function normalizeLayer(l,i,board){
  var type=l.type==='text'?'text':'image';
  var bb=l.bbox||null;
  var bbox;
  if(bb && isFinite(bb.x) && isFinite(bb.w)){
    bbox={ x:+bb.x||0, y:+bb.y||0, w:+bb.w||board.w, h:+bb.h||board.h };
  } else {
    bbox = type==='text'
      ? { x:Math.round(board.w*.1), y:Math.round(board.h*.4), w:Math.round(board.w*.8), h:Math.round(Math.max(24,board.h*.08)) }
      : { x:0,y:0,w:board.w,h:board.h };
  }
  var st=l.style||{};
  var out={
    id: l.id||('L'+(i+1)),
    name: l.name || (type==='text'? (l.text||'文字层') : ('图层 '+(i+1))),
    type: type, role: l.role||'', z:(typeof l.z==='number'? l.z : i*10),
    bbox: bbox,
    png: embedAbsUrl(l.png||null), thumb: embedAbsUrl(l.thumb||l.png||null),
    visible: l.visible!==false,
    draw: l.draw||null
  };
  if(type==='text'){
    out.text=(l.text==null || l.text==='')? (l.name||'文字') : String(l.text);
    out.style={
      color: hexOf(st.color)||'#FFFFFF',
      colorAlpha: st.color!=null? alphaOf(st.color):1,
      strokeColor: st.strokeColor? (hexOf(st.strokeColor)||null):null,
      strokeAlpha: st.strokeColor? alphaOf(st.strokeColor):1,
      strokeWidth: +st.strokeWidth||0,
      strokeAlign: st.strokeAlign||'center',
      fontFamily: st.fontFamily||'Archivo',
      fontWeight: normWeight(st.fontWeight||400),
      italic: !!st.italic,
      fontSize: Math.round(+st.fontSize || Math.max(12, bbox.h*.8)),
      letterSpacing: +(st.letterSpacing||0),
      lineHeight: +(st.lineHeight||1.15),
      align: (st.align==='center'||st.align==='right')? st.align:'left',
      underline: !!st.underline, strike: !!st.strike,
      transformCase: st.transformCase||'original',
      scaleX: +st.scaleX||100, scaleY: +st.scaleY||100,
      opacity: st.opacity==null?1:+st.opacity
    };
  }
  return out;
}
function enterResult(mode,payload,remote){
  ensureResultNode();
  state.view.fitPending=true;
  state.mode=mode;
  state.engine=payload.engine||'local';
  state.board={ w:payload.width||state.image.w, h:payload.height||state.image.h };
  var board=state.board;
  state.layers=(payload.layers||[]).map(function(l,i){ return normalizeLayer(l,i,board); });
  state.selectedId=null;
  state.showOrig=false;
  var so=$('#show-orig'); if(so) so.checked=state.showOrig;
  var eb=$('#engine-badge'); if(eb) eb.textContent=state.engine;
  var rt=$('#rb-title'); if(rt) rt.textContent='AI 拆分完成';
  var rs=$('#rb-sub'); if(rs) rs.textContent='· '+state.layers.length+' 图层';
  queueResultBarPosition();
  var rc=$('#result-count'); if(rc) rc.textContent='· '+state.layers.length+' 图层';
  hideResultLoading();
  var tb=$('#text-bar'); if(tb) tb.classList.add('off');
  renderStage();
  renderLayerList();
  if(!state.localFonts.length) loadFontsFromBackend(true);
  layoutWorkspace();
  if(INLINE) inlineSetSourceHidden(true);
  if(payload.warnings && payload.warnings.length) toast('后端提示：'+payload.warnings[0],'warn',3400);
  if(remote) setStatus('online','已连接（'+state.engine+'）');
}

/* ============================================================
   11. 画板渲染
   ============================================================ */
function applyTextStyle(el,l){
  var s=l.style;
  el.style.color=colorCss(s.color,s.colorAlpha);
  el.style.fontFamily=fontStack(s.fontFamily);
  el.style.fontWeight=String(normWeight(s.fontWeight));
  el.style.fontStyle=s.italic?'italic':'normal';
  el.style.fontSize=(s.fontSize||48)+'px';
  el.style.lineHeight=String(s.lineHeight||1.15);
  el.style.letterSpacing=(s.letterSpacing||0)+'px';
  el.style.textAlign=s.align||'left';
  el.style.textTransform=s.transformCase==='upper'?'uppercase':s.transformCase==='lower'?'lowercase':'none';
  el.style.textDecoration=(s.underline&&s.strike)?'underline line-through':s.underline?'underline':s.strike?'line-through':'none';
  el.style.opacity=String(s.opacity==null?1:s.opacity);
  if(+s.strokeWidth>0 && s.strokeColor){
    el.style.webkitTextStroke=(+s.strokeWidth)+'px '+colorCss(s.strokeColor,s.strokeAlpha);
    el.style.paintOrder='stroke fill';
  } else {
    el.style.webkitTextStroke='0px transparent';
  }
  var sx=(+s.scaleX||100)/100, sy=(+s.scaleY||100)/100;
  el.style.transformOrigin='center center';
  el.style.transform=(sx!==1||sy!==1)? 'scale('+sx+','+sy+')' : '';
}
function fitTextLayer(l){
  var el=$('#artboard .lyr-text[data-layer-id="'+l.id+'"]');
  if(!el) return;
  var t=el.querySelector('.txt');
  if(!t) return;
  /* 非缩放场景（改字/换字体）回到按墨迹自适应 */
  el.style.width=''; el.style.height='';
  t.style.width='';
  var w=t.offsetWidth, h=t.offsetHeight;
  if(!w || !h) return;
  var st=l.style||{};
  var sx=(+st.scaleX||100)/100, sy=(+st.scaleY||100)/100;
  var vw=w*sx, vh=h*sy;
  var b=l.bbox||{x:0,y:0,w:state.board.w,h:state.board.h};
  var a=st.align||'left';
  var visualLeft = a==='center' ? (b.x+b.w/2-vw/2) : a==='right' ? (b.x+b.w-vw) : b.x;
  var visualTop = b.y;
  var PAD=14;
  if(visualLeft<0) visualLeft=0;
  if(visualLeft+vw>state.board.w) visualLeft=Math.max(0,state.board.w-PAD-vw);
  if(visualTop<0) visualTop=0;
  if(visualTop+vh>state.board.h) visualTop=Math.max(0,state.board.h-PAD-vh);
  el.style.left=(visualLeft+(vw-w)/2)+'px';
  el.style.top=(visualTop+(vh-h)/2)+'px';
  el.dataset.fitW=String(Math.round(vw));
  el.dataset.fitH=String(Math.round(vh));
  var art=boardScreenRect();
  var sc=art? art.scale : 1;
  el.classList.toggle('tiny', (vw*sc)<14 || (vh*sc)<14);
  if(state.selectedId===l.id) updateTextFrame();
}
function refitAllText(){
  state.layers.forEach(function(l){ if(l.type==='text') fitTextLayer(l); });
}
function buildLayerEl(l){
  var el=document.createElement('div');
  el.className='lyr '+(l.type==='text'?'lyr-text':'lyr-img');
  el.dataset.layerId=l.id;
  var fullCanvas = l.type!=='text';
  var box = fullCanvas ? layerBox(l) : null;
  el.style.left = (fullCanvas? box.x : l.bbox.x)+'px';
  el.style.top = (fullCanvas? box.y : l.bbox.y)+'px';
  if(fullCanvas){
    el.style.width = Math.max(1,box.w)+'px';
    el.style.height = Math.max(1,box.h)+'px';
  }
  el.style.zIndex=String(10+(l.z||0));
  if(l.visible===false) el.style.display='none';
  if(l.type==='text'){
    el.setAttribute('data-testid','sl-text-layer');
    var t=document.createElement('div');
    t.className='txt';
    t.setAttribute('contenteditable','false');
    t.setAttribute('spellcheck','false');
    t.textContent=l.text;
    applyTextStyle(t,l);
    if(state.editingId===l.id) el.classList.add('editing');
    t.addEventListener('focus',function(){ if(state.selectedId!==l.id) selectText(l.id,false); });
    t.addEventListener('keydown',function(e){
      e.stopPropagation();
      if(e.key==='Escape'){ e.preventDefault(); exitTextEdit(); return; }
      if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){ e.preventDefault(); exitTextEdit(); }
    });
    t.addEventListener('input',function(){
      l.text=t.textContent;
      var nm=t.textContent.trim().replace(/\s+/g,' ').slice(0,26)||'文字层';
      l.name=nm; updateRowName(l);
      fitTextLayer(l);
      if(state.selectedId===l.id){
        positionTextBar();
        if(state.panel) positionTextPanel(PANELS[state.panel]);
      }
    });
    el.appendChild(t);
    ['tl','tr','bl','br'].forEach(function(pos){
      var hd=document.createElement('i');
      hd.className='handle '+pos;
      hd.dataset.corner=pos;
      hd.addEventListener('pointerdown',function(e){ e.stopPropagation(); e.preventDefault(); startTextResize(l.id,pos,e); });
      el.appendChild(hd);
    });
    el.addEventListener('pointerdown',function(e){
      if(e.target && e.target.classList && e.target.classList.contains('handle')) return;
      e.stopPropagation();
      if(e.button!==0) return;
      if(state.editingId===l.id) return;
      selectText(l.id,false);
      startTextDrag(l.id,e);
    });
    el.addEventListener('dblclick',function(e){
      if(e.target && e.target.classList && e.target.classList.contains('handle')) return;
      e.stopPropagation();
      enterTextEdit(l.id,e);
    });
    if(state.selectedId===l.id) el.classList.add('sel');
    if(state.editingId===l.id){ el.classList.add('sel','editing'); }
  } else {
    var img=document.createElement('img');
    img.alt=l.name; img.draggable=false;
    var src=l.png||ensureImagePng(l);
    if(src) img.src=src; else el.style.display='none';
    img.addEventListener('error',function(){ el.style.display='none'; });
    img.addEventListener('load',function(){
      /* 非整画布 PNG（旧 draw 图层）：坐标系按它自己的 bbox 算，保持旧视觉 */
      if(Math.abs(img.naturalWidth-state.board.w)>2 || Math.abs(img.naturalHeight-state.board.h)>2){
        l._nonFull=true;
        applyImageBox(l);
        if(state.selectedId===l.id) updateTextFrame();
      }
    });
    el.appendChild(img);
    el.style.pointerEvents='none';
    el.title=l.name;
    if(state.selectedId===l.id) el.classList.add('sel');
  }
  return el;
}

/* 图片层视觉变换：tf 是画板坐标系里的「内容框」（默认 = 原 bbox）。
   渲染 / 合成 / PSD / 下载都从 tf 推出整画布 PNG 的摆放（layerBox），四处共用同一套几何。 */
function layerTf(l){
  if(l.tf) return l.tf;
  var bb=l.bbox||{ x:0, y:0, w:state.board.w, h:state.board.h };
  l.tf={ x:bb.x, y:bb.y, w:bb.w, h:bb.h };
  return l.tf;
}
/* tf（内容框）→ 整画布 PNG 元素的屏幕几何；默认 tf=bbox 时就是原样铺满画板 */
function layerBox(l){
  var tf=layerTf(l);
  var bb=l.bbox||{ x:0, y:0, w:state.board.w, h:state.board.h };
  var sx=tf.w/Math.max(1,bb.w), sy=tf.h/Math.max(1,bb.h);
  /* 统一保留 3 位小数：DOM 的样式字符串和 canvas 的绘制矩形必须完全同值，
     否则缩放后的重采样会有亚像素差，合成图和画布会差一条边 */
  if(l._nonFull){
    /* 旧 draw 图层：元素坐标系是它自己的 bbox，不是整张画板 */
    return { x:round(bb.x+(tf.x-bb.x)*sx,3), y:round(bb.y+(tf.y-bb.y)*sy,3), w:round(bb.w*sx,3), h:round(bb.h*sy,3), sx:sx, sy:sy };
  }
  return { x:round(tf.x-bb.x*sx,3), y:round(tf.y-bb.y*sy,3), w:round(state.board.w*sx,3), h:round(state.board.h*sy,3), sx:sx, sy:sy };
}
function applyImageBox(l){
  var el=$('#artboard .lyr-img[data-layer-id="'+l.id+'"]');
  if(!el) return;
  var box=layerBox(l);
  el.style.left=box.x+'px'; el.style.top=box.y+'px';
  el.style.width=Math.max(1,box.w)+'px'; el.style.height=Math.max(1,box.h)+'px';
}
function clampImageTf(tf,mode){
  var b=state.board||{w:1,h:1};
  var w=Math.max(8,tf.w), h=Math.max(8,tf.h);
  var x=tf.x, y=tf.y;
  if(mode==='img-resize'){ x=Math.max(0,x); y=Math.max(0,y); }
  else { x=clamp(x,0,Math.max(0,b.w-w)); y=clamp(y,0,Math.max(0,b.h-h)); }
  return { x:round(x,2), y:round(y,2), w:round(w,2), h:round(h,2) };
}
/* 图片层元素始终不吃指针：交互只发生在选中框上，透明区域不会挡住文字层 / 画板手势 */
function syncLayerInteractivity(){
  $$('#artboard .lyr-img').forEach(function(el){
    el.style.pointerEvents='none';
    el.classList.toggle('sel', state.selectedId===el.dataset.layerId);
  });
}
/* ---------- 画布点选：按 PNG 的 alpha 命中，点哪层就选哪层 ---------- */
function layerAlphaMap(l){
  if(l._alphaMap) return l._alphaMap;
  var img=$('#artboard .lyr-img[data-layer-id="'+l.id+'"] img');
  if(!img || !img.naturalWidth) return null;
  var maxW=400, s=Math.min(1, maxW/Math.max(1,img.naturalWidth));
  var w=Math.max(1,Math.round(img.naturalWidth*s)), h=Math.max(1,Math.round(img.naturalHeight*s));
  var c=document.createElement('canvas'); c.width=w; c.height=h;
  var ctx=c.getContext('2d'); if(!ctx) return null;
  ctx.drawImage(img,0,0,w,h);
  var data;
  try{ data=ctx.getImageData(0,0,w,h).data; }catch(e){ return null; }
  l._alphaMap={w:w,h:h,data:data};
  return l._alphaMap;
}
function hitLayerAt(clientX,clientY){
  var art=boardScreenRect(); if(!art) return null;
  var bx=(clientX-art.left)/art.scale, by=(clientY-art.top)/art.scale;
  if(bx<0 || by<0 || bx>state.board.w || by>state.board.h) return null;
  var list=state.layers.filter(function(l){ return l.type!=='text' && l.visible!==false && l.role!=='background'; });
  list.sort(function(a,b){ return (b.z||0)-(a.z||0); });
  for(var i=0;i<list.length;i++){
    var l=list[i], map=layerAlphaMap(l); if(!map) continue;
    var box=layerBox(l);
    var px=(bx-box.x)/Math.max(1,box.w)*map.w;
    var py=(by-box.y)/Math.max(1,box.h)*map.h;
    if(px<0 || py<0 || px>=map.w || py>=map.h) continue;
    var a=map.data[(Math.floor(py)*map.w+Math.floor(px))*4+3];
    if(a>24) return l;
  }
  return null;
}
function nudgeSelectedLayer(dx,dy){
  var l=getLayer(state.selectedId);
  if(!l || l.type==='text') return false;
  var tf=layerTf(l);
  var next=clampImageTf({x:tf.x+dx,y:tf.y+dy,w:tf.w,h:tf.h},'img-move');
  if(next.x===tf.x && next.y===tf.y) return false;
  l.tf=next;
  applyImageBox(l);
  updateTextFrame();
  return true;
}
function renderStage(){
  var ab=$('#artboard');
  if(!ab) return;
  ab.innerHTML='';
  ab.style.width=state.board.w+'px';
  ab.style.height=state.board.h+'px';
  if(state.image.dataURL){
    var bg=document.createElement('img');
    bg.className='orig-bg'; bg.src=state.image.dataURL; bg.alt='';
    bg.style.display=state.showOrig?'block':'none';
    ab.appendChild(bg);
  }
  state.layers.slice().sort(function(a,b){ return (a.z||0)-(b.z||0); }).forEach(function(l){
    ab.appendChild(buildLayerEl(l));
    if(l.type==='text') fitTextLayer(l);
  });
  syncLayerInteractivity();
  updateTextFrame();
}

/* ============================================================
   12. 图层面板
   ============================================================ */
function updateRowName(l){
  var row=$('#layer-list .layer-row[data-layer-id="'+l.id+'"]');
  if(!row) return;
  var n=row.querySelector('.layer-name'); if(n) n.textContent=l.name;

  if(th && l.type==='text'){ th.textContent=(l.text||'文').trim().charAt(0)||'文'; th.style.color=colorCss(l.style.color,l.style.colorAlpha); }
}
function renderLayerList(){

    } else {

    }

      else selectPlainLayer(l.id);
    });

  });
}
function toggleLayerVisible(l){
  l.visible=l.visible===false;
  var el=$('#artboard .lyr[data-layer-id="'+l.id+'"]');
  if(el) el.style.display=l.visible?'':'none';
  if(state.selectedId===l.id){
    var fr=$('#text-frame'), tb=$('#text-bar'), isText=l.type==='text';
    if(!l.visible){
      /* 隐藏当前选中层：框和文字工具条一起收起（保持选中，重新显示可恢复） */
      if(fr) fr.classList.remove('on');
      if(tb) tb.classList.add('off');
      closePanel();
    } else if(isText){
      if(tb) tb.classList.remove('off');
      updateTextFrame();
      positionTextBar();
    } else {
      /* 图片层：不显示文字工具条，只恢复选框 */
      if(tb) tb.classList.add('off');
      updateTextFrame();
    }
  }
  renderLayerList();
}
function selectPlainLayer(id){
  var l=getLayer(id);
  if(!l) return;
  if(l.type==='text'){ selectText(id,false); return; }
  exitTextEdit();
  state.selectedId=id;
  $$('#artboard .lyr').forEach(function(el){ el.classList.toggle('sel', el.dataset.layerId===id); });
  $('#text-bar').classList.add('off');
  $('#result-bar').classList.remove('off');
  queueResultBarPosition();
  closePanel();
  renderLayerList();
  syncLayerInteractivity();
  updateTextFrame();
}

/* ============================================================
   13. 文字层选择与工具栏

function selectText(id,focusCaret){

function syncToolbarLabels(){
  var l=currentTextLayer();

  }

}
function syncTextToolbar(){
  syncToolbarLabels();

}
function refreshSelectedText(){
  var l=currentTextLayer();
  if(!l) return;
  var el=$('#artboard .lyr-text[data-layer-id="'+l.id+'"] .txt');
  if(el) applyTextStyle(el,l);
  fitTextLayer(l);
  updateRowName(l);
  syncToolbarLabels();
  positionTextBar();
  if(state.panel) positionTextPanel(PANELS[state.panel]);
}
function textBoxRect(){
  var f=$('#text-frame');
  if(f && f.classList.contains('on')) return f.getBoundingClientRect();
  var el=$('#artboard .lyr-text.sel');
  return el? el.getBoundingClientRect() : null;
}
function positionTextBar(){
  var bar=$('#text-bar');
  if(!bar || bar.classList.contains('off')) return;
  updateTextFrame();
  var r=textBoxRect(); if(!r) return;
  var bw=bar.offsetWidth||560, bh=bar.offsetHeight||52;
  var left=clamp(r.left+r.width/2-bw/2, 10, innerWidth-bw-10);
  var top=r.top-bh-9, place='above';
  if(top<10){ top=r.bottom+9; place='below'; }
  if(top+bh>innerHeight-10) top=Math.max(10, innerHeight-bh-10);
  bar.style.left=Math.round(left)+'px';
  bar.style.top=Math.round(top)+'px';
  bar.dataset.place=place;
}
function positionTextPanel(el){
  var r=textBoxRect();
  if(!r){ positionPanel(el,state.panelAnchor); return; }
  /* 每次先恢复自然高度再量，避免上一次的限制累积 */
  el.style.maxHeight='';
  el.style.overflow='';
  var pw=el.offsetWidth, ph=el.offsetHeight;
  var GAP=8, MARGIN=10;
  var bar=$('#text-bar');
  var barVisible=bar && !bar.classList.contains('off');
  var br=barVisible? bar.getBoundingClientRect() : null;
  var barAbove=br && br.bottom<=r.top+6;
  var aboveText=Math.floor(r.top-GAP-MARGIN);            // 文字 top 以上的全部空间（可能盖住工具栏）
  var aboveBar=barAbove? Math.floor(br.top-GAP-MARGIN) : -1; // 工具栏 top 以上的空间
  var belowTop=Math.ceil(r.bottom+GAP);
  var belowAvail=Math.floor(innerHeight-MARGIN-belowTop);
  var left=clamp(r.left+r.width/2-pw/2, 10, Math.max(10,innerWidth-pw-10));
  var limit, top, place;
  function fit(maxH){ if(ph>maxH){ el.style.maxHeight=Math.max(60,maxH)+'px'; el.style.overflow='auto'; return Math.max(60,maxH); } return ph; }
  if(barAbove && aboveBar>=150){
    /* 首选：放在工具栏上方（不挡工具栏，方便继续切面板），空间不够就收缩滚动 */
    limit=aboveBar;
    var h=fit(limit);
    top=br.top-GAP-h; place='above-bar';
  } else if(aboveText>=180 || aboveText>=ph){
    /* 次选：放在文字上方（可能盖住工具栏，但绝不盖文字） */
    limit=aboveText;
    var h2=fit(limit);
    top=r.top-GAP-h2; place='above';
  } else if(belowAvail>aboveText){
    /* 上方实在太矮（<180）：翻到文字下方，同样收缩滚动 */
    limit=belowAvail;
    var h3=fit(limit);
    top=belowTop; place='below';
  } else {
    limit=Math.max(80,aboveText);
    var h4=fit(limit);
    top=Math.max(MARGIN, r.top-GAP-h4); place='above';
  }
  var finalH=Math.min(ph, limit);
  if(place==='below'){
    if(top+finalH>innerHeight-MARGIN) top=Math.max(MARGIN, innerHeight-MARGIN-finalH);
  } else {
    /* 硬保证：面板底边不超过文字 top-8 */
    if(top+finalH>r.top-GAP){
      var cap=Math.max(60, Math.floor(r.top-GAP-MARGIN));
      el.style.maxHeight=cap+'px'; el.style.overflow='auto';
      finalH=Math.min(finalH, cap);
      top=r.top-GAP-finalH;
    }
    if(top<MARGIN) top=MARGIN;
  }
  el.style.left=Math.round(left)+'px';
  el.style.top=Math.round(top)+'px';
  el.dataset.place=place;
}

function uniqSorted(arr){
  var out=[];
  arr.forEach(function(v){ if(out.every(function(u){ return Math.abs(u-v)>0.6; })) out.push(v); });
  return out;
}
function inkBox(l){
  var el=$('#artboard .lyr-text[data-layer-id="'+l.id+'"]');
  if(!el) return null;
  var t=el.querySelector('.txt');
  if(!t) return null;
  var ab=$('#artboard');
  if(!ab) return null;
  var abr=ab.getBoundingClientRect();
  var board=state.board||{w:1080,h:1350};
  var sc=(abr.width/board.w)||1;
  var cs=getComputedStyle(t);
  var fs=parseFloat(cs.fontSize)||48;
  var lh=parseFloat(cs.lineHeight)||fs*1.15;
  var ls=parseFloat(cs.letterSpacing)||0;
  var font=(cs.fontStyle||'normal')+' '+(cs.fontWeight||'400')+' '+fs+'px '+cs.fontFamily;
  var mc=document.createElement('canvas').getContext('2d');
  mc.font=font;
  if('letterSpacing' in mc) mc.letterSpacing=ls+'px';
  /* 多行：contenteditable 里 Enter 可能生成 <div>/<br>，textContent 不带换行；
     用 innerText 取按行分隔的文本，再逐行 measureText */
  var raw=(typeof t.innerText==='string' && t.innerText.length)? t.innerText : (t.textContent==null? '' : String(t.textContent));
  var lines=raw.split(/\r?\n/);
  while(lines.length>1 && lines[lines.length-1]==='') lines.pop();
  if(!lines.length) lines=[''];
  var maxW=0;
  lines.forEach(function(line){ maxW=Math.max(maxW, mc.measureText(line).width); });
  /* 行盒并集只用来定位（对齐锚点 / 上下边界），宽度改用 measureText 的墨迹宽 */
  var rg=document.createRange();
  rg.selectNodeContents(t);
  var rects=rg.getClientRects();
  var x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(var i=0;i<rects.length;i++){
    var r=rects[i];
    if(!r.width && !r.height) continue;
    x0=Math.min(x0,r.left); y0=Math.min(y0,r.top);
    x1=Math.max(x1,r.right); y1=Math.max(y1,r.bottom);
  }
  if(!isFinite(x0)) return null;
  var align=l.style.align||'left';
  var inkWpx=maxW*sc;
  var leftPx = align==='center'? ((x0+x1)/2 - inkWpx/2) : (align==='right'? (x1-inkWpx) : x0);
  var mid=Math.max(0,(lh-fs)/2);
  return { x:(leftPx-abr.left)/sc, y:(y0-abr.top)/sc+mid, w:maxW, h:Math.max(2,(y1-y0)/sc-mid*2) };
}
function updateTextFrame(){
  var f=$('#text-frame'), st=$('#stage');
  if(!f || !st){ return; }
  /* 图片层：选框 = 它的视觉变换框 tf（与文字层同一套蓝框 + 四角手柄） */
  var sel=getLayer(state.selectedId);
  if(sel && sel.type!=='text'){

    var tf=layerTf(sel);

    var bb=state.board||{w:1,h:1}, sci=(abi.width/bb.w)||1, padI=1.5;
    f.style.left=Math.round(abi.left-sri.left+tf.x*sci-padI)+'px';
    f.style.top=Math.round(abi.top-sri.top+tf.y*sci-padI)+'px';
    f.style.width=Math.max(4,Math.round(tf.w*sci+padI*2))+'px';
    f.style.height=Math.max(4,Math.round(tf.h*sci+padI*2))+'px';
    f.classList.add('on','imgsel');
    return;
  }
  f.classList.remove('imgsel');
  var l=currentTextLayer();
  if(!l){
    var el0=$('#artboard .lyr-text.sel');
    f.classList.remove('on');
    return;
  }
  var el=$('#artboard .lyr-text[data-layer-id="'+l.id+'"]');
  if(!el || el.style.display==='none'){ f.classList.remove('on'); return; }
  var box=inkBox(l);
  if(!box){ f.classList.remove('on'); return; }
  var ab=$('#artboard').getBoundingClientRect(), sr=st.getBoundingClientRect();
  var b=state.board, sc=(ab.width/b.w)||1;
  var pad=1.5;
  f.style.left=Math.round(ab.left-sr.left+box.x*sc-pad)+'px';
  f.style.top=Math.round(ab.top-sr.top+box.y*sc-pad)+'px';
  f.style.width=Math.max(4,Math.round(box.w*sc+pad*2))+'px';
  f.style.height=Math.max(4,Math.round(box.h*sc+pad*2))+'px';
  f.classList.add('on');
}
function layerVisualBox(l){
  var el=$('#artboard .lyr-text[data-layer-id="'+l.id+'"]');
  if(!el) return null;
  var s=l.style||{};
  var sx=(+s.scaleX||100)/100, sy=(+s.scaleY||100)/100;
  var bw=el.offsetWidth, bh=el.offsetHeight;
  if(!bw || !bh) return null;
  var x=parseFloat(el.style.left)||0, y=parseFloat(el.style.top)||0;
  var vw=bw*sx, vh=bh*sy;
  return { x:x-(vw-bw)/2, y:y-(vh-bh)/2, w:vw, h:vh };
}
function guideTargets(excludeId){
  var b=state.board||{w:1,h:1};
  var xs=[0, b.w/2, b.w], ys=[0, b.h/2, b.h];
  /* 其它可见文字层也参与对齐（PS 智能参考线）；隐藏层、当前层排除 */
  state.layers.forEach(function(l){
    if(l.type!=='text' || l.visible===false || l.id===excludeId) return;
    var v=inkBox(l);
    if(!v) return;
    xs.push(v.x, v.x+v.w/2, v.x+v.w);
    ys.push(v.y, v.y+v.h/2, v.y+v.h);
  });
  return { x:uniqSorted(xs), y:uniqSorted(ys) };
}
function syncTextBBox(l){
  var el=$('#artboard .lyr-text[data-layer-id="'+l.id+'"]');
  if(!el) return;
  if(!el.querySelector('.txt')) return;
  var s=l.style||{};
  var sx=(+s.scaleX||100)/100, sy=(+s.scaleY||100)/100;
  var bw=el.offsetWidth, bh=el.offsetHeight;
  var vw=bw*sx, vh=bh*sy;
  var vleft=(parseFloat(el.style.left)||0)-(vw-bw)/2;
  var vtop=(parseFloat(el.style.top)||0)-(vh-bh)/2;
  l.bbox={ x:Math.round(vleft), y:Math.round(vtop), w:Math.max(4,Math.round(vw)), h:Math.max(4,Math.round(vh)) };
}
/* 缩放期间：直接按 bbox 写几何，不重排不居中，保证对角严格固定 */
function applyTextBox(l){

function pickSnap(edges,targets,th){
  var best=null;
  edges.forEach(function(edge){
    targets.forEach(function(t){
      var d=t-edge;
      if(Math.abs(d)<=th && (!best || Math.abs(d)<Math.abs(best.d))) best={ d:d, t:t };
    });
  });
  return best;
}
function alignedLines(edges,targets,tol){
  var out=[];
  targets.forEach(function(t){
    if(edges.some(function(e){ return Math.abs(e-t)<=tol; })) out.push(t);
  });
  return out;
}
function showGuides(vx,hy){
  var g=$('#align-guides');

function startTextDrag(id,e){

  syncTextBBox(l);
  var b=l.bbox;

    b0:{ x:b.x, y:b.y, w:b.w, h:b.h },
    fx:(corner.charAt(1)==='l')? b.x+b.w : b.x,
    fy:(corner.charAt(0)==='t')? b.y+b.h : b.y,
    fs0:l.style.fontSize||48, ls0:l.style.letterSpacing||0 };
  window.addEventListener('pointermove',onTextDragMove);
  window.addEventListener('pointerup',onTextDragEnd);

function onTextDragMove(e){
  var d=state.drag;
  if(!d) return;
  var l=getLayer(d.id);
  if(!l) return;
  var b=state.board;
  var art=boardScreenRect();
  if(!art) return;
  var scale=art.scale||1;
  if(d.mode==='move'){
    if(!d.moved){
      if(Math.abs(e.clientX-d.sx)<2 && Math.abs(e.clientY-d.sy)<2) return;
      d.moved=true;
    }
    var w=d.b0.w, h=d.b0.h;
    var nx=d.b0.x+(e.clientX-d.sx)/scale;
    var ny=d.b0.y+(e.clientY-d.sy)/scale;
    nx=clamp(nx,0,Math.max(0,b.w-w));
    ny=clamp(ny,0,Math.max(0,b.h-h));
    var tg=guideTargets(d.id);
    var th=8/scale;
    var sx=pickSnap([nx,nx+w/2,nx+w],tg.x,th);
    var sy=pickSnap([ny,ny+h/2,ny+h],tg.y,th);
    if(sx) nx=clamp(nx+sx.d,0,Math.max(0,b.w-w));
    if(sy) ny=clamp(ny+sy.d,0,Math.max(0,b.h-h));
    l.bbox.x=Math.round(nx*100)/100;
    l.bbox.y=Math.round(ny*100)/100;
    fitTextLayer(l);
    positionTextBar();
    showGuides(alignedLines([l.bbox.x,l.bbox.x+w/2,l.bbox.x+w],tg.x,0.8/scale),
               alignedLines([l.bbox.y,l.bbox.y+h/2,l.bbox.y+h],tg.y,0.8/scale));
    return;
  }
  if(d.mode==='resize'){
    var px=(e.clientX-art.left)/scale, py=(e.clientY-art.top)/scale;
    var tg2=guideTargets(d.id);
    var th2=8/scale;
    var sw=(d.corner.charAt(1)==='l')? (d.fx-px) : (px-d.fx);
    var sh=(d.corner.charAt(0)==='t')? (d.fy-py) : (py-d.fy);
    var kx=sw/Math.max(1,d.b0.w);
    var ky=sh/Math.max(1,d.b0.h);
    var k=Math.max(kx,ky);
    var kMin=8/Math.max(1,d.fs0);
    var maxW=(d.corner.charAt(1)==='l')? d.fx : (b.w-d.fx);
    var maxH=(d.corner.charAt(0)==='t')? d.fy : (b.h-d.fy);
    var kMax=Math.min(maxW/Math.max(1,d.b0.w), maxH/Math.max(1,d.b0.h));
    /* 拖动边吸附：把被拖的那条边精确对齐到最近目标（等比缩放，单一 k） */
    var bestK=null;
    var ex=(d.corner.charAt(1)==='l')? (d.fx-d.b0.w*k) : (d.fx+d.b0.w*k);
    tg2.x.forEach(function(t){
      var dd=t-ex;
      if(Math.abs(dd)<=th2){
        var kk=(d.corner.charAt(1)==='l')? ((d.fx-t)/Math.max(1,d.b0.w)) : ((t-d.fx)/Math.max(1,d.b0.w));
        if(kk>0 && (!bestK || Math.abs(dd)<Math.abs(bestK.d))) bestK={ k:kk, d:dd };
      }
    });
    var ey=(d.corner.charAt(0)==='t')? (d.fy-d.b0.h*k) : (d.fy+d.b0.h*k);
    tg2.y.forEach(function(t){
      var dd=t-ey;
      if(Math.abs(dd)<=th2){
        var kk=(d.corner.charAt(0)==='t')? ((d.fy-t)/Math.max(1,d.b0.h)) : ((t-d.fy)/Math.max(1,d.b0.h));
        if(kk>0 && (!bestK || Math.abs(dd)<Math.abs(bestK.d))) bestK={ k:kk, d:dd };
      }
    });
    if(bestK) k=bestK.k;
    k=clamp(k, kMin, Math.max(kMin,kMax));
    var nw=Math.max(8,Math.round(d.b0.w*k*100)/100), nh=Math.max(6,Math.round(d.b0.h*k*100)/100);
    var nx2=(d.corner.charAt(1)==='l')? Math.round((d.fx-nw)*100)/100 : d.fx;
    var ny2=(d.corner.charAt(0)==='t')? Math.round((d.fy-nh)*100)/100 : d.fy;
    l.bbox={ x:nx2, y:ny2, w:nw, h:nh };
    l.style.fontSize=Math.max(8,Math.round(d.fs0*k*100)/100);
    l.style.letterSpacing=Math.round((d.ls0||0)*k*100)/100;
    var el=$('#artboard .lyr-text[data-layer-id="'+d.id+'"]');
    var t=el? el.querySelector('.txt') : null;
    if(t) applyTextStyle(t,l);
    applyTextBox(l);
    syncToolbarLabels();
    positionTextBar();
    if(state.panel) positionTextPanel(PANELS[state.panel]);
    showGuides(alignedLines([l.bbox.x,l.bbox.x+nw/2,l.bbox.x+nw],tg2.x,0.8/scale),
               alignedLines([l.bbox.y,l.bbox.y+nh/2,l.bbox.y+nh],tg2.y,0.8/scale));
  }
}
function onTextDragEnd(){
  var d=state.drag;
  state.drag=null;
  hideGuides();
  window.removeEventListener('pointermove',onTextDragMove);
  window.removeEventListener('pointerup',onTextDragEnd);
  if(d && d.id && state.selectedId===d.id){
    positionTextBar();
    if(state.panel) positionTextPanel(PANELS[state.panel]);
  }
}

function startImageDrag(id,e){
  var l=getLayer(id);

  clearDocSelection(); closePanel(); hideGuides();

  state.drag={ mode:'img-move', id:id, sx:e.clientX, sy:e.clientY, tf0:{x:tf.x,y:tf.y,w:tf.w,h:tf.h}, scale:art.scale, moved:false };
  window.addEventListener('pointermove',onImageDragMove);
  window.addEventListener('pointerup',onImageDragEnd);
  window.addEventListener('pointercancel',onImageDragEnd);
}
function startImageResize(id,corner,e){
  var l=getLayer(id);
  if(!l || l.type==='text') return;
  exitTextEdit(); clearDocSelection(); closePanel(); hideGuides();
  var art=boardScreenRect();
  if(!art) return;
  var tf=layerTf(l);
  state.drag={ mode:'img-resize', id:id, corner:corner, scale:art.scale, tf0:{x:tf.x,y:tf.y,w:tf.w,h:tf.h} };
  window.addEventListener('pointermove',onImageDragMove);
  window.addEventListener('pointerup',onImageDragEnd);
  window.addEventListener('pointercancel',onImageDragEnd);
}
function onImageDragMove(e){
  var d=state.drag;
  if(!d || (d.mode!=='img-move' && d.mode!=='img-resize')) return;
  var l=getLayer(d.id);
  if(!l) return;
  var art=boardScreenRect();
  if(!art) return;
  var sc=art.scale||1;
  var tf=d.tf0, next;
  if(d.mode==='img-move'){
    if(!d.moved){
      if(Math.abs(e.clientX-d.sx)<2 && Math.abs(e.clientY-d.sy)<2) return;
      d.moved=true;
    }
    next={ x:tf.x+(e.clientX-d.sx)/sc, y:tf.y+(e.clientY-d.sy)/sc, w:tf.w, h:tf.h };
  } else {
    var px=(e.clientX-art.left)/sc, py=(e.clientY-art.top)/sc;
    var left=tf.x, top=tf.y, right=tf.x+tf.w, bottom=tf.y+tf.h;
    if(d.corner.indexOf('l')>=0) left=px; else right=px;
    if(d.corner.indexOf('t')>=0) top=py; else bottom=py;
    var w=Math.max(8,right-left), h=Math.max(8,bottom-top);
    if(e.shiftKey){
      var k=Math.max(w/tf.w, h/tf.h);
      w=tf.w*k; h=tf.h*k;
      if(d.corner.indexOf('l')>=0) left=right-w;
      if(d.corner.indexOf('t')>=0) top=bottom-h;
    }
    /* 被拖的那条边限制在画板内，固定角不动 */
    var bd=state.board;
    if(d.corner.indexOf('l')>=0){ left=Math.max(0,left); w=right-left; }
    else { w=Math.min(w, Math.max(8, bd.w-left)); }
    if(d.corner.indexOf('t')>=0){ top=Math.max(0,top); h=bottom-top; }
    else { h=Math.min(h, Math.max(8, bd.h-top)); }
    next={ x:left, y:top, w:w, h:h };
  }
  l.tf=clampImageTf(next,d.mode);
  applyImageBox(l);
  if(state.selectedId===l.id) updateTextFrame();
}
function onImageDragEnd(){
  if(!state.drag) return;
  var d=state.drag;
  state.drag=null;
  window.removeEventListener('pointermove',onImageDragMove);
  window.removeEventListener('pointerup',onImageDragEnd);
  window.removeEventListener('pointercancel',onImageDragEnd);
  if(d && d.id && state.selectedId===d.id) updateTextFrame();
}

document.addEventListener('keydown',function(e){
  var arrow={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
  if(arrow[e.key] && state.selectedId && !state.editingId && !(e.target && e.target.isContentEditable)){
    var step=e.shiftKey?10:1;
    if(nudgeSelectedLayer(arrow[e.key][0]*step, arrow[e.key][1]*step)){ e.preventDefault(); return; }
  }
  if(e.key==='Escape'){
    var iv=$('#img-viewer');
    if(iv && iv.classList.contains('open')){ closeImageViewer(); e.preventDefault(); return; }
    if(state.selecting){ cancelSelection(); e.preventDefault(); return; }
    if(state.panel){ closePanel(); e.preventDefault(); return; }
    if(state.customOpen){ closeCustomPanel(); e.preventDefault(); return; }
    if(state.menuOpen){ closeMenu(); e.preventDefault(); return; }
    if(state.selectedId){ deselectText(); e.preventDefault(); return; }
    if($('#api-pop').classList.contains('open')){ $('#api-pop').classList.remove('open'); return; }
  }
  if(e.key===' ' && e.target && e.target.isContentEditable){ e.stopPropagation(); }
  if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&state.customOpen){ e.preventDefault(); submitCustom(); }
});

var PANELS={}, PANEL_SYNC={};
var ADJ_DEF={
  letterSpacing:{min:-30,max:120,dec:1},
  lineHeight:{min:0.5,max:4,dec:2},
  scaleX:{min:20,max:300,dec:0},
  scaleY:{min:20,max:300,dec:0}
};
function panelShell(name,width,title){
  var el=document.createElement('div');
  el.className='panel';
  el.id='panel-'+name;
  el.setAttribute('data-testid','sl-panel-'+name);
  el.style.width=width+'px';
  var head=document.createElement('div');
  head.className='panel-head';
  var t=document.createElement('div'); t.className='panel-title'; t.textContent=title;
  var x=document.createElement('button'); x.className='panel-x'; x.title='关闭'; x.innerHTML=icon('x');
  x.addEventListener('click',function(){ closePanel(); });
  head.appendChild(t); head.appendChild(x);
  el.appendChild(head);
  $('#overlay-root').appendChild(el);
  PANELS[name]=el;
  return el;
}
function openPanel(name,anchor){
  if(!PANELS[name]) return;
  var wasSame=(state.panel===name);
  closePanel();
  if(wasSame){ return; }
  state.panel=name;
  state.panelAnchor=anchor||null;
  var el=PANELS[name];
  el.style.visibility='hidden';
  el.classList.add('open');
  if(PANEL_SYNC[name]) PANEL_SYNC[name]();
  if(state.selectedId && $('#artboard .lyr-text.sel')) positionTextPanel(el);
  else positionPanel(el,anchor);
  el.style.visibility='';
  if(anchor) anchor.classList.add('on');
}
function closePanel(){
  if(!state.panel) return;
  var el=PANELS[state.panel];
  if(el) el.classList.remove('open');
  $$('[data-panel-btn]').forEach(function(b){ b.classList.remove('on'); });
  state.panel=null;
}
function syncPanel(name){
  if(PANEL_SYNC[name] && PANELS[name] && PANELS[name].classList.contains('open')) PANEL_SYNC[name]();
}
function positionPanel(el,anchor){
  if(!el) return;
  var r=anchor? anchor.getBoundingClientRect() : { left:innerWidth/2, top:110, bottom:110, width:0 };
  var pw=el.offsetWidth, ph=el.offsetHeight;
  var left=r.left + (r.width||0)/2 - pw/2;
  left=clamp(left,10,Math.max(10,innerWidth-pw-10));
  var top=r.bottom+10;
  if(top+ph>innerHeight-10) top=r.top-ph-10;
  top=clamp(top,10,Math.max(10,innerHeight-ph-10));
  el.style.left=Math.round(left)+'px';
  el.style.top=Math.round(top)+'px';
}
function miniSelect(host,options,value,onChange){
  var val=value;
  function render(){
    host.innerHTML='';
    var b=document.createElement('button');
    b.className='mini';
    b.innerHTML='<span class="mv">'+esc(val)+'</span>'+icon('chevronDown','chev');
    b.addEventListener('click',function(e){
      e.stopPropagation();
      var ex=host.querySelector('.mini-menu');
      if(ex){ ex.parentNode.removeChild(ex); return; }
      var m=document.createElement('div');
      m.className='mini-menu';
      options.forEach(function(o){
        var it=document.createElement('button');
        it.textContent=o;
        if(o===val) it.className='on';
        it.addEventListener('click',function(ev){
          ev.stopPropagation();
          val=o;
          render();
          onChange(o);
        });
        m.appendChild(it);
      });
      host.appendChild(m);
    });
    host.appendChild(b);
  }
  render();
  return { set:function(v){ if(v!==val){ val=v; render(); } else { var mv=host.querySelector('.mv'); if(mv) mv.textContent=v; } } };
}

function pickerMarkup(kind){
  return '<div class="picker">'
    + '<div class="sv" data-sv><div class="sv-white"></div><div class="sv-black"></div><div class="sv-dot"></div></div>'
    + '<div class="slider hue" data-hue><span class="thumb"></span></div>'
    + '<div class="slider alpha" data-alpha><div class="alpha-fill"></div><span class="thumb"></span></div>'
    + '<div class="swatches" data-sw></div>'
    + '<div class="fields">'
    +   '<label class="field"><span class="pfx">#</span><input class="hex" maxlength="7" spellcheck="false" value="FFFFFF" data-testid="sl-'+kind+'-hex"></label>'
    +   '<label class="field small"><input class="pct" maxlength="3" value="100" data-testid="sl-'+kind+'-pct"><span class="suffix">%</span></label>'
    + '</div>'
    + '</div>';
}
function dragArea(el,onMove){
  el.addEventListener('pointerdown',function(e){
    e.preventDefault();
    var r=el.getBoundingClientRect();
    function pos(ev){ return { x:clamp((ev.clientX-r.left)/r.width,0,1), y:clamp((ev.clientY-r.top)/r.height,0,1) }; }
    onMove(pos(e));
    function mv(ev){ onMove(pos(ev)); }
    function up(){ el.removeEventListener('pointermove',mv); el.removeEventListener('pointerup',up); el.removeEventListener('pointercancel',up); }
    el.addEventListener('pointermove',mv);
    el.addEventListener('pointerup',up);
    el.addEventListener('pointercancel',up);
  });
}
function initPicker(kind,root,onApply){
  var p=state.picker[kind];
  var sv=$('[data-sv]',root), dot=$('.sv-dot',root);
  var hue=$('[data-hue]',root), hueThumb=$('.thumb',hue);
  var alpha=$('[data-alpha]',root), alphaThumb=$('.thumb',alpha), alphaFill=$('.alpha-fill',root);
  var swWrap=$('[data-sw]',root);
  var hexIn=$('.hex',root), pctIn=$('.pct',root);
  var SWATCHES=[{t:'tr'},{hex:'#000000'},{hex:'#FFFFFF'},{hex:'#00C853'},{hex:'#8B5CF6'},{hex:'#D8C7FF'}];
  SWATCHES.forEach(function(sw){
    var b=document.createElement('button');
    b.className='sw'+(sw.t==='tr'?' transparent':'');
    if(sw.hex){ b.style.background=sw.hex; b.dataset.hex=sw.hex; }
    b.addEventListener('click',function(){
      if(sw.t==='tr'){ p.a=0; }
      else{
        p.a=1;
        var c=hex2rgb(sw.hex), hsv=rgb2hsv(c.r,c.g,c.b);
        p.h=hsv.h; p.s=hsv.s; p.v=hsv.v;
      }
      paint(); syncInputs(); onApply();
    });
    swWrap.appendChild(b);
  });
  function paint(){
    var cur=hsv2hex(p);
    sv.style.background=cur;
    dot.style.left=(p.s*100)+'%';
    dot.style.top=((1-p.v)*100)+'%';
    dot.style.background=cur;
    hueThumb.style.left=(p.h/360*100)+'%';
    alphaThumb.style.left=(p.a*100)+'%';
    alphaFill.style.background='linear-gradient(90deg,'+rgba(cur,0)+','+rgba(cur,1)+')';
    $$('.sw',swWrap).forEach(function(b){
      var h=b.dataset.hex;
      var on = h? (h.toUpperCase()===cur.toUpperCase() && p.a>0.01) : (p.a<=0.01);
      b.classList.toggle('on',on);
    });
  }
  function syncInputs(){
    hexIn.value=hsv2hex(p).replace('#','');
    pctIn.value=String(Math.round(p.a*100));
  }
  dragArea(sv,function(pt){ p.s=pt.x; p.v=1-pt.y; paint(); syncInputs(); onApply(); });
  dragArea(hue,function(pt){ p.h=pt.x*360; paint(); syncInputs(); onApply(); });
  dragArea(alpha,function(pt){ p.a=pt.x; paint(); syncInputs(); onApply(); });
  hexIn.addEventListener('change',function(){
    var h=normHex(hexIn.value);
    if(!h){ syncInputs(); return; }
    var c=hex2rgb(h), hsv=rgb2hsv(c.r,c.g,c.b);
    p.h=hsv.h; p.s=hsv.s; p.v=hsv.v;
    if(p.a<=0.01) p.a=1;
    paint(); syncInputs(); onApply();
  });
  pctIn.addEventListener('change',function(){
    var v=clamp(parseFloat(pctIn.value)||0,0,100);
    p.a=v/100; paint(); syncInputs(); onApply();
  });
  return {
    sync:function(hex,alphaVal){
      var c=hex2rgb(hex||'#FFFFFF');
      if(c){ var hsv=rgb2hsv(c.r,c.g,c.b); p.h=hsv.h; p.s=hsv.s; p.v=hsv.v; }
      p.a=(alphaVal==null?1:alphaVal);
      paint(); syncInputs();
    },
    hex:function(){ return hsv2hex(p); },
    alpha:function(){ return p.a; }
  };
}

function pickFont(name){
  var l=currentTextLayer(); if(!l) return;
  l.style.fontFamily=name;

function renderFontList(){
  var list=$('#font-list'); if(!list) return;
  list.innerHTML='';
  var l=currentTextLayer();
  var cur=l? l.style.fontFamily : '';
  var q=(state.fontQuery||'').trim().toLowerCase();
  var f=state.fontFilter;
  function match(n){ return !q || String(n).toLowerCase().indexOf(q)>=0; }
  function addGroup(label,items){
    var arr=items.filter(function(n){ return match(n); });
    if(!arr.length) return;
    var h=document.createElement('div'); h.className='font-group'; h.textContent=label; list.appendChild(h);
    arr.forEach(function(name){
      var b=document.createElement('button');
      b.className='font-item'+(cur===name?' on':'');
      b.setAttribute('data-font',name);
      var sp=document.createElement('span'); sp.className='fi-name'; sp.textContent=name;
      sp.style.fontFamily=fontStack(name);
      b.appendChild(sp);
      if(cur===name) b.insertAdjacentHTML('beforeend',icon('check'));
      b.addEventListener('click',function(){ pickFont(name); });
      list.appendChild(b);
    });
  }
  if(f==='all' && match('系统默认')) addGroup('默认',['系统默认']);
  if(f==='recent'){
    var recent=state.recentFonts.slice();
    if(!recent.length){ list.innerHTML='<div class="empty-tip">还没有最近使用的字体</div>'; }
    addGroup('最近使用',recent);
  } else if(f==='cn'){
    addGroup('中文字体',GOOGLE_FONTS.filter(function(x){ return x.lang==='cn'; }).map(function(x){ return x.name; }));
  } else if(f==='en'){
    addGroup('英文字体',GOOGLE_FONTS.filter(function(x){ return x.lang==='en'; }).map(function(x){ return x.name; }));
  } else {
    addGroup('推荐字体',GOOGLE_FONTS.map(function(x){ return x.name; }));
  }
  if(f!=='recent'){
    addGroup('本机字体', state.localFonts.length? state.localFonts : LOCAL_FALLBACK_FONTS);
  }
}
function loadFontsFromBackend(silent){
  var path=String(state.backend.splitPath||'/api/split').replace(/\/+$/,'')+'/fonts';
  return apiFetch(path,{headers:{'Accept':'application/json'},cache:'no-store'},10000).then(function(res){
    if(!res.ok) throw new Error('HTTP '+res.status);
    return res.json();
  }).then(function(j){
    if(!j || !Array.isArray(j.fonts) || !j.fonts.length) throw new Error('empty');
    state.localFonts=j.fonts.map(function(f){ return f.family; }).filter(Boolean).slice(0,240);
    state.localFontMeta={};
    renderFontList();
    if(!silent) toast('已读取 '+state.localFonts.length+' 个本机字体');
    return true;
  }).catch(function(){ return false; });
}
function loadLocalFonts(){
  if(!window.queryLocalFonts){
    loadFontsFromBackend().then(function(ok){
      if(ok) return;
      state.localFonts=LOCAL_FALLBACK_FONTS.slice();
      renderFontList();
      toast('未连接到字体索引，已展示常用本机字体','warn',3000);
    });
    return;
  }
  window.queryLocalFonts().then(function(fonts){
    var seen={}, out=[], byFam={};
    (fonts||[]).forEach(function(f){
      if(!f || !f.family) return;
      var w=styleWeight(f.style||'')||400;
      (byFam[f.family]=byFam[f.family]||[]).push({ postscriptName:f.postscriptName||'', style:f.style||'', weight:w, italic:/italic|oblique/i.test(String(f.style||'')) });
      if(!seen[f.family]){ seen[f.family]=1; out.push(f.family); }
    });
    state.localFontMeta=byFam;
    state.localFonts=out.slice(0,80);
    if(!state.localFonts.length){
      state.localFonts=LOCAL_FALLBACK_FONTS.slice();
      toast('未读取到本机字体，已展示常用本机字体','warn',3000);
    } else {
      toast('已读取 '+state.localFonts.length+' 个本机字体');
    }
    renderFontList();
  }).catch(function(){
    loadFontsFromBackend().then(function(ok){
      if(ok) return;
      state.localFonts=LOCAL_FALLBACK_FONTS.slice();
      renderFontList();
      toast('未获授权读取本机字体，已展示常用本机字体','warn',3200);
    });
  });
}

function adjVal(key,v,dec){

  return String(Math.round(v));
}
function adjWrite(key,val){
  var l=currentTextLayer(); if(!l) return;
  var def=ADJ_DEF[key];
  l.style[key]=round(clamp(val,def.min,def.max),def.dec);
  refreshSelectedText();

function adjField(grid,iconName,key,step,unit){
  var d=document.createElement('div');

    + '<div class="aj-body"><button class="step" data-dir="-1" title="减少">−</button>'

    + '<button class="step" data-dir="1" title="增加">+</button></div>';
  grid.appendChild(d);
  var input=$('input',d);
  var l=currentTextLayer();
  input.addEventListener('change',function(){ adjWrite(key, parseFloat(input.value)||0); });
  $$('.step',d).forEach(function(b){
    b.addEventListener('click',function(){
      var cur=currentTextLayer(); if(!cur) return;
      adjWrite(key, (parseFloat(cur.style[key])||0) + step*(+b.dataset.dir));

/* ============================================================
   16. 下载（纯前端 zip · 无 CDN 依赖）
   ============================================================ */
var CRC_TABLE=(function(){
  var t=new Uint32Array(256);
  for(var n=0;n<256;n++){
    var c=n;
    for(var k=0;k<8;k++) c=(c&1)? (0xEDB88320^(c>>>1)) : (c>>>1);
    t[n]=c>>>0;
  }
  return t;
})();
function crc32(u8){
  var c=0xFFFFFFFF;
  for(var i=0;i<u8.length;i++) c=(c>>>8)^CRC_TABLE[(c^u8[i])&0xFF];
  return (c^0xFFFFFFFF)>>>0;
}
function u16a(n){ return [n&255,(n>>>8)&255]; }
function u32a(n){ return [n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255]; }
function makeZip(files){
  var now=new Date();
  var dosTime=((now.getHours()<<11)|(now.getMinutes()<<5)|((now.getSeconds()/2)|0))&0xFFFF;
  var dosDate=(((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate())&0xFFFF;
  var enc=new TextEncoder();
  var parts=[], central=[], offset=0;
  files.forEach(function(f){
    var nb=enc.encode(f.name);
    var data=f.data, crc=crc32(data), len=data.length;
    var lh=new Uint8Array([].concat(
      [0x50,0x4b,0x03,0x04], u16a(20), u16a(0), u16a(0), u16a(dosTime), u16a(dosDate),
      u32a(crc), u32a(len), u32a(len), u16a(nb.length), u16a(0)
    ));
    parts.push(lh, nb, data);
    central.push({ name:nb, crc:crc, len:len, off:offset });
    offset += lh.length + nb.length + len;
  });
  var cdStart=offset, cdParts=[];
  central.forEach(function(c){
    var ch=new Uint8Array([].concat(
      [0x50,0x4b,0x01,0x02], u16a(20), u16a(20), u16a(0), u16a(0), u16a(dosTime), u16a(dosDate),
      u32a(c.crc), u32a(c.len), u32a(c.len), u16a(c.name.length), u16a(0), u16a(0), u16a(0), u16a(0),
      u32a(0), u32a(c.off)
    ));
    cdParts.push(ch, c.name);
    offset += ch.length + c.name.length;
  });
  var eocd=new Uint8Array([].concat(
    [0x50,0x4b,0x05,0x06], u16a(0), u16a(0), u16a(central.length), u16a(central.length),
    u32a(offset-cdStart), u32a(cdStart), u16a(0)
  ));
  return new Blob(parts.concat(cdParts,[eocd]),{type:'application/zip'});
}
function blobToU8(b){ return b.arrayBuffer().then(function(ab){ return new Uint8Array(ab); }); }
function dataURLtoBlob(dataURL){
  var parts=String(dataURL).split(',');
  var mime=(parts[0].match(/:(.*?);/)||[])[1]||'image/png';
  var bin=atob(parts[1]);
  var u8=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
  return new Blob([u8],{type:mime});
}
function saveBlob(blob,name){
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url; a.download=name; a.style.display='none';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){
    if(a.parentNode) a.parentNode.removeChild(a);
    URL.revokeObjectURL(url);
  },8000);
}
function safeName(n){
  return String(n||'图层').replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,' ').trim().slice(0,40)||'图层';
}
function pad2(n){ return (n<10?'0':'')+n; }
function canvasToBlob(c){
  return new Promise(function(res,rej){
    if(c.toBlob) c.toBlob(function(b){ b? res(b): rej(new Error('导出失败')); },'image/png');
    else rej(new Error('浏览器不支持导出'));
  });
}
function textLayerCanvas(l,scale){
  var c=document.createElement('canvas');
  c.width=Math.round(state.board.w*scale);
  c.height=Math.round(state.board.h*scale);
  var ctx=c.getContext('2d');
  drawText(ctx,{ type:'text', text:l.text, bbox:l.bbox, style:l.style },scale);
  return c;
}
function layerBlob(l){
  if(l.type==='text') return canvasToBlob(textLayerCanvas(l,2));
  var src=l.png||ensureImagePng(l);
  if(!src) return Promise.reject(new Error('该图层没有图片'));
  if(src.indexOf('data:')===0) return Promise.resolve(dataURLtoBlob(src));
  if(/^https?:/.test(src)){
    return fetch(src,{cache:'no-store'}).then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.blob();
    });
  }
  return Promise.reject(new Error('无法识别的图层地址'));
}
/* 单层下载：图片层按当前视觉变换画进整张画板大小的透明 PNG（和画布所见一致），文字层沿用原逻辑 */
function imageLayerCanvas(l){
  var src=l.png||ensureImagePng(l);
  if(!src) return Promise.reject(new Error('该图层没有图片'));
  return loadDrawable(src).then(function(img){
    var b=state.board, box=layerBox(l);
    var c=document.createElement('canvas'); c.width=b.w; c.height=b.h;
    c.getContext('2d').drawImage(img, box.x, box.y, box.w, box.h);
    return c.toDataURL('image/png');
  });
}
function exportLayerBlob(l){
  if(l.type==='text') return layerBlob(l);
  return imageLayerCanvas(l).then(function(url){ return dataURLtoBlob(url); });
}
function downloadLayer(l){
  if(!l) return;
  toast(l.type==='text'?'正在导出「'+l.name+'」…':'正在导出「'+l.name+'」（含位置/缩放，整张画布 PNG）…','',1500);
  exportLayerBlob(l).then(function(b){
    saveBlob(b, safeName(l.name)+'.png');
  }).catch(function(e){
    toast('导出失败：'+(e.message||'未知错误'),'err',3000);
  });
}
function downloadAll(){
  var layers=state.layers.slice().sort(function(a,b){ return (a.z||0)-(b.z||0); });
  if(!layers.length){ toast('还没有图层可下载','warn'); return; }
  toast('正在打包 '+layers.length+' 个图层…','',1400);
  Promise.all(layers.map(function(l,i){
    return exportLayerBlob(l).then(function(b){ return { name:pad2(i+1)+'-'+safeName(l.name)+'.png', blob:b }; })
      .catch(function(){ return null; });
  })).then(function(items){
    var ok=items.filter(Boolean);
    if(!ok.length) throw new Error('没有可用的图层图片');
    return Promise.all(ok.map(function(it){
      return blobToU8(it.blob).then(function(u8){ return { name:it.name, data:u8 }; });
    })).then(function(files){
      saveBlob(makeZip(files),'split-layers.zip');
      toast('已打包下载 '+ok.length+' 个图层（'+files.length+' 张 PNG）');
    });
  }).catch(function(e){
    toast('下载失败：'+(e.message||'未知错误'),'err',3200);
  });
}

   17. 框选

var selDrag=null;
function mediaBox(){ return $('#node-media').getBoundingClientRect(); }
function toImagePoint(cx,cy){
  var b=mediaBox();
  return {
    x: clamp((cx-b.left)/b.width,0,1)*state.image.w,
    y: clamp((cy-b.top)/b.height,0,1)*state.image.h
  };
}
function normRect(a,b){
  return { x:Math.min(a.x,b.x), y:Math.min(a.y,b.y), w:Math.abs(a.x-b.x), h:Math.abs(a.y-b.y) };
}
function drawSelRect(r){
  var b=mediaBox();
  var sx=b.width/state.image.w, sy=b.height/state.image.h;
  var el=$('#sel-rect');
  el.classList.remove('off');
  el.style.left=(r.x*sx)+'px';
  el.style.top=(r.y*sy)+'px';
  el.style.width=Math.max(1,r.w*sx)+'px';
  el.style.height=Math.max(1,r.h*sy)+'px';
  $('#sel-label').textContent=Math.round(r.w)+' × '+Math.round(r.h);
}
function startSelection(){
  if(!state.customOpen) openCustomPanel();
  closeMenu();
  state.selecting=true;
  $('#sel-layer').classList.remove('off');
  $('#sel-rect').classList.add('off');
  var h=$('#sel-hint-text'); if(h) h.textContent='框选你想拆分的区域 · Esc 取消';
  try{ $('#modal-desc').blur(); }catch(e){}
}
function endSelection(){
  state.selecting=false;
  $('#sel-layer').classList.add('off');
  $('#sel-rect').classList.add('off');
  updateChip();
  updateSubmitState();
  if(state.customOpen){ setTimeout(function(){ try{ $('#modal-desc').focus(); }catch(e){} },30); }
}
function cancelSelection(){
  state.selecting=false;
  $('#sel-layer').classList.add('off');
  $('#sel-rect').classList.add('off');
  updateChip();
  updateSubmitState();
}
var thumbToken=0;
function refreshFrameThumb(){
  var sel=state.selection;
  if(!sel || !state.image.dataURL){ state.frameThumb=''; return; }
  var token=++thumbToken;
  loadImage(state.image.dataURL).then(function(img){
    if(token!==thumbToken) return;
    var c=document.createElement('canvas'); c.width=88; c.height=56;
    var ctx=c.getContext('2d');
    var sx=(img.naturalWidth||state.image.w)/state.image.w;
    var sy=(img.naturalHeight||state.image.h)/state.image.h;
    var x=clamp(sel.x*sx,0,(img.naturalWidth||1)-1);
    var y=clamp(sel.y*sy,0,(img.naturalHeight||1)-1);
    var w=Math.max(1,Math.min(sel.w*sx,(img.naturalWidth||1)-x));
    var h=Math.max(1,Math.min(sel.h*sy,(img.naturalHeight||1)-y));
    ctx.drawImage(img,x,y,w,h,0,0,88,56);
    state.frameThumb=c.toDataURL('image/png');
    var c2=document.createElement('canvas'); c2.width=320; c2.height=200;
    c2.getContext('2d').drawImage(img,x,y,w,h,0,0,320,200);
    state.framePreview=c2.toDataURL('image/png');
    updateChip();
  }).catch(function(){});
}
function bindSelection(){
  var layerEl=$('#sel-layer');
  layerEl.addEventListener('pointerdown',function(e){
    if(!state.selecting) return;
    e.preventDefault();
    var start=toImagePoint(e.clientX,e.clientY);
    selDrag={ start:start, cur:start };
    try{ layerEl.setPointerCapture(e.pointerId); }catch(err){}
    drawSelRect(normRect(start,start));
    function mv(ev){
      if(!selDrag) return;
      selDrag.cur=toImagePoint(ev.clientX,ev.clientY);
      drawSelRect(normRect(selDrag.start,selDrag.cur));
    }
    function up(){
      layerEl.removeEventListener('pointermove',mv);
      layerEl.removeEventListener('pointerup',up);
      layerEl.removeEventListener('pointercancel',up);
      var r=normRect(start,(selDrag&&selDrag.cur)||start);
      selDrag=null;
      if(r.w>10 && r.h>10){
        state.selection={ x:Math.round(r.x), y:Math.round(r.y), w:Math.round(r.w), h:Math.round(r.h) };
        refreshFrameThumb();
      }
      endSelection();
    }
    layerEl.addEventListener('pointermove',mv);
    layerEl.addEventListener('pointerup',up);
    layerEl.addEventListener('pointercancel',up);
  });
}

   18. 自定义拆分面板（贴源图右侧）

function getPromptText(){
  var inp=$('#modal-desc');
  if(!inp) return '';
  var clone=inp.cloneNode(true);
  var c=clone.querySelector('.chip'); if(c) c.remove();
  return (clone.textContent||'').replace(/\u200b/g,'').replace(/\u00a0/g,' ').trim();
}
function updateSubmitState(){
  var btn=$('#modal-submit');
  if(btn) btn.disabled=!(getPromptText().length>0 || !!state.selection);
  refreshPlaceholder();
}
function refreshPlaceholder(){
  var inp=$('#modal-desc'), ph=$('#cpanel-ph');
  if(!inp||!ph) return;
  var hasChip=!!inp.querySelector('.chip');
  var text=getPromptText();
  ph.style.display=(!hasChip && text.length===0)?'block':'none';
}
function setCaretToEnd(el){
  try{
    var range=document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    var sel=window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }catch(e){}
}
function updateChip(){
  var inp=$('#modal-desc');
  if(!inp) return;
  var chip=inp.querySelector('.chip');
  if(!state.selection){
    if(chip) chip.remove();
    var pv0=$('#chip-preview'); if(pv0) pv0.classList.remove('open');
    refreshPlaceholder(); autoGrowDesc(); updateSubmitState();
    return;
  }
  if(!chip){
    chip=document.createElement('span');
    chip.className='chip';
    chip.contentEditable='false';
    chip.setAttribute('data-testid','sl-frame-chip');
    inp.insertBefore(chip, inp.firstChild);
    if(!chip.nextSibling) inp.appendChild(document.createTextNode('\u200b'));
  }
  chip.innerHTML='';
  if(state.frameThumb){
    var img=document.createElement('img');
    img.className='chip-thumb';
    img.setAttribute('data-testid','sl-frame-thumb');
    img.alt='框选缩略图';
    img.src=state.frameThumb;
    chip.appendChild(img);
  }
  var lb=document.createElement('span');
  lb.className='chip-label';
  lb.setAttribute('data-testid','sl-modal-chip');
  lb.textContent='框选 1';
  chip.appendChild(lb);
  var x=document.createElement('button');
  x.type='button';
  x.className='x';
  x.contentEditable='false';
  x.title='清除框选';
  x.innerHTML=icon('x');
  x.addEventListener('mousedown',function(e){ e.preventDefault(); });
  x.addEventListener('click',function(e){
    e.preventDefault();
    e.stopPropagation();
    state.selection=null;
    state.frameThumb='';
    updateChip();
    updateSubmitState();
    try{ inp.focus(); }catch(err){}
  });
  chip.appendChild(x);
  bindChipHover(chip);
  refreshPlaceholder(); autoGrowDesc(); updateSubmitState();
}
var chipPreviewTimer=null;
function ensurePreviewBindings(){
  var pv=$('#chip-preview');
  if(!pv || pv.dataset.bound) return;
  pv.dataset.bound='1';
  pv.addEventListener('mouseenter',function(){ clearTimeout(chipPreviewTimer); });
  pv.addEventListener('mouseleave',function(){ pv.classList.remove('open'); });
}
function showChipPreview(chip){
  var pv=$('#chip-preview');
  if(!pv || !state.frameThumb || !state.selection) return;
  var big=state.framePreview||state.frameThumb;
  pv.innerHTML='<img src="'+big+'" alt="框选缩略图"><div class="cp-meta">框选 1 · '+Math.round(state.selection.w)+' × '+Math.round(state.selection.h)+'</div>';
  positionChipPreview(chip);
  pv.classList.add('open');
}
function scheduleHideChipPreview(){
  var pv=$('#chip-preview');
  if(!pv) return;
  clearTimeout(chipPreviewTimer);
  chipPreviewTimer=setTimeout(function(){ pv.classList.remove('open'); },260);
}
function bindChipHover(chip){
  ensurePreviewBindings();
  chip.addEventListener('mouseenter',function(){ clearTimeout(chipPreviewTimer); showChipPreview(chip); });
  chip.addEventListener('mouseleave',scheduleHideChipPreview);
}
function positionChipPreview(chip){
  var pv=$('#chip-preview');
  if(!pv) return;
  var c=chip.getBoundingClientRect();
  var panel=$('#custom-panel');
  var pr=(panel && state.customOpen)? panel.getBoundingClientRect() : null;
  var pw=pv.offsetWidth||200, ph=pv.offsetHeight||150;
  var gap=10;
  var left, top;
  /* 首选：面板左侧、与 chip 垂直对齐（浮在画布上，不压面板/输入区/按钮） */
  left = pr? pr.left-gap-pw : c.left-gap-pw;
  top = c.top + c.height/2 - ph/2;
  if(left<10){
    /* 次选：chip 上方且完全在面板外 */
    left = clamp(c.left+12, 10, Math.max(10,innerWidth-pw-10));
    top = c.top-gap-ph;
    if(top<10) top = c.bottom+gap;
  }
  /* 兜底：绝不与面板相交 */
  if(pr){
    var hit = !(left+pw<=pr.left || left>=pr.right || top+ph<=pr.top || top>=pr.bottom);
    if(hit){ left = pr.left-gap-pw; }
  }
  left=clamp(left,10,Math.max(10,innerWidth-pw-10));
  top=clamp(top,10,Math.max(10,innerHeight-ph-10));
  pv.style.left=Math.round(left)+'px';
  pv.style.top=Math.round(top)+'px';
}
function autoGrowDesc(){
  var t=$('#modal-desc');
  if(!t) return;
  t.style.height='auto';
  t.style.height=Math.min(200, Math.max(76, t.scrollHeight))+'px';
}
function bindPromptInput(){

      var chip=inp.querySelector('.chip');
      inp.innerHTML='';
      if(chip) inp.appendChild(chip);
      inp.appendChild(document.createTextNode(text.slice(0,300)));
      setCaretToEnd(inp);
    }
    refreshPlaceholder();
    autoGrowDesc();
    updateSubmitState();
  });
  inp.addEventListener('keydown',function(e){
    if(e.key==='Enter' && (e.metaKey||e.ctrlKey)){ e.preventDefault(); submitCustom(); }
  });
  inp.addEventListener('paste',function(e){
    e.preventDefault();
    var t=(e.clipboardData||window.clipboardData).getData('text/plain')||'';
    try{ document.execCommand('insertText',false,t); }catch(err){}
  });
  inp.addEventListener('click',function(e){
    if(e.target.closest('.chip')) e.stopPropagation();
  });
}function positionCustomPanel(){
  var p=$('#custom-panel');
  if(!p || !state.customOpen) return;
  var card=$('#node-card');
  p.style.top=(card? card.offsetTop : 62)+'px';
  var ws=$('#workspace');
  var node=$('#source-node');
  if(!node) return;
  ws.style.transform='';
  var pw=p.offsetWidth||430;
  // 用布局坐标（offset*）计算，避免 transform 过渡造成的测量抖动
  var baseLeft=ws.offsetLeft;
  var nodeLeft=node.offsetLeft;
  var nodeRight=nodeLeft+node.offsetWidth;
  var overflow=(baseLeft+nodeRight+20+pw)-(window.innerWidth-20);
  var shift=overflow>0? -Math.ceil(overflow) : 0;
  var minShift=24-(baseLeft+nodeLeft);
  if(shift<minShift) shift=minShift;
  ws.style.transform=shift? 'translateX('+shift+'px)' : '';
}
function openCustomPanel(){
  if(state.customOpen) return;
  closeMenu();
  closePanel();
  state.customOpen=true;
  if(state.resultNode){
    state.hideResult=true;

function closeCustomPanel(silent){

/* ============================================================
   18b. 保存为图片节点 / 图片查看器 / 文字添加 / 导出 PSD
   ============================================================ */
function loadDrawable(src){
  /* 后端图片走 fetch(cors, no-store)：既避免 canvas 污染，也绕开浏览器缓存里
     那份「无 CORS 头」的旧响应（否则会被判 No ACAO） */
  if(/^https?:/.test(src)){
    return fetch(src,{mode:'cors',cache:'no-store'}).then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.blob();
    }).then(function(b){ return createImageBitmap(b); }).catch(function(){
      return new Promise(function(res,rej){
        var im=new Image(); im.crossOrigin='anonymous';
        im.onload=function(){ res(im); }; im.onerror=function(){ rej(new Error('图片加载失败')); };
        im.src=src;
      });
    });
  }
  return new Promise(function(res,rej){
    var im=new Image();
    im.onload=function(){ res(im); };
    im.onerror=function(){ rej(new Error('图片加载失败')); };
    im.src=src;
  });
}
function compositeCanvas(){
  var b=state.board;
  var c=document.createElement('canvas'); c.width=b.w; c.height=b.h;
  var ctx=c.getContext('2d');
  var layers=state.layers.slice().sort(function(x,y){ return (x.z||0)-(y.z||0); });
  return layers.reduce(function(p,l){
    return p.then(function(){
      if(l.visible===false) return;
      if(l.type==='text'){ drawText(ctx,l,1); return; }
      var src=l.png||ensureImagePng(l);
      if(!src) return;
      return loadDrawable(src).then(function(img){
        var box=layerBox(l);
        ctx.drawImage(img, box.x, box.y, box.w, box.h);
      }).catch(function(){});
    });
  }, Promise.resolve()).then(function(){ return c; });
}
function centerContrastColor(){
  return compositeCanvas().then(function(c){
    var ctx=c.getContext('2d');
    var d=ctx.getImageData(Math.floor(c.width/2), Math.floor(c.height*0.45), 1, 1).data;
    var lum=0.2126*d[0]+0.7152*d[1]+0.0722*d[2];
    return lum>150? '#111114' : '#FFFFFF';
  }).catch(function(){ return '#FFFFFF'; });
}

var AG_PSD_URL='https://cdn.jsdelivr.net/npm/ag-psd@34.1.0/dist/bundle.js';
function loadAgPsd(){
  if(window.agPsd) return Promise.resolve(window.agPsd);
  if(state.psdPromise) return state.psdPromise;
  state.psdPromise=new Promise(function(res,rej){
    var s=document.createElement('script');
    s.src=AG_PSD_URL;
    s.onload=function(){ window.agPsd? res(window.agPsd) : rej(new Error('agPsd 未找到')); };
    s.onerror=function(){ rej(new Error('脚本加载失败')); };
    document.head.appendChild(s);
  }).catch(function(e){ state.psdPromise=null; throw e; });
  return state.psdPromise;
}
function psdColor(hex){
  var c=hex2rgb(hex)||{r:255,g:255,b:255};
  return { r:c.r, g:c.g, b:c.b, a:255 };
}
function styleWeight(style){
  var s=String(style||'').toLowerCase();
  if(!s) return 0;
  if(/ultra\s*light|extra\s*light/.test(s)) return 200;
  if(/thin/.test(s)) return 100;
  if(/semi\s*bold|demi\s*bold/.test(s)) return 600;
  if(/extra\s*bold|ultra\s*bold/.test(s)) return 800;
  if(/black|heavy/.test(s)) return 900;
  if(/bold/.test(s)) return 700;
  if(/medium/.test(s)) return 500;
  if(/light/.test(s)) return 300;
  if(/regular|normal|book|roman/.test(s)) return 400;
  var m=s.match(/\b([1-9]00)\b/); if(m) return +m[1];
  return 0;
}
/* 常见本机字体的 PostScript 名回退表（queryLocalFonts 不可用时用） */
var LOCAL_PS_FALLBACK={
  'Georgia':function(w,it){ var n=(w>=600?'Georgia-Bold':'Georgia'); return it? (w>=600?'Georgia-BoldItalic':'Georgia-Italic') : n; },
  'PingFang SC':function(w){ if(w<=100) return 'PingFangSC-Thin'; if(w<=200) return 'PingFangSC-Ultralight'; if(w<=300) return 'PingFangSC-Light'; if(w<=400) return 'PingFangSC-Regular'; if(w<=500) return 'PingFangSC-Medium'; return 'PingFangSC-Semibold'; },
  'Songti SC':function(w){ if(w<=300) return 'STSongti-SC-Light'; if(w<=400) return 'STSongti-SC-Regular'; if(w<=700) return 'STSongti-SC-Bold'; return 'STSongti-SC-Black'; },
  'Helvetica Neue':function(w,it){ var n=(w<=300?'HelveticaNeue-Light': w<=400?'HelveticaNeue': w<=500?'HelveticaNeue-Medium': w>=700?'HelveticaNeue-Bold':'HelveticaNeue'); if(!it) return n; return n==='HelveticaNeue'?'HelveticaNeue-Italic':n+'Italic'; },
  'Arial':function(w,it){ if(w>=700) return it?'Arial-BoldItalicMT':'Arial-BoldMT'; return it?'Arial-ItalicMT':'ArialMT'; }
};
function psNameFor(family,weight,italic){
  var fam=String(family||'').trim();
  var w=normWeight(weight)||400;
  var list=state.localFontMeta && state.localFontMeta[fam];
  if(list && list.length){
    var best=null, bd=1e9;
    list.forEach(function(f){
      var d=Math.abs((f.weight||400)-w) + (italic ? (f.italic?0:40) : (f.italic?40:0));
      if(d<bd){ bd=d; best=f; }
    });
    if(best && best.postscriptName) return best.postscriptName;
  }
  var fn=LOCAL_PS_FALLBACK[fam];
  if(fn) return fn(w,!!italic);
  return psFontName(family,weight,italic);
}

function psFontName(family,weight,italic){
  var base=family||'Archivo';
  var map={
    'Archivo':'Archivo','Inter':'Inter','Playfair Display':'PlayfairDisplay','Space Grotesk':'SpaceGrotesk',
    'DM Sans':'DMSans','Bebas Neue':'BebasNeue','Noto Sans SC':'NotoSansSC','Noto Serif SC':'NotoSerifSC',
    'Manrope':'Manrope','Sora':'Sora','Roboto Mono':'RobotoMono','Ma Shan Zheng':'MaShanZheng'
  };
  var ps=map[base];
  if(!ps){
    ps=String(base).replace(/\s+/g,'').replace(/[^A-Za-z0-9]/g,'');
    if(!ps) ps='ArialMT';
    return italic? ps+'Italic' : ps;
  }
  if(base==='Bebas Neue') return 'BebasNeue-Regular'+(italic?'Italic':'');
  var w={100:'Thin',200:'ExtraLight',300:'Light',400:'Regular',500:'Medium',600:'SemiBold',700:'Bold',800:'ExtraBold',900:'Black'}[normWeight(weight)]||'Regular';
  return ps+'-'+w+(italic?'Italic':'');
}
function buildTextPsdLayer(l){
  var s=l.style, b=l.bbox;
  var x = s.align==='center'? Math.round(b.x+b.w/2) : (s.align==='right'? Math.round(b.x+b.w) : Math.round(b.x));
  var y = Math.round(b.y);
  var style={
    font:{ name: psNameFor(s.fontFamily,s.fontWeight,s.italic) },
    fontSize: s.fontSize,
    fillColor: psdColor(s.color),
    tracking: Math.round((s.letterSpacing||0)/Math.max(1,s.fontSize)*1000),
    leading: Math.round((s.fontSize||48)*(s.lineHeight||1.15)),
    horizontalScale: s.scaleX||100,
    verticalScale: s.scaleY||100
  };
  if(s.strokeColor && +s.strokeWidth>0){ style.strokeColor=psdColor(s.strokeColor); style.outlineWidth=+s.strokeWidth; }
  if(s.underline) style.underline=true;
  if(s.strike) style.strikethrough=true;
  if(s.transformCase==='upper') style.fontCaps=1;
  return {
    name: l.name || '文字',
    hidden: l.visible===false,
    opacity: Math.round(255*(s.opacity==null?1:s.opacity)),
    text:{
      text: String(l.text||''),
      transform:[1,0,0,1,x,y],
      style: style,
      paragraphStyle:{ justification: s.align==='center'?'center':(s.align==='right'?'right':'left') }
    },
    left: Math.round(b.x), top: Math.round(b.y),
    right: Math.round(b.x+b.w), bottom: Math.round(b.y+b.h)
  };
}
/* 文字层预览位图：按现有 drawText 绘制，裁到 bbox 外扩 20px（clamp 图内），
   与 text.transform 共用 document 坐标，保证 PS 里位图与可编辑文字位置一致 */
function textPreviewData(l){
  var board=state.board, s=l.style;
  var b=l.bbox || { x:0, y:0, w:board.w, h:board.h };
  var pad=20;
  var fs=s.fontSize||48, lh=(s.lineHeight||1.15)*fs;
  var lines=String(l.text==null?'':l.text).split('\n');
  if(s.transformCase==='upper') lines=lines.map(function(x){return x.toUpperCase();});
  else if(s.transformCase==='lower') lines=lines.map(function(x){return x.toLowerCase();});
  var mc=document.createElement('canvas').getContext('2d');
  mc.font=(s.italic?'italic ':'')+normWeight(s.fontWeight)+' '+fs+'px '+fontStackCanvas(s.fontFamily);
  if('letterSpacing' in mc) mc.letterSpacing=((s.letterSpacing||0))+'px';
  var maxW=0;
  lines.forEach(function(line){ maxW=Math.max(maxW, mc.measureText(line).width); });
  var inkX = s.align==='center'? (b.x+b.w/2-maxW/2) : (s.align==='right'? (b.x+b.w-maxW) : b.x);
  var x0=Math.min(b.x, inkX), y0=Math.min(b.y, b.y);
  var x1=Math.max(b.x+b.w, inkX+maxW), y1=Math.max(b.y+b.h, b.y+lines.length*lh);
  x0=Math.floor(clamp(x0-pad,0,board.w)); y0=Math.floor(clamp(y0-pad,0,board.h));
  x1=Math.ceil(clamp(x1+pad,0,board.w));  y1=Math.ceil(clamp(y1+pad,0,board.h));
  var w=Math.max(1,x1-x0), h=Math.max(1,y1-y0);
  var c=document.createElement('canvas'); c.width=w; c.height=h;
  var ctx=c.getContext('2d');
  ctx.translate(-x0,-y0);
  drawText(ctx,l,1);
  var iw=Math.max(1,Math.round(c.width)), ih=Math.max(1,Math.round(c.height));
  var data;
  try{
    data=ctx.getImageData(0,0,iw,ih);
  }catch(err){
    console.error('[textPreview] getImageData failed', {x0:x0,y0:y0,w:w,h:h,iw:iw,ih:ih,cw:c.width,ch:c.height,bbox:l.bbox,fs:fs});
    var blank=document.createElement('canvas'); blank.width=iw; blank.height=ih;
    data=blank.getContext('2d').getImageData(0,0,iw,ih);
  }
  return { left:x0, top:y0, right:x0+iw, bottom:y0+ih, imageData:data };
}
function exportPsd(){
  var btn=$('#export-psd');
  if(!btn || btn.disabled) return;
  if(!state.layers.length){ toast('还没有图层可导出','warn'); return; }
  btn.disabled=true;
  var label=btn.querySelector('span:last-child');
  var oldLabel=label? label.textContent : '导出 PSD';
  if(label) label.textContent='导出中…';
  var restore=function(){ btn.disabled=false; if(label) label.textContent=oldLabel; };
  loadAgPsd().then(function(agPsd){
    var b=state.board;
    return compositeCanvas().then(function(canvas){
      var psd={ width:b.w, height:b.h, imageData:canvas.getContext('2d').getImageData(0,0,b.w,b.h), children:[] };
      var layers=state.layers.slice().sort(function(x,y){ return (x.z||0)-(y.z||0); });
      return layers.reduce(function(p,l){
        return p.then(function(){
          if(l.type==='text'){
            /* 文字层：保留 type 元数据 + 预览位图（不转曲），PS 打开先显示位图，改字后再重绘 */
            var tl=buildTextPsdLayer(l);
            var pv=textPreviewData(l);
            tl.left=pv.left; tl.top=pv.top; tl.right=pv.right; tl.bottom=pv.bottom;
            tl.imageData=pv.imageData;
            psd.children.push(tl);
            return;
          }
          var src=l.png||ensureImagePng(l);
          var load = src? loadDrawable(src).catch(function(){ return null; }) : Promise.resolve(null);
          return load.then(function(img){
            /* 按内容框 tf 裁切：PSD 图层 bounds / 内容和画布所见一致 */
            var tf=layerTf(l), box=layerBox(l);
            var left=Math.round(tf.x), top=Math.round(tf.y);
            var cw=Math.max(1,Math.round(tf.w)), chh=Math.max(1,Math.round(tf.h));
            var c=document.createElement('canvas'); c.width=cw; c.height=chh;
            var cx=c.getContext('2d');
            if(img) cx.drawImage(img, box.x-left, box.y-top, box.w, box.h);
            psd.children.push({ name:l.name||'图层', top:top, left:left, right:left+cw, bottom:top+chh, hidden:l.visible===false, opacity:255,
              imageData: cx.getImageData(0,0,cw,chh) });
          });
        });
      }, Promise.resolve()).then(function(){
        var out=agPsd.writePsd(psd,{ generateThumbnail:true });
        saveBlob(new Blob([out],{type:'image/vnd.adobe.photoshop'}),'拆分图层.psd');
        toast('已导出 PSD（'+psd.children.length+' 图层）');
      });
    });
  }).catch(function(e){
    console.error('[psd export]', e);
    var msg=(e && e.message) || '';
    var cdn=/load|script|agPsd/i.test(msg) || !window.agPsd;
    toast(cdn? '导出组件加载失败，请检查网络' : ('PSD 导出失败：'+msg),'err',3600);
  }).then(restore, function(){ restore(); });
}

    loadImage(fr.result).then(function(img){

      closeResult(true);

}

function applyTheme(theme,canvasBg,d){
  if(theme==='light'||theme==='dark'){
    document.documentElement.classList.remove('theme-light','theme-dark');
    document.documentElement.classList.add('theme-'+theme);
  }
  /* inline：不写任何画布底色 / 点阵变量，宿主画布直接透上来 */
  if(INLINE) return;
  var st=document.documentElement.style;
  var setV=function(k,v,re){ if(v!=null && re.test(String(v).trim())) st.setProperty(k,String(v).trim()); else st.removeProperty(k); };
  setV('--canvas-bg',canvasBg,/^(#|rgb|hsl)/);
  if(d){
    setV('--canvas-dot',d.canvasDot,/^(#|rgba?\(|hsla?\()/i);
    var rv=d.canvasDotRadius;
    if(rv!=null && /^\d+(\.\d+)?(px)?$/.test(String(rv).trim())){ var rt=String(rv).trim(); st.setProperty('--canvas-dot-r', /px$/.test(rt)? rt : (rt+'px')); }
    else { st.removeProperty('--canvas-dot-r'); }
    var sz=d.canvasDotSize;
    if(sz!=null && /^\d+(\.\d+)?(px)?(\s+\d+(\.\d+)?(px)?)?$/.test(String(sz).trim())){
      var parts=String(sz).trim().split(/\s+/).slice(0,2).map(function(v){ return /px$/.test(v)? v : (v+'px'); });
      if(parts.length===1) parts.push(parts[0]);
      st.setProperty('--canvas-dot-size',parts.join(' '));
    } else { st.removeProperty('--canvas-dot-size'); }
    var px=function(v){ if(v==null) return null; var t=String(v).trim(); if(!/^-?\d+(\.\d+)?(px)?$/.test(t)) return null; return /px$/.test(t)? t : (t+'px'); };
    var dx=px(d.canvasDotX), dy=px(d.canvasDotY);
    if(dx!=null) st.setProperty('--canvas-dot-x',dx); else st.removeProperty('--canvas-dot-x');
    if(dy!=null) st.setProperty('--canvas-dot-y',dy); else st.removeProperty('--canvas-dot-y');
  }
}
function embedApplyInit(d){
  /* 宿主可传 theme / canvasBg（缺省用 URL 主题与主题色） */
  applyTheme(d.theme||THEME, d.canvasBg, d);
  if(d.apiBase!=null) state.backend.base=String(d.apiBase||'').replace(/\/+$/,'');
  if(d.apiPath) state.backend.splitPath=d.apiPath;
  state.backend.state='online';
  state.backend.engine=d.engine||'beat';
  setStatus('online','已连接');
  var eb=$('#engine-badge'); if(eb) eb.textContent=state.backend.engine;
  if(d.image){
    setNodeImage(d.image, d.width||0, d.height||0);
    if(d.width&&d.height) state.board={w:d.width,h:d.height};
  } else if(d.width&&d.height){
    state.board={w:d.width,h:d.height};
  }
  layoutAll();
  if(INLINE){
    if(d.mode==='custom'){ inlineSetSourceHidden(false); openCustomPanel(); }
    else { inlineSetSourceHidden(true); startSplit('auto'); }
    return;
  }
  if(d.mode==='custom'){ openCustomPanel(); }
  else { startSplit('auto'); }
}
window.addEventListener('message',function(e){
  var d=e&&e.data;
  if(!d || d.source!=='novai-split-host') return;
  if(d.type==='init') embedApplyInit(d);
  else if(d.type==='theme') applyTheme(d.theme,d.canvasBg,d);
  else if(d.type==='bg') applyTheme(null,d.canvasBg,d);
  else if(d.type==='win-drag-end') endWinDrag();
});
init();
if(EMBED) embedPost('ready');
})();
</script>
