<style>
/* --- 页面特定 Marvis 覆盖 --- */
        body { background: var(--bg) !important; color: var(--text) !important; }
/* --- Marvis 增强覆盖 (online.html) --- */
.nano-input { background: var(--stage-bg) !important; color: var(--text) !important; border: 0 !important; border-radius: var(--radius-lg) !important; }
.nano-input::placeholder { color: var(--faint) !important; }
.upload-item { background: var(--stage-bg) !important; border: 1px dashed var(--border) !important; border-radius: var(--radius-lg) !important; }
.upload-item:hover, .upload-item.drag-over { background: var(--soft) !important; }
.tool-panel, .control-panel { background: var(--stage-bg) !important; border: 0 !important; border-radius: var(--radius-lg) !important; }
.size-select, .size-custom { background: var(--soft) !important; color: var(--text) !important; border: 0 !important; border-radius: var(--radius-md) !important; }
.glass-btn { background: var(--text) !important; color: var(--bg) !important; border-radius: var(--radius-lg) !important; }
.glass-btn:hover { opacity: 0.88 !important; }
.result-frame { background: var(--stage-bg) !important; border-radius: var(--radius-lg) !important; }
.masonry-item { background: var(--stage-bg) !important; border-radius: var(--radius-lg) !important; }
/* --- 左右双栏 Split Layout：左栏固定宽自滚动，右栏填满剩余空间 --- */
/* 100vh 需除以全局 UI 缩放系数（theme.js autoScale），否则缩放窗口下填不满视口高度 */
.split-root { display: flex; height: calc(100vh / var(--studio-ui-scale, 1)); overflow: hidden; }
.split-left { width: clamp(300px, 30vw, 360px); flex-shrink: 0; height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 24px; padding: 32px 24px; border-right: none; }
.split-right { flex: 1; min-width: 0; height: 100%; overflow-y: auto; }
.split-right-inner { max-width: 1080px; margin: 0 auto; padding: 32px 40px 72px; display: flex; flex-direction: column; gap: 56px; }
#resultBox { height: clamp(420px, 58vh, 720px); }
@media (max-width: 768px) {
    .split-root { flex-direction: column; height: auto; overflow: visible; }
    .split-left { width: 100% !important; height: auto; max-height: none; overflow-y: visible; border-right: none; border-bottom: 1px solid var(--border); padding: 16px; }
    .split-right { height: auto; overflow-y: visible; }
    .split-right-inner { padding: 16px 16px 48px; gap: 40px; }
    #resultBox { height: auto; min-height: 320px; }
    #genBtn { position: static !important; }
}

/* ═══ 方向 E · 分组卡片面板 ═══ */
.split-left { gap: 12px; }
/* 背景装饰：纯色背景（移除光晕装饰，避免右侧出现椭圆暗影被误认为背景框） */
.split-root {
    background: var(--bg);
}
.nv-card {
    background: color-mix(in srgb, var(--elevated) 55%, transparent);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid color-mix(in srgb, var(--text) 7%, transparent);
    border-radius: var(--radius-lg);
    box-shadow: inset 0 1px 0 color-mix(in srgb, var(--text) 10%, transparent), var(--shadow-md);
    overflow: visible;
}
html.theme-dark .nv-card, html.studio-theme-dark .nv-card {
    border-color: color-mix(in srgb, var(--text) 14%, transparent);
    box-shadow: inset 0 1px 0 color-mix(in srgb, var(--text) 8%, transparent);
}
.nv-card.lifted { position: relative; z-index: 5; }
.nv-card > .nv-card-head {
    list-style: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    transition: background var(--duration-fast) var(--ease-apple);
}
.nv-card > .nv-card-head::-webkit-details-marker { display: none; }
.nv-card > .nv-card-head:hover { background: var(--soft); }
.nv-card-head .nv-card-ic { width: 15px; height: 15px; color: var(--text-3); flex-shrink: 0; }
.nv-card-head .nv-card-title {
    font-size: var(--text-xs);
    font-weight: 700;
    letter-spacing: var(--tracking-xs);
    text-transform: uppercase;
    color: var(--text-2);
}
.nv-card-chev {
    width: 13px;
    height: 13px;
    color: var(--text-3);
    margin-left: auto;
    transition: transform var(--duration-normal) var(--ease-apple);
}
.nv-card[open] > .nv-card-head .nv-card-chev { transform: rotate(180deg); }
.nv-card-body { padding: 0 16px 16px; }
.nv-card .nv-card-body > * { width: 100%; }
.nv-card .nv-card-body .nano-input { margin: 0; }
/* 卡片内 tool-panel 去盒化 */
.nv-card .tool-panel {
    background: transparent !important;
    border: 0 !important;
    border-radius: 0 !important;
    padding: 0 !important;
}
.nv-card .tool-panel .control-label { margin-bottom: 8px; }
/* 卡片内参考图标题由 summary 承载，grid 留白收窄 */
.nv-card .grid.grid-cols-3.gap-4 { gap: 10px; }

/* ═══ 方向 E · 自定义下拉浮层（nv-select） ═══ */
.nv-select-wrap { position: relative; width: 100%; }
.nv-select-trigger {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 34px;
    width: 100%;
    padding: 0 10px;
    border-radius: var(--radius-md);
    background: var(--soft);
    color: var(--text);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: var(--tracking-xs);
    cursor: pointer;
    border: 1px solid transparent;
    transition: border-color var(--duration-fast) var(--ease-apple), background var(--duration-fast) var(--ease-apple);
}
.nv-select-trigger:hover { border-color: var(--border-2); }
.nv-select-trigger:focus-visible { outline: 2px solid var(--accent-subtle); outline-offset: 1px; }
.nv-select-trigger .nv-select-label {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
    flex: 1 1 auto;
}
.nv-select-trigger .nv-select-chev {
    margin-left: auto;
    flex-shrink: 0;
    width: 12px;
    height: 12px;
    color: var(--text-3);
    transition: transform var(--duration-fast) var(--ease-apple);
}
.nv-select-wrap.open .nv-select-trigger .nv-select-chev { transform: rotate(180deg); }
.nv-select-wrap.disabled { opacity: .55; pointer-events: none; }
.nv-select-menu {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    z-index: 30;
    background: color-mix(in srgb, var(--elevated) 68%, transparent);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    border: 1px solid color-mix(in srgb, var(--text) 10%, transparent);
    border-radius: var(--radius-md);
    box-shadow: inset 0 1px 0 color-mix(in srgb, var(--text) 8%, transparent), var(--shadow-lg);
    padding: 5px;
    max-height: 300px;
    overflow-y: auto;
    display: none;
}
.nv-select-wrap.open .nv-select-menu { display: block; animation: nvFade .16s var(--ease-apple); }
/* 空间不足时向上展开，避免被滚动容器裁剪 */
.nv-select-menu.up { top: auto; bottom: calc(100% + 4px); }
/* 注意：禁用 fixed 定位方案——菜单所在 .nv-card 的 backdrop-filter 与 body 的 transform(scale) 会劫持 fixed 包含块，导致整体偏移。
   保持 absolute 相对 .nv-select-wrap 定位，打开期间由 JS 临时放宽裁剪祖先的 overflow，关闭时恢复 */
@keyframes nvFade { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.nv-select-opt {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 30px;
    padding: 0 10px;
    border-radius: var(--radius-sm);
    font-size: 11px;
    color: var(--text-2);
    cursor: pointer;
    overflow: hidden;
    transition: background var(--duration-fast) var(--ease-apple);
}
.nv-select-opt-text {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
    flex: 1 1 auto;
}
/* 比例下拉图标（形状即比例） */
.nv-ratio-ic {
    width: 12px;
    height: 12px;
    border: 1.5px solid currentColor;
    border-radius: 2px;
    box-sizing: border-box;
    flex-shrink: 0;
    opacity: .8;
}
.nv-select-opt .nv-ratio-ic { opacity: .65; }
.nv-select-opt.sel .nv-ratio-ic { opacity: 1; }
.nv-ratio-ic.r-square { aspect-ratio: 1/1; }
.nv-ratio-ic.r-portrait { aspect-ratio: 2/3; }
.nv-ratio-ic.r-landscape { aspect-ratio: 3/2; }
.nv-ratio-ic.r-portrait43 { aspect-ratio: 3/4; }
.nv-ratio-ic.r-landscape43 { aspect-ratio: 4/3; }
.nv-ratio-ic.r-story { aspect-ratio: 9/16; }
.nv-ratio-ic.r-wide { aspect-ratio: 16/9; }
.nv-ratio-ic.r-custom, .nv-ratio-ic.r-empty { border-style: dashed; opacity: .55; }

/* ═══ 方向 E · 动态光束边框（border-beam 风格，纯 CSS 零 JS） ═══ */
@property --beam-angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
.nv-beam, .nv-beam-wrap {
    position: relative;
    isolation: isolate;
    /* 浅色主题：柔和暖彩光束（琥珀核心 + 玫瑰拖尾 + 暖橙光晕） */
    --beam-core: rgba(180,255,60,.95);
    --beam-mid: rgba(180,255,60,.45);
    --beam-glow: rgba(180,255,60,.55);
}
/* 主光带：2px 环，亮核心 + 柔和拖尾 */
.nv-beam::before, .nv-beam-wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 2px;
    background: conic-gradient(from var(--beam-angle), transparent 0deg, var(--beam-core) 28deg, var(--beam-mid) 70deg, transparent 115deg);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
    pointer-events: none;
    z-index: 2;
    animation: nv-beam-spin 2.6s linear infinite;
}
/* 光晕层：同角度泛光，blur 扩散，提升发光质感 */
.nv-beam::after, .nv-beam-wrap::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    padding: 5px;
    background: conic-gradient(from var(--beam-angle), transparent 0deg, var(--beam-glow) 45deg, transparent 120deg);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite: exclude;
    filter: blur(8px);
    opacity: .4;
    pointer-events: none;
    z-index: 1;
    animation: nv-beam-spin 2.6s linear infinite;
}
@keyframes nv-beam-spin { to { --beam-angle: 360deg; } }
/* 对准修复：textarea 转 block 消除基线空隙，圆角对齐 18px */
.nv-beam-wrap { border-radius: var(--radius-lg); }
.nv-beam-wrap textarea { display: block; }
html.theme-dark .nv-beam, html.studio-theme-dark .nv-beam,
html.theme-dark .nv-beam-wrap, html.studio-theme-dark .nv-beam-wrap {
    --beam-core: rgba(255,255,255,.6);
    --beam-mid: rgba(255,255,255,.26);
    --beam-glow: rgba(255,255,255,.4);
}
/* 深色主题：生成按钮保持深底（与浅色主题按钮同色） */

    background: #1d1d1f !important;

#genBtn.nv-beam,
html.theme-dark #genBtn.nv-beam,
html.studio-theme-dark #genBtn.nv-beam {
    --beam-core: rgba(180,255,60,.95);
    --beam-mid: rgba(180,255,60,.45);
    --beam-glow: rgba(180,255,60,.55);
}
.nv-select-opt:hover { background: var(--accent-subtle); }
.nv-select-opt.sel { color: var(--text); font-weight: 600; }
.nv-select-opt.sel::after {
    content: '';
    margin-left: auto;

/* ═══ 方向 E · 暗色残留修复 ═══ */
html.theme-dark #del1, html.theme-dark #del2, html.theme-dark #del3,

html.theme-dark .upload-item .text-gray-400, html.theme-dark .upload-item .text-gray-300,
html.studio-theme-dark .upload-item .text-gray-400, html.studio-theme-dark .upload-item .text-gray-300 { color: var(--text-3) !important; }

<body>
    <div class="split-root">
        <aside class="split-left">
            <details class="nv-card" open>
                <summary class="nv-card-head">
                    <i data-lucide="type" class="nv-card-ic"></i>
                    <span class="nv-card-title" data-i18n="online.promptLabel">提示词</span>
                    <i data-lucide="chevron-down" class="nv-card-chev"></i>
                </summary>
                <div class="nv-card-body">
                    <textarea id="promptInput" rows="3" class="nano-input w-full p-4 rounded-3xl text-sm outline-none resize-none placeholder-gray-300" placeholder="输入想生成或编辑的画面..." data-i18n-placeholder="online.promptPlaceholder" style="min-height: 80px; transition: height 0.15s ease-out;"></textarea>
                </div>
            </details>

                <details class="nv-card" open>
                    <summary class="nv-card-head">
                        <i data-lucide="images" class="nv-card-ic"></i>
                        <span class="nv-card-title" data-i18n="online.referenceImages">参考图片</span>
                        <i data-lucide="chevron-down" class="nv-card-chev"></i>
                    </summary>
                    <div class="nv-card-body">
                    <div class="grid grid-cols-3 gap-4">
                        <div id="drop-zone-1" onclick="document.getElementById('file1').click()" class="upload-item group aspect-square rounded-3xl flex flex-col items-center justify-center cursor-pointer">
                            <input type="file" id="file1" accept="image/*" class="hidden" onchange="handleFile(this.files[0],1)">
                            <i data-lucide="plus" class="w-5 h-5 text-gray-300 group-hover:text-black"></i><span class="text-[9px] mt-2 font-bold text-gray-400 uppercase">Main</span>
                            <img id="prev1" class="preview-img hidden"><button id="del1" onclick="clearSlot(1,event)" class="hidden absolute top-2 right-2 w-6 h-6 bg-white/90 rounded-full shadow-sm z-10">×</button>
                        </div>
                        <div id="drop-zone-2" onclick="document.getElementById('file2').click()" class="upload-item group aspect-square rounded-3xl flex flex-col items-center justify-center cursor-pointer">
                            <input type="file" id="file2" accept="image/*" class="hidden" onchange="handleFile(this.files[0],2)">
                            <i data-lucide="plus" class="w-5 h-5 text-gray-300 group-hover:text-black"></i><span class="text-[9px] mt-2 font-bold text-gray-400 uppercase">Aux A</span>
                            <img id="prev2" class="preview-img hidden"><button id="del2" onclick="clearSlot(2,event)" class="hidden absolute top-2 right-2 w-6 h-6 bg-white/90 rounded-full shadow-sm z-10">×</button>
                        </div>
                        <div id="drop-zone-3" onclick="document.getElementById('file3').click()" class="upload-item group aspect-square rounded-3xl flex flex-col items-center justify-center cursor-pointer">
                            <input type="file" id="file3" accept="image/*" class="hidden" onchange="handleFile(this.files[0],3)">
                            <i data-lucide="plus" class="w-5 h-5 text-gray-300 group-hover:text-black"></i><span class="text-[9px] mt-2 font-bold text-gray-400 uppercase">Aux B</span>
                            <img id="prev3" class="preview-img hidden"><button id="del3" onclick="clearSlot(3,event)" class="hidden absolute top-2 right-2 w-6 h-6 bg-white/90 rounded-full shadow-sm z-10">×</button>
                        </div>
                    </div>
                    </div>
                </details>

                <details class="nv-card" open>
                    <summary class="nv-card-head">
                        <i data-lucide="sliders-horizontal" class="nv-card-ic"></i>
                        <span class="nv-card-title" data-i18n="online.model">模型</span>
                        <i data-lucide="chevron-down" class="nv-card-chev"></i>
                    </summary>
                    <div class="nv-card-body">
                <div class="tool-panel">
                    <div class="control-label">
                        <i data-lucide="sliders-horizontal" class="w-3.5 h-3.5"></i>
                        <span data-i18n="online.model">Model</span>
                        <span id="providerModeBadge" class="mode-badge" style="margin-left:auto;display:none;"></span>
                    </div>
                    <div class="size-row">
                        <label class="size-field">
                            <select id="providerSelect" class="size-select" onchange="setProvider(this.value)"></select>
                        </label>
                        <label class="size-field">
                            <select id="modelSelect" class="size-select" onchange="setModel(this.value)"></select>
                        </label>
                    </div>
                    <div id="adaptiveExtras" class="size-row" style="margin-top:2px;">
                        <label id="qualityField" class="size-field">
                            <select id="qualitySelect" class="size-select" onchange="setQuality(this.value)" title="Quality">
                                <option value="auto" data-i18n="online.qualityAuto">自动</option>
                                <option value="low" data-i18n="online.qualityLow">低</option>
                                <option value="medium" data-i18n="online.qualityMedium">中</option>
                                <option value="high" data-i18n="online.qualityHigh">高</option>
                            </select>
                        </label>
                        <label id="countField" class="size-field">
                            <select id="countSelect" class="size-select" onchange="setCount(this.value)" title="Count">
                                <option value="1" selected>×1</option>
                                <option value="2">×2</option>
                                <option value="3">×3</option>
                                <option value="4">×4</option>
                            </select>
                        </label>
                    </div>
                    <div class="control-label mt-1">
                        <i data-lucide="ruler" class="w-3.5 h-3.5"></i>
                        <span data-i18n="online.size">Size</span>
                    </div>
                    <div class="size-row">
                        <label id="resolutionField" class="size-field">
                            <select id="resolutionSelect" class="size-select" onchange="setResolution(this.value)">
                                <option value="1k" selected>1K</option>
                                <option value="2k">2K</option>
                                <option value="4k">4K</option>
                                <option value="custom" data-i18n="online.customSize">自定义尺寸</option>
                            </select>
                            <span class="size-pair with-fit">
                                <input id="sizeCustomWidth" class="size-custom" type="number" min="64" step="64" placeholder="宽度" data-i18n-placeholder="online.width" oninput="setCustomSize()">
                                <input id="sizeCustomHeight" class="size-custom" type="number" min="64" step="64" placeholder="高度" data-i18n-placeholder="online.height" oninput="setCustomSize()">
                                <button id="fitImageSizeBtn" class="size-fit-btn" type="button" onclick="fitCustomSizeToImage(event)">适配图片</button>
                            </span>
                        </label>
                        <label id="ratioField" class="size-field">
                            <select id="ratioSelect" class="size-select" onchange="setRatio(this.value)">
                                <option value="" data-i18n="online.emptyRatio">比例为空</option>
                                <option value="square" selected data-i18n="online.square">1:1 方图</option>
                                <option value="portrait" data-i18n="online.portrait">2:3 竖图</option>
                                <option value="landscape" data-i18n="online.landscape">3:2 横图</option>
                                <option value="portrait43">3:4 竖图</option>
                                <option value="landscape43">4:3 横图</option>
                                <option value="story" data-i18n="online.story">9:16 竖屏</option>
                                <option value="wide" data-i18n="online.wide">16:9 宽屏</option>
                                <option value="custom" data-i18n="online.customRatio">自定义比例</option>
                            </select>
                            <span class="size-pair">
                                <input id="ratioCustomWidth" class="size-custom" type="number" min="1" step="1" placeholder="宽" data-i18n-placeholder="online.ratioWidth" oninput="setCustomRatio()">
                                <input id="ratioCustomHeight" class="size-custom" type="number" min="1" step="1" placeholder="高" data-i18n-placeholder="online.ratioHeight" oninput="setCustomRatio()">
                            </span>
                        </label>
                    </div>
                </div>
                    </div>
                </details>

                <button id="genBtn" onclick="submitImage()" class="nv-beam glass-btn w-full py-5 text-white rounded-3xl font-bold flex items-center justify-center gap-3 shadow-lg" style="position: sticky; bottom: 12px; margin-top: auto;">
                    <i data-lucide="bolt" class="w-4 h-4"></i>
                    <span class="tracking-[0.3em] text-[14px] uppercase" data-i18n="online.generate">Generate</span>
                </button>
        </aside>

        <main class="split-right">
            <div class="split-right-inner">
                <div id="resultBox" class="result-frame flex items-center justify-center relative overflow-hidden">
                    <div id="placeholder" class="text-center space-y-4 opacity-20"><i data-lucide="layout" class="w-12 h-12 mx-auto stroke-[1px]"></i><p class="text-[10px] font-black tracking-[0.5em] uppercase" data-i18n="online.canvasReady">Canvas Ready</p></div>
                    <div id="loader" class="hidden text-center space-y-4"><div class="w-8 h-8 border-2 border-black border-t-transparent rounded-full animate-spin mx-auto"></div><p class="text-[10px] font-black tracking-[0.5em] uppercase" data-i18n="online.generating">Generating</p></div>
                    <img id="outputImg" class="hidden w-full h-full object-contain p-8 cursor-zoom-in" onclick="zoomImage()">
                    <button id="downloadBtn" onclick="downloadGeneratedImage(event)" class="hidden absolute top-8 right-8 w-12 h-12 bg-white/90 shadow-2xl rounded-2xl flex items-center justify-center hover:bg-black hover:text-white"><i data-lucide="download" class="w-4 h-4"></i></button>
                </div>

                <section>
                    <div class="flex items-center gap-6 mb-12"><div class="h-px flex-1 bg-gray-100"></div></div>
                    <div id="masonry" class="masonry-grid"></div>
                    <div id="loadMoreTrigger" class="py-20 text-center text-gray-500 text-[10px] font-bold uppercase tracking-widest cursor-pointer hover:text-black">Load More Archive</div>
                </section>
            </div>
        </main>
    </div>

    <div id="lightbox" onclick="handleOutsideClick(event)" class="hidden fixed inset-0 z-50 gallery-lightbox flex flex-col items-center justify-center p-8">
        <button onclick="closeLightbox()" class="absolute top-10 right-10 text-gray-400 hover:text-black"><i data-lucide="x" class="w-8 h-8"></i></button>
        <div class="w-full flex flex-col items-center pointer-events-none" style="max-width:min(1280px, 92vw)">
            <div id="lightboxFrame" class="studio-preview-frame pointer-events-auto">
                <img id="lightboxImg" class="studio-preview-img" alt="preview">
                <div data-no-pan class="absolute top-6 left-6 bg-black/50 backdrop-blur-md text-white px-3 py-1.5 rounded-xl text-[10px] font-black tracking-widest shadow-2xl pointer-events-auto z-10">
                    <span id="lightboxRes">0x0</span>
                </div>
                <button id="lightboxDownload" onclick="downloadLightboxImage(event)" data-no-pan class="absolute top-6 right-6 bg-black text-white w-12 h-12 rounded-2xl flex items-center justify-center shadow-2xl hover:scale-105 transition-transform pointer-events-auto z-10">
                    <i data-lucide="download" class="w-5 h-5"></i>
                </button>
            </div>
            <div id="lightboxCard" class="w-full mt-16 pointer-events-auto bg-white rounded-[2rem] p-8 shadow-sm flex justify-between items-center gap-8">
                <div class="flex-1">
                    <span class="text-[9px] font-black text-gray-300 uppercase tracking-widest block mb-2">Prompt</span>
                    <p id="lightboxPrompt" class="text-gray-700 text-sm leading-relaxed max-h-32 overflow-y-auto pr-2"></p>
                </div>
                <button id="sameStyleBtn" onclick="applySameStyle()" class="bg-black text-white px-8 py-3.5 rounded-2xl text-[10px] font-black uppercase tracking-widest flex items-center gap-2"><i data-lucide="copy" class="w-4 h-4"></i><span data-i18n="online.reuse">Reuse</span></button>
            </div>
        </div>
    </div>

        function tr(key){ return window.StudioI18n ? StudioI18n.t(key) : key; }
        function applyLanguage(lang){
            if(lang && window.StudioI18n) StudioI18n.set(lang);
            document.title = tr('online.title');
            const loader = document.getElementById('loadMoreTrigger');
            if(loader && !isLoading) loader.innerText = tr('online.loadMore');
        }

            if(event.data?.type === 'studio-lang') applyLanguage(event.data.lang);

            if(event.data?.type === 'providers-changed' || event.data?.type === 'workflows-changed') scheduleProviderRefresh();
        });

            document.title = tr('online.title');

        function getSizeOptionsForModel(model) {
            const m = String(model || '').toLowerCase();
            for (const [key, sizes] of Object.entries(MODEL_SIZE_PRESETS)) {
                if (m.includes(key)) return sizes;
            }
            return SIZE_OPTIONS;
        }

        function currentSizeOptions() {

                var ic = trig.querySelector('.nv-select-trigger-ic');
                if (ic) {
                    var cls = RATIO_ICONS[sel.value];
                    if (cls) { ic.className = 'nv-ratio-ic ' + cls; ic.style.display = ''; }
                    else { ic.style.display = 'none'; }
                }
            }
            function renderMenu() {
                menu.innerHTML = '';
                var normal = [], extra = [];
                var isRatio = sel.id === 'ratioSelect';
                Array.prototype.forEach.call(sel.options, function (opt) {
                    if (opt.hidden) return;
                    (opt.value === 'custom' ? extra : normal).push(opt);
                });
                function addOpt(opt) {
                    var d = document.createElement('div');
                    d.className = 'nv-select-opt' + (opt.selected ? ' sel' : '') + (opt.disabled ? ' disabled' : '');
                    if (isRatio) {
                        var ico = document.createElement('span');
                        ico.className = 'nv-ratio-ic ' + (RATIO_ICONS[opt.value] || 'r-empty');
                        d.appendChild(ico);
                    }
                    var span = document.createElement('span');
                    span.className = 'nv-select-opt-text';
                    span.textContent = opt.textContent;
                    d.appendChild(span);
                    d.addEventListener('click', function () {
                        if (opt.disabled) return;
                        sel.value = opt.value;
                        sel.dispatchEvent(new Event('change', { bubbles: true }));
                        closeMenu();
                    });
                    menu.appendChild(d);
                }
                normal.forEach(addOpt);
                if (extra.length) {
                    var sep = document.createElement('div');
                    sep.className = 'nv-select-sep';
                    menu.appendChild(sep);
                    extra.forEach(addOpt);
                }
                if (window.lucide && typeof lucide.createIcons === 'function') lucide.createIcons();
            }
            function relaxOverflow() {
                var el = menu.parentElement;
                while (el && el !== document.body) {
                    var s = getComputedStyle(el);
                    var sx = s.overflowX, sy = s.overflowY;
                    /* 跳过滚动容器（.split-left / .split-right 等）：它们是 #genBtn sticky 的定位基准，
                       放宽后 sticky 失去滚动容器会导致生成按钮跳动。菜单展开方向已由 openMenu 按视口判断，
                       滚动容器不会把 absolute 菜单裁到不可见 */
                    var isScrollContainer = sx === 'auto' || sx === 'scroll' || sy === 'auto' || sy === 'scroll';
                    if (!isScrollContainer && (sx !== 'visible' || sy !== 'visible')) {
                        if (freed.indexOf(el) === -1) freed.push(el);
                        /* 用 important 压过 theme.css 深色规则 .tool-panel{overflow:hidden!important} 的裁剪 */
                        el.style.setProperty('overflow-x', 'visible', 'important');
                        el.style.setProperty('overflow-y', 'visible', 'important');
                    }
                    el = el.parentElement;
                }
            }
            function restoreOverflow() {
                for (var i = 0; i < freed.length; i++) {
                    freed[i].style.removeProperty('overflow-x');
                    freed[i].style.removeProperty('overflow-y');
                }
                freed = [];
            }
            function openMenu() {
                wrap.classList.add('open');
                renderMenu();
                var c = wrap.closest('.nv-card');
                if (c) c.classList.add('lifted');
                var sc = wrap.closest('.split-left') || wrap.closest('.split-right');
                if (sc) sc.addEventListener('scroll', onViewportChange, { passive: true });
                window.addEventListener('scroll', onViewportChange, { passive: true });
                window.addEventListener('resize', onViewportChange);
                /* 防裁剪：保持 absolute 相对 trigger 定位（fixed 会被 .nv-card backdrop-filter / body transform 劫持包含块导致偏移），
                   打开期间临时放宽裁剪祖先的 overflow，关闭时恢复 */
                relaxOverflow();
                requestAnimationFrame(function () {
                    var tr = trig.getBoundingClientRect();
                    var mh = menu.offsetHeight, gap = 4, edge = 4;
                    menu.style.maxHeight = '';
                    if (tr.bottom + gap + mh <= window.innerHeight - edge) {
                        menu.classList.remove('up');
                    } else if (tr.top - gap - mh >= edge) {
                        menu.classList.add('up');
                    } else {
                        menu.classList.remove('up');
                        menu.style.maxHeight = Math.max(80, window.innerHeight - tr.bottom - gap - edge) + 'px';
                    }
                });
            }
            function onViewportChange() {
                if (wrap.classList.contains('open')) closeMenu();
            }
            function closeMenu() {
                wrap.classList.remove('open');
                menu.classList.remove('up', 'portal');
                menu.style.left = menu.style.top = menu.style.bottom = menu.style.width = menu.style.maxHeight = '';
                /* 其他菜单仍打开时保留 overflow 放宽，防止新打开菜单被旧菜单关闭流程恢复裁剪 */
                if (!document.querySelector('.nv-select-wrap.open')) restoreOverflow();
                var sc = wrap.closest('.split-left') || wrap.closest('.split-right');
                if (sc) sc.removeEventListener('scroll', onViewportChange);
                window.removeEventListener('scroll', onViewportChange);
                window.removeEventListener('resize', onViewportChange);
                var c = wrap.closest('.nv-card');
                if (c && !c.querySelector('.nv-select-wrap.open')) c.classList.remove('lifted');
            }

            function refreshDisabled() {
                if (sel.disabled) wrap.classList.add('disabled');
                else wrap.classList.remove('disabled');
            }

            trig.addEventListener('click', function (e) {
                e.preventDefault();
                if (wrap.classList.contains('open')) closeMenu(); else openMenu();
            });
            trig.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    if (wrap.classList.contains('open')) closeMenu(); else openMenu();
                }
            });
            document.addEventListener('click', function (e) {
                if (wrap.classList.contains('open') && !wrap.contains(e.target)) closeMenu();
            });
            sel.addEventListener('change', syncLabel);
            refreshDisabled();
            if (window.MutationObserver) {
                new MutationObserver(function () {
                    refreshDisabled();
                    if (wrap.classList.contains('open')) renderMenu(); else syncLabel();
                }).observe(sel, { childList: true, subtree: true, attributes: true, attributeFilter: ['hidden', 'disabled', 'selected'] });
            }
            syncLabel();
        }
        function init() {
            document.querySelectorAll('select.size-select').forEach(enhanceSelect);
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
        else init();
        window.addEventListener('studio-lang-change', function () {
            document.querySelectorAll('select.size-select').forEach(function (sel) {
                if (sel.dataset.nvEnhanced) {
                    var t = sel.parentNode.querySelector('.nv-select-label');
                    if (t && sel.options && sel.options[sel.selectedIndex]) t.textContent = sel.options[sel.selectedIndex].textContent;
                }
            });
        });
    })();
    </script>
</body>
</html>
