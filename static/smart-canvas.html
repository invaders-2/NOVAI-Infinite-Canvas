<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <link rel="icon" href="/static/images/logo.png" type="image/png">
    <title>旧智能画布已下线 · 正在打开智能画布BEAT</title>
    <script>(function(){try{var t=localStorage.getItem("studio_theme")||localStorage.getItem("canvas_theme")||"light";if(t==="dark"){document.documentElement.className+=" studio-theme-dark";}}catch(e){}})();</script>
    <style>
        :root { --bg: #f7f7f8; --fg: #1c1c1e; --muted: #6b6b70; }
        html.studio-theme-dark { --bg: #141416; --fg: #f2f2f4; --muted: #9a9aa0; }
        html, body { height: 100%; margin: 0; }
        body {
            display: flex; align-items: center; justify-content: center;
            background: var(--bg); color: var(--fg);
            font: 15px/1.7 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        .retire { max-width: 440px; padding: 32px 28px; text-align: center; }
        .retire h1 { margin: 0 0 10px; font-size: 17px; font-weight: 600; letter-spacing: .01em; }
        .retire p { margin: 0 0 6px; color: var(--muted); font-size: 13.5px; }
        .retire a { color: inherit; text-underline-offset: 3px; }
    </style>
</head>
<body>
    <div class="retire" role="status" aria-live="polite">
        <h1>旧智能画布已下线</h1>
        <p>已改用「智能画布BEAT」，新功能都只在它上面。</p>
        <p>这张老画布会在智能画布BEAT 里打开，正在跳转…</p>
        <p><a id="retireFallback" href="/static/canvas.html">没有自动跳转？点这里打开智能画布BEAT</a></p>
    </div>
    <script>
    /* 旧智能画布（smart-canvas）已下线：老收藏 / 老分享链接都落到这里，
       带着画布 id 跳到 BEAT，让它走既有的旧文档兼容层打开，不再加载旧画布那套实现。 */
    (function () {
        var params = new URLSearchParams(window.location.search || '');
        var id = params.get('id') || '';
        var project = params.get('project') || '';
        var url = '/static/canvas.html';
        var query = [];
        if (id) query.push('id=' + encodeURIComponent(id));
        if (project) query.push('project=' + encodeURIComponent(project));
        if (query.length) url += '?' + query.join('&');
        var fallback = document.getElementById('retireFallback');
        if (fallback) fallback.href = url;
        window.location.replace(url);
    })();
    </script>
</body>
</html>
